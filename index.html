<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>能力管理平台 — 项目入口</title>
<style>
:root {
  --bg: #f8fafc; --card: #fff; --text: #1e293b; --muted: #64748b;
  --primary: #2563eb; --border: #e2e8f0; --shadow: 0 1px 3px rgba(0,0,0,.08);
  --radius: 12px; --gap: 24px; --max: 960px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 48px 20px; }
.container { max-width: var(--max); margin: 0 auto; }
header { text-align: center; margin-bottom: 40px; }
header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
header p { color: var(--muted); font-size: 15px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--gap); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; }
.card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
.card .icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; font-weight: 700; margin-bottom: 14px; }
.card h3 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
.card p { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.6; }
.card a { display: inline-block; padding: 8px 18px; border-radius: 6px; background: var(--primary); color: #fff; font-size: 13px; font-weight: 500; text-decoration: none; transition: opacity .15s; }
.card a:hover { opacity: .9; }
.card a.secondary { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
.card a.secondary:hover { background: #eff6ff; }
footer { text-align: center; margin-top: 40px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>能力管理平台</h1>
    <p>桂教通平台能力开放枢纽 — 产品原型与需求文档</p>
  </header>

  <div class="grid">
    <div class="card">
      <div class="icon" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">P</div>
      <h3>产品原型</h3>
      <p>交互式原型演示，包含全部页面流程与操作逻辑。支持角色切换体验完整业务闭环。</p>
      <a href="output/prototype/index.html">打开原型</a>
    </div>

    <div class="card">
      <div class="icon" style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);">D</div>
      <h3>PRD 需求文档</h3>
      <p>产品需求规格文档，包含范围、业务流程、详细需求、数据字典、状态机、验收标准。</p>
      <a href="output/prd/prd.html">打开 PRD</a>
    </div>

    <!-- <div class="card">
      <div class="icon" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);">S</div>
      <h3>设计文档</h3>
      <p>设计基线文档，包含模块划分、页面布局、交互规范与视觉标准。</p>
      <a href="output/design/design.md" class="secondary">查看 Design</a>
    </div> -->
  </div>

  <footer>
    <p>能力管理平台 · 2026</p>
  </footer>
</div>
</body>
</html>
