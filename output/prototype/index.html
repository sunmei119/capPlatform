      },
      editors: {},
      appOptions: APP_LIST.filter(a => a.appAttr !== '生态应用').slice(0, 30),
      appLoading: false,
      devOptions: VENDORS.slice(0, 30),
      devLoading: false,
      declVisible: false,
      declText: `一、使用范围\n1. 您仅可在本平台授权及审批同意的数据范围内使用相关数据，不得超出审批同意的数据类型、用途及处理方式。\n2. 您应确保数据使用行为符合本平台及所接入业务系统的相关管理规范。\n\n二、数据安全义务\n1. 您应对获取的数据采取必要的技术与管理措施，防止数据泄露、篡改、丢失或非法使用。\n2. 未经授权，不得将数据用于与申请用途无关的场景，不得向第三方提供、出售或交换数据。\n\n三、保密义务\n您对在接入与使用过程中知悉的平台技术信息、数据规范及其他保密信息负有保密义务，未经书面许可不得对外披露。\n\n四、禁止行为\n1. 不得逆向工程、破解、绕过平台安全限制或实施任何危害平台安全的操作。\n2. 不得通过爬虫、刷量、伪造请求等方式干扰平台正常运行。\n\n五、数据保留与销毁\n您应在业务目的实现后及时删除或匿名化处理所获取的个人信息与敏感数据，不得长期留存。\n\n六、合规要求\n您处理个人信息时，应符合《个人信息保护法》等相关法律法规，并已取得必要的授权与同意。\n\n七、责任承担\n因您违反上述约定造成平台或第三方损失的，您应承担相应法律责任与赔偿责任。\n\n八、其他\n本声明解释权归平台运营方所有，平台有权根据管理需要更新本声明并另行通知。`,
    };
  },
  mounted() {
    this.$nextTick(() => this.initScopeEditors());
  },
  beforeUnmount() {
    Object.keys(this.editors).forEach(k => { try { this.editors[k].destroy(); } catch (e) {} });
    this.editors = {};
  },
  computed: {
    syncApis() {
      return APIS.filter(a => a.visible && a.source === 'platform');
    },
  },
  methods: {
    apiById(id) {
      return APIS.find(a => a.id === id);
    },
    initScopeEditors() {
      if (this.isView) return;
      const self = this;
      this.form.scopes.forEach((s, i) => {
        const container = document.getElementById('scope-json-editor-' + i);
        if (!container) return;
        if (this.editors[i]) {
          try { this.editors[i].set(JSON.parse(s.tableJson || '{}')); } catch (e) {}
          return;
        }
        let defaultJson = {};
        try { defaultJson = JSON.parse(s.tableJson || '{}'); } catch (e) { defaultJson = {}; }
        const ed = new JSONEditor(container, {
          mode: 'code',
          modes: ['code', 'tree', 'table'],
          theme: 'jse-theme-default',
          mainMenuBar: [
            { text: '格式化', className: 'jsoneditor-menu-btn', title: '格式化 JSON 并输出到预览框', click: function() { self.formatScope(i); } },
            { text: '清空', className: 'jsoneditor-menu-btn', title: '清空内容', click: function() { self.clearScope(i); } },
            { text: '复制结果', className: 'jsoneditor-menu-btn', title: '复制 JSON 到剪贴板', click: function() { self.copyScope(i); } },
          ],
          statusBar: true,
          search: true,
        });
        try { ed.set(defaultJson); } catch (e) {}
        this.editors[i] = ed;
        this.formatScope(i);
      });
    },
    getScopeText(i) {
      const ed = this.editors[i];
      if (ed) { try { return ed.getText(); } catch (e) { return ''; } }
      return this.form.scopes[i] ? this.form.scopes[i].tableJson || '' : '';
    },
    /* 格式化：将当前范围编辑框文本解析为标准 JSON 格式并输出到预览框；校验失败则在预览框提示 */
    formatScope(i) {
      const s = this.form.scopes[i];
      if (!s) return;
      const raw = this.getScopeText(i);
      if (!raw || !raw.trim()) { s.previewText = ''; s.previewError = false; return; }
      try {
        const val = JSON.parse(raw);
        s.previewText = JSON.stringify(val, null, 2);
        s.previewError = false;
      } catch (e) {
        s.previewError = true;
        s.previewText = 'JSON 格式校验未通过：\n' + (e && e.message ? e.message : String(e));
      }
    },
    clearScope(i) {
      const ed = this.editors[i];
      if (ed) { try { ed.setText('{}'); } catch (e) {} }
      const s = this.form.scopes[i];
      if (s) { s.previewText = ''; s.previewError = false; }
    },
    copyScope(i) {
      const txt = this.getScopeText(i);
      if (!txt) { this.$message.warning('暂无内容可复制'); return; }
      navigator.clipboard.writeText(txt).then(() => this.$message.success('已复制')).catch(() => this.$message.error('复制失败'));
    },
    addScope() {
      this.form.scopes.push({ tableKey: '', tableJson: '', previewText: '', previewError: false });
      this.$nextTick(() => this.initScopeEditors());
    },
    removeScope(index) {
      if (this.editors[index]) { try { this.editors[index].destroy(); } catch (e) {} }
      this.form.scopes.splice(index, 1);
      if (!this.form.scopes.length) this.form.scopes.push({ tableKey: '', tableJson: '', previewText: '', previewError: false });
      this.editors = {};
      this.$nextTick(() => this.initScopeEditors());
    },
    addDoc() {
      const idx = this.form.docs.length + 1;
      this.form.docs.push({
        name: '对接文档' + idx + '.pdf',
        url: 'https://via.placeholder.com/360x240/f0f2f5/909399?text=PDF',
      });
    },
    removeDoc(index) {
      this.form.docs.splice(index, 1);
    },
    searchApps(q) {
      this.appLoading = true;
      setTimeout(() => {
        this.appOptions = APP_LIST.filter(a => a.appAttr !== '生态应用' && (!q || a.appName.includes(q))).slice(0, 30);
        this.appLoading = false;
      }, 300);
    },
    searchDevs(q) {
      this.devLoading = true;
      setTimeout(() => {
        this.devOptions = VENDORS.filter(v => !q || v.name.includes(q)).slice(0, 30);
        this.devLoading = false;
      }, 300);
    },
    submit() {
      if (!this.form.name.trim()) { this.$message.warning('请输入名称'); return; }
      if (!this.form.appId) { this.$message.warning('请选择应用名称'); return; }
      if (this.isSuper && !this.form.devName) { this.$message.warning('请选择开发者'); return; }
      if (this.form.hasApi === '是') {
        if (!this.form.docs.length) { this.$message.warning('请上传至少一个对接文档'); return; }
        if (!this.form.authKey.trim()) { this.$message.warning('请输入认证key'); return; }
        if (this.form.domain && !/^https?:\/\//i.test(this.form.domain.trim())) { this.$message.warning('对接域名需以 http:// 或 https:// 开头'); return; }
      } else {
        let ok = true;
        this.form.scopes.forEach((s, i) => {
          if (!s.tableKey.trim()) { ok = false; return; }
          const raw = this.getScopeText(i);
          if (!raw || !raw.trim()) { ok = false; return; }
          try {
            const v = JSON.parse(raw);
            if (typeof v !== 'object' || v === null || Array.isArray(v)) { ok = false; return; }
          } catch (e) { ok = false; }
        });
        if (!ok) { this.$message.warning('请为每条同步范围填写数据表key，并填写合法的表json（JSON对象）'); return; }
      }
      if (!this.form.reason.trim()) { this.$message.warning('请填写申请理由'); return; }
      if (!this.form.disclaimer) { this.$message.warning('请同意免责声明'); return; }
      const now = new Date();
      const p = n => String(n).padStart(2, '0');
      const timeStr = now.getFullYear() + '-' + p(now.getMonth() + 1) + '-' + p(now.getDate()) + ' ' + p(now.getHours()) + ':' + p(now.getMinutes());
      const app = APP_LIST.find(a => a.appId === this.form.appId);
      const data = {
        id: Date.now(),
        name: this.form.name,
        appId: this.form.appId,
        appName: app ? app.appName : this.form.appName,
        devName: this.isSuper ? this.form.devName : (VENDORS[0] ? VENDORS[0].name : '南宁智课教育科技有限公司'),
        hasApi: this.form.hasApi,
        docs: this.form.hasApi === '是' ? this.form.docs.map(d => ({ ...d })) : [],
        scopes: this.form.hasApi === '否' ? this.form.scopes.map((s, i) => ({ tableKey: s.tableKey.trim(), tableJson: this.getScopeText(i) })) : [],
        authKey: this.form.hasApi === '是' ? this.form.authKey : '',
        domain: this.form.hasApi === '是' ? this.form.domain.trim() : '',
        reason: this.form.reason,
        syncStatus: '待审批',
        applyTime: timeStr,
      };
      DATA_BACKFLOW.unshift(data);
      this.$message.success(this.isSuper ? '数据回流申请已提交，等待审批' : '数据回流申请已提交，等待桂教通超管审批');
      this.$root.go((this.ctx && this.ctx.backPage) || 'P36');
    },
    back() {
      this.$root.go((this.ctx && this.ctx.backPage) || 'P36');
    },
  },
  template: `
  <div>

/* =====================================================================
 * P36Admin 数据回流管理（桂教通超管·授权管理）
 * 与开发者数据回流（P36）共享同一份数据源 DATA_BACKFLOW：开发者提交后
 * 状态为「待审批」并出现在本列表；超管审批通过后进入「联调中」；
 * 有接口：超管「联调完成」→ 已完成；无接口：开发者「联调完成」→「待确认」，
 * 超管核实联调成功后「联调确认」→ 已完成。
 * ===================================================================== */
app.component('P36Admin', {
  props: ['ctx'],
  data() {
    return {
      rows: DATA_BACKFLOW.map(x => ({ ...x })),
      q: { name: '', devName: '', syncStatus: '' },
      audit: { visible: false, row: null, opinion: '通过', note: '' },
      preview: { visible: false, doc: null },
    };
  },
  computed: {
    filtered() {
      return this.rows.filter(r =>
        (!this.q.name || r.name.includes(this.q.name)) &&
        (!this.q.devName || (r.devName || '').includes(this.q.devName)) &&
        (!this.q.syncStatus || r.syncStatus === this.q.syncStatus)
      );
    },
  },
  methods: {
    resetQ() { this.q = { name: '', devName: '', syncStatus: '' }; },
    openAudit(row) { this.audit = { visible: true, row, opinion: '通过', note: '' }; },
    submitAudit() {
      const a = this.audit;
      if (a.opinion === '驳回' && !a.note.trim()) { this.$message.warning('驳回时请填写审批说明'); return; }
      a.row.syncStatus = a.opinion === '通过' ? '联调中' : '已驳回';
      a.row.approver = '王超管';
      a.row.opinion = a.opinion;
      a.row.opinionNote = a.note;
      a.row.approveTime = this.nowStr();
      this.audit.visible = false;
      this.$message.success(a.opinion === '通过' ? '已审批通过，数据回流进入联调中' : '已驳回该申请');
    },
    syncDone(row) {
      this.$confirm('确认将该数据回流标记为「联调完成」？', '提示', { type: 'warning', confirmButtonText: '确定', cancelButtonText: '取消' })
        .then(() => {
          row.syncStatus = '已完成';
          this.$message.success('已标记联调完成');
        }).catch(() => {});
    },
    syncConfirm(row) {
      this.$confirm('请确认该数据回流已联调成功？确认后状态将改为「已完成」。', '提示', { type: 'warning', confirmButtonText: '确定', cancelButtonText: '取消' })
        .then(() => {
          row.syncStatus = '已完成';
          this.$message.success('已确认同步成功');
        }).catch(() => {});
    },
    previewDoc(doc) { this.preview = { visible: true, doc }; },
    scopeText(r) {
      if (r.hasApi === '是') return '接口对接'; // 有接口的对接文档独立成列展示
      const scopes = r.scopes || [];
      if (!scopes.length) return '—';
      return scopes.map(s => (s.tableKey || '未指定数据表')).join(',');
    },
    view(row) {
      this.$root.go('P36Form', { id: row.id, view: true, backPage: 'P36Admin' });
    },
    nowStr() {
      const d = new Date(), p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    },
  },
  template: `
  <div>
    <div class="toolbar">
      <span class="q-label">名称</span><el-input v-model="q.name" placeholder="请输入" clearable style="width:180px"></el-input>
      <span class="q-label">开发者名称</span><el-input v-model="q.devName" placeholder="请输入" clearable style="width:180px"></el-input>
      <span class="q-label">联调状态</span><el-select v-model="q.syncStatus" placeholder="请选择" clearable style="width:130px">
        <el-option label="待审批" value="待审批"></el-option>
        <el-option label="联调中" value="联调中"></el-option>
        <el-option label="待确认" value="待确认"></el-option>
        <el-option label="已完成" value="已完成"></el-option>
      </el-select>
      <el-button @click="resetQ">重置</el-button>
      <div style="flex:1"></div>
    </div>
    <div class="card">
      <el-table :data="filtered" stripe style="width:100%">
        <el-table-column type="index" label="序号" width="60"></el-table-column>
        <el-table-column prop="name" label="名称" min-width="140"></el-table-column>
        <el-table-column prop="appName" label="应用名称" min-width="150"></el-table-column>
        <el-table-column prop="devName" label="开发者名称" min-width="180"></el-table-column>
        <el-table-column prop="hasApi" label="是否有接口" width="100" align="center"></el-table-column>
        <el-table-column label="数据表" min-width="200"><template #default="{row}"><span>{{ scopeText(row) }}</span></template></el-table-column>
        <el-table-column label="对接文档" min-width="160">
          <template #default="{row}">
            <template v-if="row.hasApi === '是'">
              <div v-for="(d,i) in (row.docs||[])" :key="i">
                <el-link type="primary" @click="previewDoc(d)">{{ d.name }}</el-link>
              </div>
            </template>
            <span v-else>—</span>
          </template>
        </el-table-column>
        <el-table-column prop="syncStatus" label="联调状态" width="100" align="center">
          <template #default="{row}"><st-tag :v="row.syncStatus"></st-tag></template>
        </el-table-column>
        <el-table-column prop="applyTime" label="申请时间" width="150"></el-table-column>
        <el-table-column label="操作" width="180" align="center" fixed="right">
          <template #default="{row}">
            <el-button v-if="row.syncStatus === '待审批'" link type="primary" @click="openAudit(row)">审批</el-button>
            <el-button v-if="row.syncStatus === '联调中' && row.hasApi === '是'" link type="primary" @click="syncDone(row)">联调完成</el-button>
            <el-button v-if="row.syncStatus === '待确认'" link type="primary" @click="syncConfirm(row)">联调确认</el-button>
            <el-button link type="primary" @click="view(row)">查看</el-button>
          </template>
        </el-table-column>
      </el-table>
    </div>

    <el-dialog title="审批数据回流申请" v-model="audit.visible" width="520px">
      <el-form label-width="90px" label-position="left">
        <el-form-item label="申请名称"><span>{{ audit.row && audit.row.name }}</span></el-form-item>
        <el-form-item label="开发者名称"><span>{{ audit.row && audit.row.devName }}</span></el-form-item>
        <el-form-item label="是否有接口"><span>{{ audit.row && audit.row.hasApi }}</span></el-form-item>
        <el-form-item label="审批结果">
          <el-radio-group v-model="audit.opinion">
            <el-radio label="通过">通过</el-radio>
            <el-radio label="驳回">驳回</el-radio>
          </el-radio-group>
        </el-form-item>
        <el-form-item label="审批说明">
          <el-input v-model="audit.note" type="textarea" :rows="3" placeholder="驳回时必填，通过时可留空"></el-input>
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="audit.visible=false">取消</el-button>
        <el-button type="primary" @click="submitAudit">确认</el-button>
      </template>
    </el-dialog>

    <el-dialog title="对接文档预览" v-model="preview.visible" width="640px">
      <div v-if="preview.doc" style="text-align:center">
        <div style="font-weight:600;margin-bottom:10px">{{ preview.doc.name }}</div>
        <img :src="preview.doc.url" style="max-width:100%;max-height:56vh;border:1px solid #e4e7ed;border-radius:4px"/>
      </div>
      <template #footer>
        <el-button @click="preview.visible=false">关闭</el-button>
      </template>
    </el-dialog>
  </div>`,
});

/* =====================================================================
 * P36Detail 数据回流明细（桂教通超管·授权管理）
 * 台账式汇总记录各开发者回流数据的明细：开发者、应用、回流数据名称、
 * 回流明细（接口对接/数据表key与表json）、回流状态、申请时间、最近同步时间。
 * 与 P36 / P36Admin 共享同一份数据源 DATA_BACKFLOW，只读展示。
 * ===================================================================== */
/* 数据回流明细：按接口维度展开为一行一条记录 */
function buildBackflowDetailRows(list) {
  const out = [];
  let vi = 0;
  list.forEach(r => {
    if (r.hasApi === '是') {
      out.push({
        key: r.id + '_api', id: r.id, devName: r.devName, appName: r.appName,
        tableKey: '—', tableName: '—', tableJson: '', hasApi: '是', apiName: '平台接口回流（对接文档）', docs: r.docs || [],
        volume: ((vi++ + 3) * 412).toLocaleString() + ' 条',
        status: r.status || '成功', failReason: r.failReason || '', syncTime: r.syncTime || '',
      });
    } else {
      (r.scopes || []).forEach((s, idx) => {
        out.push({
          key: r.id + '_scope_' + idx, id: r.id, devName: r.devName, appName: r.appName,
          tableKey: s.tableKey || '—', tableName: '—', tableJson: s.tableJson || '', hasApi: '否', apiName: s.tableKey || '—', docs: [],
          volume: ((vi++ + 7) * 268).toLocaleString() + ' 条',
          status: s.status || '成功', failReason: s.failReason || '', syncTime: s.syncTime || '',
        });
      });
    }
  });
  return out;
}

/* P36DetailView 回流明细查看：按明细行（接口/数据表类别）展示与列表一致的查看信息 */
app.component('P36DetailView', {
  props: ['ctx'],
  data() {
    return { preview: { visible: false, doc: null } };
  },
  computed: {
    row() {
      const key = this.ctx && this.ctx.key;
      return buildBackflowDetailRows(DATA_BACKFLOW).find(r => r.key === key) || {};
    },
  },
  methods: {
    previewDoc(doc) { this.preview = { visible: true, doc }; },
    back() { this.$root.go((this.ctx && this.ctx.backPage) || 'P36Detail'); },
    tableDisplay(row) {
      const name = row.tableName && row.tableName !== '—' ? row.tableName : '';
      const key = row.tableKey && row.tableKey !== '—' ? row.tableKey : '';
      if (name && key) return name + '（' + key + '）';
      return name || key || '—';
    },
  },
  template: `
  <div class="card" style="max-width:960px">
    <div style="font-weight:600;margin:8px 0 16px">查看回流明细</div>
    <el-form label-width="130px" style="width:100%">
      <el-row :gutter="20">
        <el-col :span="12"><el-form-item label="开发者名称"><div class="ro-text">{{ row.devName || '—' }}</div></el-form-item></el-col>
        <el-col :span="12"><el-form-item label="应用名称"><div class="ro-text">{{ row.appName || '—' }}</div></el-form-item></el-col>
        <el-col :span="12"><el-form-item label="回流类别"><div class="ro-text">{{ row.hasApi === '是' ? '接口回流' : '数据表回流' }}</div></el-form-item></el-col>
        <el-col :span="12"><el-form-item label="同步数据量"><div class="ro-text">{{ row.volume || '—' }}</div></el-form-item></el-col>
        <el-col :span="12"><el-form-item label="回流状态"><div><st-tag :v="row.status || '—'"></st-tag></div></el-form-item></el-col>
        <el-col :span="12"><el-form-item label="最近同步时间"><div class="ro-text">{{ row.syncTime || '—' }}</div></el-form-item></el-col>
        <el-col :span="24"><el-form-item label="失败原因"><div class="ro-text" :style="row.status === '失败' ? 'color:#f56c6c' : ''">{{ row.failReason || '—' }}</div></el-form-item></el-col>
      </el-row>
    </el-form>

    <template v-if="row.hasApi === '是'">
      <div style="border-top:1px dashed #e4e7ed;padding-top:14px;margin-top:14px">
        <div style="font-weight:600;margin-bottom:12px">接口回流内容</div>
        <el-form label-width="130px" style="width:100%">
          <el-form-item label="接口名称"><div class="ro-text">{{ row.apiName || '—' }}</div></el-form-item>
          <el-form-item label="对接文档">
            <div v-if="row.docs && row.docs.length" style="display:flex;flex-wrap:wrap;gap:10px">
              <div v-for="(doc, i) in row.docs" :key="i" style="background:#f5f7fa;padding:6px 12px;border-radius:4px;display:flex;align-items:center;gap:8px">
                <span style="font-size:13px">{{ doc.name }}</span>
                <el-button link type="primary" size="small" @click="previewDoc(doc)">预览</el-button>
              </div>
            </div>
            <div v-else class="ro-text">—</div>
          </el-form-item>
        </el-form>
      </div>
    </template>
    <template v-else>
      <div style="border-top:1px dashed #e4e7ed;padding-top:14px;margin-top:14px">
        <div style="font-weight:600;margin-bottom:12px">数据表回流内容</div>
        <el-form label-width="130px" style="width:100%">
          <el-form-item label="数据表key"><div class="ro-text">{{ tableDisplay(row) }}</div></el-form-item>
          <el-form-item label="表json">
            <div v-if="row.tableJson" class="ro-text" style="white-space:pre-wrap;background:#f5f7fa;border:1px solid #e4e7ed;border-radius:4px;padding:10px 12px;line-height:1.6">{{ row.tableJson }}</div>
            <div v-else class="ro-text">—</div>
          </el-form-item>
        </el-form>
      </div>
    </template>

    <div style="text-align:center;margin-top:18px">
      <el-button @click="back">返回</el-button>
    </div>

    <el-dialog title="对接文档预览" v-model="preview.visible" width="640px">
      <div v-if="preview.doc" style="text-align:center">
        <div style="font-weight:600;margin-bottom:10px">{{ preview.doc.name }}</div>
        <img :src="preview.doc.url" style="max-width:100%;max-height:56vh;border:1px solid #e4e7ed;border-radius:4px"/>
      </div>
      <template #footer>
        <el-button @click="preview.visible=false">关闭</el-button>
      </template>
    </el-dialog>
  </div>`,
});

app.component('P36Detail', {
  props: ['ctx'],
  data() {
    return {
      rows: buildBackflowDetailRows(DATA_BACKFLOW),
      q: { devName: '', appName: '', status: '' },
      preview: { visible: false, doc: null },
    };
  },
  computed: {
    filtered() {
      return this.rows.filter(r =>
        (!this.q.devName || (r.devName || '').includes(this.q.devName)) &&
        (!this.q.appName || (r.appName || '').includes(this.q.appName)) &&
        (!this.q.status || r.status === this.q.status)
      );
    },
  },
  methods: {
    resetQ() { this.q = { devName: '', appName: '', status: '' }; },
    syncTimeText(r) { return r.syncTime || '—'; },
    previewDoc(doc) { this.preview = { visible: true, doc }; },
    view(row) {
      this.$root.go('P36DetailView', { key: row.key, backPage: 'P36Detail' });
    },
    manualSync(row) {
      this.$confirm('将手动调用接口拉取回流数据，是否继续？', '手动同步', {
        confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning',
      }).then(() => {
        row.status = '成功';
        row.failReason = '';
        row.syncTime = this.nowStr();
        this.$message.success('接口调用成功，回流数据已拉取');
      }).catch(() => {});
    },
    nowStr() {
      const p = n => String(n).padStart(2, '0');
      const d = new Date();
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    },
  },
  template: `
  <div>
    <div class="toolbar">
      <span class="q-label">开发者名称</span><el-input v-model="q.devName" placeholder="请输入" clearable style="width:180px"></el-input>
      <span class="q-label">应用名称</span><el-input v-model="q.appName" placeholder="请输入" clearable style="width:180px"></el-input>
      <span class="q-label">回流状态</span><el-select v-model="q.status" placeholder="请选择" clearable style="width:130px">
        <el-option label="成功" value="成功"></el-option>
        <el-option label="失败" value="失败"></el-option>
      </el-select>
      <el-button @click="resetQ">重置</el-button>
      <span style="color:#909399;font-size:12px">按接口维度记录各开发者回流数据的明细与回流结果</span>
    </div>
    <div class="card">
      <el-table :data="filtered" stripe style="width:100%">
        <el-table-column type="index" label="序号" width="60"></el-table-column>
        <el-table-column prop="devName" label="开发者名称" min-width="160"></el-table-column>
        <el-table-column prop="appName" label="应用名称" min-width="140"></el-table-column>
        <el-table-column prop="tableKey" label="数据表key" min-width="160"></el-table-column>
        <el-table-column prop="apiName" label="接口名称" min-width="170"></el-table-column>
        <el-table-column label="同步数据量" width="130" align="center">
          <template #default="{row}"><span>{{ row.volume || '—' }}</span></template>
        </el-table-column>
        <el-table-column label="回流状态" width="100" align="center">
          <template #default="{row}"><st-tag :v="row.status"></st-tag></template>
        </el-table-column>
        <el-table-column label="失败原因" min-width="180">
          <template #default="{row}"><span :style="row.status==='失败'?'color:#f56c6c':'color:#909399'">{{ row.failReason || '—' }}</span></template>
        </el-table-column>
        <el-table-column label="最近同步时间" width="150">
          <template #default="{row}"><span>{{ syncTimeText(row) }}</span></template>
        </el-table-column>
        <el-table-column label="操作" width="150" align="center" fixed="right">
          <template #default="{row}">
            <el-button v-if="row.hasApi === '是' && row.status === '失败'" link type="primary" @click="manualSync(row)">手动同步</el-button>
            <el-button link type="primary" @click="view(row)">查看</el-button>
          </template>
        </el-table-column>
      </el-table>
    </div>

    <el-dialog title="对接文档预览" v-model="preview.visible" width="640px">
      <div v-if="preview.doc" style="text-align:center">
        <div style="font-weight:600;margin-bottom:10px">{{ preview.doc.name }}</div>
        <img :src="preview.doc.url" style="max-width:100%;max-height:56vh;border:1px solid #e4e7ed;border-radius:4px"/>
      </div>
      <template #footer>
        <el-button @click="preview.visible=false">关闭</el-button>
      </template>
    </el-dialog>
  </div>`,
});

app.mount('#app');
</script>
</body>
</html>
