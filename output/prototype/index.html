    };

        if (m.page === this.page) return m.label;
        if (m.children && m.children.some(c => c.page === this.page)) return m.label;
      }
      return '';

      this.page = index;

  props: ['ctx'],

    return {
      rows: VENDORS.map(v => ({ ...v, showAdmin: false, showPhone: false })),

      assignVisible: false, assignTarget: null, assignSelected: [],
    };
  },
  computed: {
    filtered() {
      return this.rows.filter(r =>
        (!this.q.name || r.name.includes(this.q.name)) &&
        (!this.q.type || r.type === this.q.type));

    allApps() { return APP_LIST; },

    openCoop(r) { this.coopTarget = r; this.coopForm = { reason: '', time: '' }; this.coopVisible = true; },
    confirmCoop() {
      if (!this.coopForm.reason || !this.coopForm.time) { this.$message.warning('请填写合作原因与合作时间'); return; }
      this.coopTarget.coop = '合作中'; this.coopVisible = false; this.$message.success('已确认合作，合作状态已记录');
    },
    openCancel(r) { this.cancelTarget = r; this.coopForm = { reason: '', time: '' }; this.cancelVisible = true; },
    confirmCancel() {
      if (!this.coopForm.reason || !this.coopForm.time) { this.$message.warning('请填写取消合作原因与合作时间'); return; }
      this.cancelTarget.coop = '已取消'; this.cancelVisible = false; this.$message.success('已取消合作');
    },
    openRecoop(r) { this.recoopTarget = r; this.coopForm = { reason: '', time: '' }; this.recoopVisible = true; },
    confirmRecoop() {
      if (!this.coopForm.reason || !this.coopForm.time) { this.$message.warning('请填写重新合作原因与合作时间'); return; }
      this.recoopTarget.coop = '合作中'; this.recoopVisible = false; this.$message.success('已重新合作');

    openAssign(r) { this.assignTarget = r; this.assignSelected = []; this.assignVisible = true; },
    confirmAssign() {
      if(!this.assignSelected.length){ this.$message.warning('请至少选择一个应用'); return; }

        : '确认启用该开发者？';

        .then(() => { r.status = to; this.$message.success('已' + to); }).catch(() => {});

            <el-button v-if="s.row.coop==='合作中'" link type="danger" @click="openCancel(s.row)">取消合作</el-button>

/* =====================================================================
 * P01aApprove 开发者信息审批（开发者信息审批 - 审批）
 * 界面布局参考「接口申请审批」（P09）：
 * 申请信息 + 厂商信息（入驻申请）或变更前后记录（企业信息变更）+ 审批意见（通过/不通过）
 * 入驻申请审批通过后生成开发者管理员账号（可登录开发者平台）并进入开发者列表
 * 企业信息变更审批通过后修改生效；审批不通过则驳回，申请人可重新提交
 * ===================================================================== */
app.component('P01aApprove', {
  props: ['ctx'],
  data() {
    const row = DEV_APPROVALS.find(x => x.id === (this.ctx && this.ctx.id)) || DEV_APPROVALS[0];
    return { row, opinion: '通过', note: '' };
  },
  methods: {
    submit() {
      if (this.opinion === '不通过' && !this.note) { this.$message.warning('不通过时审批说明必填'); return; }
      const r = this.row;
      if (this.opinion === '通过') {
        if (r.type === 'enter') {
          const d = r.draft;
          VENDORS.push({
            id: Math.max(0, ...VENDORS.map(v => v.id)) + 1,
            name: d.name, type: d.type, legalPerson: d.legalPerson, admin: d.admin, phone: d.phone,
            isPublicSea: d.isPublicSea, socialCode: d.socialCode, logo: d.logo, products: d.products,
            license: d.license, registerAddr: d.registerAddr, detailAddr: d.detailAddr, vatPayer: d.vatPayer,
            intro: d.intro, companyPhone: d.companyPhone, businessDeadline: d.businessDeadline,
            portal: d.portal, coop: '未合作', coopTime: '', coopReason: '',
            cancelTime: '', cancelReason: '', recoopTime: '', status: '启用', applyDate: r.submitTime.slice(0, 10),
          });
          this.$message.success('审批通过，开发者管理员账号已生成，可登录开发者平台');
        } else {
          const v = VENDORS.find(x => x.id === r.vendorId);
          if (v && r.draft) Object.assign(v, r.draft);
          this.$message.success('审批通过，企业信息修改已生效');
        }
      } else {
        this.$message.warning('已审批不通过，入驻/修改不生效，申请人可重新提交');
      }
      const idx = DEV_APPROVALS.findIndex(x => x.id === r.id);
      if (idx > -1) DEV_APPROVALS.splice(idx, 1);
      this.$root.go('P01a');
    },
  },
  template: `
  <div>
    <div class="card" style="max-width:none">
      <div style="font-weight:600;margin:8px 0 12px">申请信息</div>
      <el-form label-width="120px" style="margin-bottom:18px">

        <el-form label-width="120px">
          <el-row :gutter="16">
            <el-col :span="12"><el-form-item label="开发者名称"><div class="ro-text">{{ row.draft.name }}</div></el-form-item></el-col>
            <el-col :span="12"><el-form-item label="开发者类型"><div class="ro-text">{{ row.draft.type }}</div></el-form-item></el-col>
            <el-col :span="12"><el-form-item label="是否归属公海"><div class="ro-text">{{ row.draft.isPublicSea ? '是' : '否' }}</div></el-form-item></el-col>
            <el-col :span="12"><el-form-item label="统一社会信用代码"><div class="ro-text">{{ row.draft.socialCode }}</div></el-form-item></el-col>
            <el-col :span="12"><el-form-item label="法人代表"><div class="ro-text">{{ row.draft.legalPerson }}</div></el-form-item></el-col>
            <el-col :span="12"><el-form-item label="管理员"><div class="ro-text">{{ row.draft.admin }}</div></el-form-item></el-col>
            <el-col :span="12"><el-form-item label="管理员手机号"><div class="ro-text">{{ row.draft.phone }}</div></el-form-item></el-col>
            <el-col :span="12"><el-form-item label="公司电话"><div class="ro-text">{{ row.draft.companyPhone }}</div></el-form-item></el-col>
            <el-col :span="12"><el-form-item label="营业期限"><div class="ro-text">{{ row.draft.businessDeadline }}</div></el-form-item></el-col>

            <el-col :span="24"><el-form-item label="工商注册地址"><div class="ro-text">{{ row.draft.registerAddr }}</div></el-form-item></el-col>

              <div style="display:flex;flex-wrap:wrap;gap:14px">
                <div v-for="(im, i) in (row.draft.license || [])" :key="i" style="text-align:center">
                  <el-image :src="im.url" :preview-src-list="(row.draft.license||[]).map(x=>x.url)" style="width:180px;height:120px;border-radius:4px"/>

});

/* =====================================================================
 * P02 新增/编辑开发者
 * 三段可折叠区：基础信息（必填集中）/ 财务信息（选填）/ 开票信息（选填）
 * ===================================================================== */
app.component('P02', {
  props: ['ctx'],
  data() {
    const src = this.ctx && this.ctx.vendorId ? VENDORS.find(v => v.id === this.ctx.vendorId) : null;
    return {
      activeCollapse: ['base', 'finance', 'invoice'],
      showSuccess: false,
      // 基础信息
      base: src ? {
        name: src.name, type: src.type, legalPerson: '', admin: src.admin, adminPhone: src.phone,
        isPublicSea: false, socialCode: '', logo: [], products: [], license: [],
        registerAddr: '', detailAddr: '', vatPayer: true,
        intro: '', companyPhone: '', businessDeadline: '', portal: src.portal,
      } : {
        name: '', type: '企业', legalPerson: '', admin: '', adminPhone: '',
        isPublicSea: true, socialCode: '', logo: [], products: [], license: [],
        registerAddr: '', detailAddr: '', vatPayer: true,
        intro: '', companyPhone: '', businessDeadline: '', portal: false,
      },
      // 财务信息（选填）
      finance: { bankType: '', bankName: '', bankAccount: '', accountPurpose: '' },
      // 开票信息（选填）
      invoice: { addr: '', taxNo: '', phone: '', bank: '', bankAcc: '', bankLine: '' },
    };
  },
  methods: {
    onFileChange(file, fileList, target) { this[target] = fileList; },
    save() {
      const b = this.base;
      const missing = [];
      if (!b.name) missing.push('开发者名称');
      if (!b.legalPerson) missing.push('法人代表');
      if (!b.admin) missing.push('管理员');
      if (!b.socialCode) missing.push('统一社会信用代码');
      if (!b.adminPhone) missing.push('管理员手机号');
      if (!b.registerAddr) missing.push('工商注册地址');
      if (!b.detailAddr) missing.push('详细地址');
      if (!b.intro) missing.push('开发者简介');
      if (!b.companyPhone) missing.push('公司电话');
      if (!b.businessDeadline) missing.push('营业期限');
      if (!b.logo || !b.logo.length) missing.push('开发者logo');
      if (!b.products || !b.products.length) missing.push('产品材料');
      if (!b.license || !b.license.length) missing.push('营业执照');
      if (missing.length) { this.$message.warning('请填写必填项：' + missing.join('、')); return; }
      if (!/^\d{11}$/.test(b.adminPhone)) { this.$message.warning('管理员手机号格式不正确'); return; }
      if (b.socialCode.length !== 18) { this.$message.warning('统一社会信用代码需 18 位'); return; }
      // 编辑模式（已审批通过的开发者信息）：直接保存
      if (this.ctx && this.ctx.vendorId) {
        const v = VENDORS.find(x => x.id === this.ctx.vendorId);
        if (v) { v.name = b.name; v.admin = b.admin; v.phone = b.adminPhone; v.portal = b.portal; }
        this.$message.success('已保存');
        this.$root.go('P01');
        return;
      }
      // 新增 / 邀请注册：生成入驻申请待审核数据，审批通过后才生成开发者管理员账号
      DEV_APPROVALS.push({
        id: Math.max(0, ...DEV_APPROVALS.map(x => x.id)) + 1,
        type: 'enter',
        source: this.$root.standalone ? '邀请注册' : '超管新增',
        vendorName: b.name,
        submitTime: new Date().toLocaleString('zh-CN', { hour12: false }),
        status: '待审核',
        changes: [],
        draft: {
          name: b.name, type: b.type, isPublicSea: b.isPublicSea, socialCode: b.socialCode,
          legalPerson: b.legalPerson, admin: b.admin, phone: b.adminPhone, vatPayer: b.vatPayer,
          companyPhone: b.companyPhone, businessDeadline: b.businessDeadline, registerAddr: b.registerAddr,
          detailAddr: b.detailAddr, portal: b.portal, intro: b.intro,
          logo: b.logo.map(x => ({ url: x.url || x.raw || '', name: x.name || '' })),
          license: b.license.map(x => ({ url: x.url || x.raw || '', name: x.name || '' })),
          products: b.products,
        },
      });
      if (this.$root.standalone) { this.showSuccess = true; } else { this.$message.success('已提交入驻申请，待桂教通超管审批通过后生成开发者账号'); this.$root.go('P01'); }
    },
    goBack() {
      if (this.$root.standalone) { window.close(); } else { this.$root.go('P01'); }
    },
  },
  template: `
  <div>
    <el-alert v-if="!$root.standalone && !(ctx && ctx.vendorId)" type="info" :closable="false" style="margin-bottom:14px" show-icon
      title="提交的入驻信息将生成待审核数据，经桂教通超管在「开发者信息审批」中审批通过后，才生成开发者管理员账号并展示在开发者列表"/>

      <div style="width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);display:flex;align-items:center;justify-content:center;margin-bottom:32px;box-shadow:0 8px 24px rgba(102,126,234,0.3)">
        <svg style="width:64px;height:64px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 6L9 17L4 12" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <div style="font-size:22px;font-weight:600;color:#303133;margin-bottom:12px;text-align:center;line-height:1.7;max-width:520px">

      </div>
    </div>
    <el-collapse v-else v-model="activeCollapse">
      <!-- 折叠区 1：基础信息 -->

        <template #title>
          <span style="font-weight:600;font-size:14px;padding-left:6px">基础信息</span>

/* =====================================================================
 * P04a 接口分类管理
 * 功能点：树形分类维护（新增/编辑/删除/启用/停用），最多五层
 * ===================================================================== */
app.component('P04a', {
  data() {
    return {
      q: { name:'', status:'' },
      tree: [
        { id:1, name:'基础服务', code:'BASE', sort:1, status:'启用', level:1, children:[
          { id:11, name:'用户基础', code:'BASE_USER', sort:1, status:'启用', level:2, parentId:1, children:[
            { id:111, name:'身份认证', code:'BASE_USER_AUTH', sort:1, status:'启用', level:3, parentId:11, children:[] }
          ]},
          { id:12, name:'组织基础', code:'BASE_ORG', sort:2, status:'启用', level:2, parentId:1, children:[] },
        ]},
        { id:2, name:'数据服务', code:'DATA', sort:2, status:'启用', level:1, children:[
          { id:21, name:'成绩数据', code:'DATA_SCORE', sort:1, status:'停用', level:2, parentId:2, children:[] },
        ]},
        { id:3, name:'业务服务', code:'BIZ', sort:3, status:'启用', level:1, children:[] },
      ],
      dlgVisible: false,
      dlgTitle: '新增分类',
      form: { name:'', code:'', sort:0, parentId:null, parentName:'' },
      editId: null,
    };
  },
  methods: {
    filterTree(nodes) {
      if(!this.q.name && !this.q.status) return nodes;
      const match = n => (!this.q.name || n.name.includes(this.q.name)) && (!this.q.status || n.status===this.q.status);
      const filter = list => list.reduce((acc, n) => {
        const kids = n.children ? filter(n.children) : [];
        if(match(n) || kids.length) acc.push({...n, children: match(n)&&!this.q.name ? n.children : kids});
        return acc;
      }, []);
      return filter(nodes);
    },
    resetQuery() { this.q = { name:'', status:'' }; },
    getLevel(node) {
      let lv = 1, cur = node;
      const findParent = (tree, pid) => { for(const n of tree){ if(n.id===pid) return n; if(n.children){ const r=findParent(n.children,pid); if(r) return r; } } return null; };
      while(cur && cur.parentId){ cur = findParent(this.tree, cur.parentId); lv++; }
      return lv;
    },
    openAdd(parent) {
      if(parent && this.getLevel(parent)>=5){ this.$message.warning('最多支持五层分类'); return; }
      this.dlgTitle = parent ? '新增子分类' : '新增顶级分类';
      this.form = { name:'', code:'', sort:0, parentId: parent?parent.id:null, parentName: parent?parent.name:'' };
      this.editId = null;
      this.dlgVisible = true;
    },
    openEdit(row) {
      this.dlgTitle = '编辑分类';
      this.form = { name:row.name, code:row.code, sort:row.sort, parentId:row.parentId||null, parentName:'' };
      this.editId = row.id;
      this.dlgVisible = true;
    },
    saveForm() {
      if(!this.form.name){ this.$message.warning('请填写分类名称'); return; }
      if(!this.form.code){ this.$message.warning('请填写分类编码'); return; }
      this.$message.success(this.editId ? '编辑成功' : '新增成功');
      this.dlgVisible = false;
    },
    toggleStatus(row) {
      const action = row.status==='启用' ? '停用' : '启用';
      ElMessageBox.confirm(`确认${action}分类"${row.name}"？`, '提示', {type:'warning'}).then(()=>{
        row.status = action==='停用' ? '停用' : '启用';
        this.$message.success(`已${action}`);
      }).catch(()=>{});
    },
    delRow(row) {
      if(row.children && row.children.length){ this.$message.warning('存在子分类或被接口引用，无法删除'); return; }
      ElMessageBox.confirm(`确认删除分类"${row.name}"？删除后不可恢复`, '提示', {type:'warning'}).then(()=>{
        this.$message.success('已删除');
      }).catch(()=>{});
    },
  },
  template: `
  <div>
    <div class="toolbar">
      <span class="q-label">分类名称</span>
      <el-input v-model="q.name" placeholder="请输入分类名称" clearable style="width:200px"></el-input>
      <span class="q-label">分类状态</span>
      <el-select v-model="q.status" placeholder="请选择" clearable style="width:140px">
        <el-option label="启用" value="启用"></el-option>
        <el-option label="停用" value="停用"></el-option>
      </el-select>
      <el-button type="primary" @click="$forceUpdate()">查询</el-button>
      <el-button @click="resetQuery">重置</el-button>
      <el-button type="primary" @click="openAdd(null)">新增顶级分类</el-button>
    </div>
    <div class="card">
      <el-table :data="filterTree(tree)" row-key="id" :tree-props="{children:'children'}" stripe default-expand-all>
        <el-table-column prop="name" label="分类名称" min-width="200"></el-table-column>
        <el-table-column prop="code" label="分类编码" width="180"></el-table-column>
        <el-table-column prop="sort" label="排序" width="80"></el-table-column>
        <el-table-column label="分类状态" width="100">
          <template #default="{row}"><el-tag :type="row.status==='启用'?'success':'info'" size="small">{{ row.status }}</el-tag></template>
        </el-table-column>
        <el-table-column label="操作" min-width="280">
          <template #default="{row}">
            <el-button link type="primary" @click="openAdd(row)">新增子分类</el-button>
            <el-button link @click="openEdit(row)">编辑</el-button>
            <el-button link :type="row.status==='启用'?'warning':'primary'" @click="toggleStatus(row)">{{ row.status==='启用'?'停用':'启用' }}</el-button>
            <el-button link type="danger" @click="delRow(row)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>
    </div>
    <el-dialog v-model="dlgVisible" :title="dlgTitle" width="480px" destroy-on-close>
      <el-form label-width="100px">
        <el-form-item label="父级分类" v-if="form.parentId!==null"><el-input :model-value="form.parentName" disabled></el-input></el-form-item>
        <el-form-item label="分类名称" required><el-input v-model="form.name" maxlength="50" placeholder="请输入分类名称"></el-input></el-form-item>
        <el-form-item label="分类编码" required><el-input v-model="form.code" maxlength="50" placeholder="全局唯一编码"></el-input></el-form-item>
        <el-form-item label="排序"><el-input-number v-model="form.sort" :min="0" controls-position="right"></el-input-number></el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="dlgVisible=false">取消</el-button>
        <el-button type="primary" @click="saveForm">确定</el-button>
      </template>
    </el-dialog>

/* =====================================================================
 * P35 接口能力管理
 * 功能点：能力列表（左右分栏，左侧能力卡片 + 右侧关联接口表格）/ 新增能力（新界面）/ 编辑能力（新界面）/ 添加接口 / 移出接口
 * ===================================================================== */
app.component('P35', {
  data() {
    return {
      caps: CAPABILITY_LIST,
      activeId: CAPABILITY_LIST.length ? CAPABILITY_LIST[0].id : null,
      addApiDlg: false, tempApiIds: [],
    };
  },
  computed: {
    activeCap() { return this.caps.find(c => c.id === this.activeId) || null; },
    linkedApis() {
      if (!this.activeCap) return [];
      return APIS.filter(a => this.activeCap.apiIds.includes(a.id));
    },
    availableApis() {
      if (!this.activeCap) return [];
      return APIS.filter(a => !this.activeCap.apiIds.includes(a.id));
    },
  },
  methods: {
    selectCap(c) { this.activeId = c.id; },
    strip(html) { return (html || '').replace(/<[^>]+>/g, '').trim(); },
    addCap() { this.$root.go('P35Form'); },
    editCap(c) { this.$root.go('P35Form', { id: c.id, from: 'P35' }); },
    viewCap(c) { this.$root.go('P35View', { id: c.id, from: 'P35' }); },
    docOf(api){ const a = (APIS||[]).find(x=>x.id===api.id); return a ? (a.doc||'') : ''; },
    openDoc(api){ const u = this.docOf(api); if(u) window.open(u, '_blank'); },

/* =====================================================================
 * P35Form 新增/编辑能力（新界面方式）
 * 功能点：能力名称（必填，不超过20字符）/ 能力说明（必填，富文本编辑器）

app.component('P35Form', {
  props: ['ctx'],
  data() {
    const src = this.ctx && this.ctx.id ? CAPABILITY_LIST.find(c => c.id === this.ctx.id) : null;
    return {
      form: src ? { id: src.id, name: src.name, desc: src.desc } : { id: null, name: '', desc: '' },
      editor: null,
    };
  },
  mounted() { this.initEditor(); },
  beforeUnmount() { if (this.editor) { this.editor.destroy(); this.editor = null; } },
  methods: {
    initEditor() {
      const wang = window.wangEditor;
      if (!wang) return;
      this.editor = wang.createEditor({
        selector: document.getElementById('capDescEditor'),
        html: this.form.desc || '<p><br></p>',
        config: { placeholder: '请输入能力说明' },
        mode: 'default',
      });
      wang.createToolbar({
        editor: this.editor,
        selector: document.getElementById('capDescToolbar'),
        config: {},
        mode: 'default',
      });
    },
    stripHtml(html) { return (html || '').replace(/<[^>]+>/g, '').trim(); },
    backTo() { return this.ctx && this.ctx.from ? this.ctx.from : 'P35'; },
    goBack() { this.$root.go(this.backTo()); },
    save() {
      const name = (this.form.name || '').trim();
      if (!name) { ElMessage.warning('能力名称为必填项'); return; }
      if (name.length > 20) { ElMessage.warning('能力名称不超过20个字符'); return; }
      const desc = this.stripHtml(this.form.desc) ? this.form.desc : '';
      if (!desc) { ElMessage.warning('能力说明为必填项'); return; }
      if (this.form.id) {
        const idx = CAPABILITY_LIST.findIndex(c => c.id === this.form.id);
        if (idx > -1) CAPABILITY_LIST.splice(idx, 1, { ...CAPABILITY_LIST[idx], name, desc });
      } else {
        CAPABILITY_LIST.push({ id: Date.now(), name, desc, apiIds: [] });
      }
      ElMessage.success('保存成功');
      this.$root.go(this.backTo());
    },
  },
  template: `

             : { name:'', service:'', iTypes:['机构'], type:'非敏感接口', apiCategory:'', apiType:'', method:'POST', needAuth:true, needOrgApproval:false, reqUrl:'', visible:true, maxCalls:10000, version:'', paramLink:'', encryptReturn:'否', remark:'' },

      if(this.f.type==='敏感接口' && this.f.encryptReturn!=='是'){this.f.encryptReturn='是';}
      if(this.f.remark && this.f.remark.length>500){this.$message.warning('备注不能超过500字符');return;}
      if(!this.f.version){this.$message.warning('请填写版本号');return;}
      if(!this.f.apiCategory){this.$message.warning('请选择接口分类');return;}

      if(!this.f.maxCalls||this.f.maxCalls<=0){this.$message.warning('请填写最大调用量/日');return;}
      const dup = APIS.find(a => a.id!==(this.ctx&&this.ctx.apiId) && a.reqUrl && a.reqUrl.trim()===this.f.reqUrl.trim());
      if(dup){this.$message.warning('接口请求地址已存在，需全局唯一：'+dup.name);return;}

/* =====================================================================
 * P06 接口文档查看
 * ===================================================================== */
app.component('P06', {
  props: ['ctx'],
  data() {
    const a = APIS.find(x=>x.id===(this.ctx&&this.ctx.apiId));
    return { api: a || APIS[0] };
  },
  computed: {
    reqExample() {
      const ps = (this.api.params||[]).filter(x=>x.required).map(x=>'&'+x.name+'='+(x.type==='string'?'示例值':'1')).join('');
      return this.api.methods[0]+' '+this.api.reqUrl+'?access_token=ACCESS_TOKEN'+ps;
    },
    resExample() {
      const d = {}; (this.api.params||[]).forEach(p=>{ d[p.name] = p.type==='string'?'示例值':(p.type==='int32'?1:true); });
      return JSON.stringify({ errcode:0, errmsg:'ok', data:d }, null, 2);
    },
  },
  template: `
  <div>
    <div class="doc-header">
      <h2>{{ api.name }}</h2>
      <p>使用场景：{{ api.name }}，服务名 {{ api.service }}</p>
    </div>

    <div class="doc-label">权限说明：</div>
    <table class="doc-tbl">
      <tr><th style="width:35%">权限项</th><th style="width:25%">说明</th><th>备注</th></tr>
      <tr><td>应用是否需要申请白名单</td><td>{{ api.needAuth ? '需要' : '不需要' }}</td><td></td></tr>
      <tr><td>用户凭证</td><td>未支持</td><td></td></tr>
      <tr><td>机构凭证</td><td>支持</td><td>获取不到用户凭证的后台管理场景使用</td></tr>
    </table>

    <p class="doc-field"><b>请求方式：</b>{{ api.methods.join(' / ') }}（HTTPS）</p>
    <p class="doc-field"><b>请求地址：</b><a :href="api.reqUrl" target="_blank" style="color:#1890ff">{{ api.reqUrl }}</a></p>

    <p style="color:#909399;font-size:12px">注意：全量查询仅适用于数据量较少的场景；请尽量按需获取，减少全量查询带来的时延问题。</p>
    <p style="font-size:12px">推荐请求地址：<a :href="api.reqUrl+'?access_token=ACCESS_TOKEN'" target="_blank" style="color:#1890ff">{{ api.reqUrl }}?access_token=ACCESS_TOKEN</a></p>

    <div class="doc-label">返回参数：</div>
    <table class="doc-tbl">
      <tr><th>参数</th><th>类型</th><th>说明</th></tr>
      <tr><td>errcode</td><td>int32</td><td>返回码</td></tr>
      <tr><td>errmsg</td><td>string</td><td>对返回码的文本描述内容</td></tr>
      <tr><td>data</td><td>object</td><td>返回数据对象</td></tr>
    </table>

    <div class="doc-label">请求示例：</div>
    <pre class="doc-code">{{ reqExample }}</pre>

    <div class="doc-label">返回示例：</div>
    <pre class="doc-code">{{ resExample }}</pre>

    <div style="margin-top:14px;text-align:center"><el-button @click="$root.go((ctx&&ctx.from)||'P04')">返回接口列表</el-button></div>
  </div>`,
});

/* =====================================================================
 * P07 应用授权
 * 功能点：应用授权 / 添加授权 / 批量移除授权 / 移除授权
 * ===================================================================== */
app.component('P07', {
  props: ['ctx'],
  data() {
    const a = APIS.find(x=>x.id===(this.ctx&&this.ctx.apiId));
    const api = a || APIS[0];
    const preAuth = ['app_1001','app_1002'];
    return { api,
      rows: APP_LIST.filter(x=>preAuth.includes(x.appId)).map(x=>({...x, checked:false, dataScope: x.scopeOrgs.join('、') + ' / ' + (x.scopeGradeMode==='all' ? '所有学段' : x.grades.join('、'))})),
      q:{appName:'',appId:''}, mAdd:false, addChosen:[], mBatch:false,
      addPage: 1, addPageSize: 10, addQuery: { appName: '', appId: '', appAttr: '' },
    };
  },
  computed: {
    authorizedIds(){ return this.rows.map(x=>x.appId); },
    availableApps(){ return APP_LIST.filter(x=>!this.authorizedIds.includes(x.appId) && x.appAttr === '生态应用'); },
    chosenApps(){ return this.addChosen.map(id => APP_LIST.find(a=>a.appId===id)).filter(Boolean); },
    batchCount(){ return this.rows.filter(x=>x.checked).length; },
    filteredAddApps() {
      const q = this.addQuery;
      return this.availableApps.filter(a =>
        (!q.appName || a.appName.includes(q.appName)) &&
        (!q.appId || a.appId.includes(q.appId)) &&
        (!q.appAttr || a.appAttr === q.appAttr)
      );
    },
    pagedAddApps() {
      const start = (this.addPage - 1) * this.addPageSize;
      return this.filteredAddApps.slice(start, start + this.addPageSize);
    },
  },
  methods: {
    removeApp(row){ this.rows = this.rows.filter(x=>x.appId!==row.appId); this.$message.success('已移除授权'); },
    confirmBatch(){ const sel=this.rows.filter(x=>x.checked); this.rows=this.rows.filter(x=>!x.checked); this.mBatch=false; this.$message.success('已移除 '+sel.length+' 个应用授权'); },
    toggleAdd(row){ const id=row.appId; const i=this.addChosen.indexOf(id); if(i>=0)this.addChosen.splice(i,1); else this.addChosen.push(id); },
    isChosen(row){ return this.addChosen.includes(row.appId); },
    isAllChecked(){ return this.pagedAddApps.length>0 && this.pagedAddApps.every(a=>this.addChosen.includes(a.appId)); },
    toggleAllAdd(checked) {
      if (checked) {
        this.pagedAddApps.forEach(a => { if(!this.addChosen.includes(a.appId)) this.addChosen.push(a.appId); });
      } else {
        const pageIds = this.pagedAddApps.map(a => a.appId);
        this.addChosen = this.addChosen.filter(id => !pageIds.includes(id));
      }
    },
    confirmAdd(){ this.addChosen.forEach(id=>{ const a=APP_LIST.find(x=>x.appId===id); if(a){ const scope = a.scopeOrgs.join('、') + ' / ' + (a.scopeGradeMode==='all' ? '所有学段' : a.grades.join('、')); this.rows.push({...a, checked:false, dataScope: scope}); } }); this.addChosen=[]; this.mAdd=false; this.$message.success('已添加授权，接口拉取数据范围为应用的上架范围'); },
    openAddDialog() {
      this.addChosen = [];
      this.addQuery = { appName: '', appId: '', appAttr: '' };
      this.addPage = 1;
      this.mAdd = true;
    },
  },
  template: `
  <div>
    <div class="card">
      <div style="margin-bottom:14px">接口名称：<b>{{ api.name }}</b></div>
      <div class="toolbar" style="margin-bottom:10px">
        <span class="q-label">应用名称</span><el-input v-model="q.appName" placeholder="请输入应用名称" clearable style="width:160px"></el-input>
        <span class="q-label">应用ID</span><el-input v-model="q.appId" placeholder="请输入应用ID" clearable style="width:150px"></el-input>
        <el-button type="primary">查询</el-button>
        <div style="flex:1"></div>
        <el-button type="primary" @click="openAddDialog">添加授权</el-button>
        <el-button :disabled="!batchCount" @click="mBatch=true">批量移除授权</el-button>
      </div>
      <el-table :data="rows" stripe>
        <el-table-column width="50"><template #default="s"><el-checkbox v-model="s.row.checked"></el-checkbox></template></el-table-column>
        <el-table-column prop="appId" label="应用ID" width="120"></el-table-column>
        <el-table-column prop="appName" label="应用名称"></el-table-column>
        <el-table-column prop="appAttr" label="应用属性" width="100"></el-table-column>
        <el-table-column label="数据范围（应用上架范围）" min-width="200"><template #default="s">{{ s.row.dataScope }}</template></el-table-column>
        <el-table-column label="操作" width="100"><template #default="s"><el-button link type="danger" @click="removeApp(s.row)">移除授权</el-button></template></el-table-column>
      </el-table>
    </div>
    <el-dialog v-model="mAdd" title="添加授权" width="860px" :close-on-click-modal="false">
      <div style="display:flex;gap:16px;min-height:400px">
        <!-- 左侧：搜索 + 表格（可正常多选） -->
        <div style="flex:1;display:flex;flex-direction:column">
          <div style="margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <span class="q-label">应用名称</span><el-input v-model="addQuery.appName" placeholder="请输入应用名称" clearable style="width:140px" size="default"></el-input>
            <span class="q-label">应用ID</span><el-input v-model="addQuery.appId" placeholder="请输入应用ID" clearable style="width:120px" size="default"></el-input>
            <span class="q-label">应用属性</span><el-select v-model="addQuery.appAttr" placeholder="请选择" clearable style="width:150px" size="default">
              <el-option label="生态应用" value="生态应用"></el-option>
            </el-select>
            <el-button type="primary" size="default">查询</el-button>
          </div>
          <el-table :data="pagedAddApps" border size="small" style="width:100%">
            <el-table-column width="44" align="center">
              <template #header>
                <el-checkbox :model-value="isAllChecked()" @change="toggleAllAdd"></el-checkbox>
              </template>
              <template #default="s">
                <el-checkbox :model-value="isChosen(s.row)" @change="toggleAdd(s.row)"></el-checkbox>
              </template>
            </el-table-column>
            <el-table-column prop="appName" label="应用名称" min-width="150"></el-table-column>
            <el-table-column prop="appId" label="应用ID" width="110"></el-table-column>
            <el-table-column prop="appAttr" label="应用属性" min-width="140"></el-table-column>
          </el-table>
          <div style="display:flex;justify-content:flex-end;margin-top:10px">
            <el-pagination
              v-model:current-page="addPage"
              :page-size="addPageSize"
              :total="filteredAddApps.length"
              layout="total, prev, pager, next, sizes"
              :page-sizes="[10, 20, 50]"
              @size-change="v => { addPageSize = v; addPage = 1; }"
              small
            ></el-pagination>
          </div>
        </div>
        <!-- 右侧：已选应用 -->
        <div style="width:200px;border-left:1px solid #e4e7ed;padding-left:14px;display:flex;flex-direction:column">
          <div style="font-size:13px;color:#909399;margin-bottom:8px;font-weight:500">已选择应用（{{ addChosen.length }}）</div>
          <div style="flex:1;overflow-y:auto">
            <div v-for="app in chosenApps" :key="app.appId" style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f2f3f5">
              <span style="font-size:13px">{{ app.appName }}</span>
              <el-button link type="danger" size="small" @click="toggleAdd(app)" style="font-size:14px;padding:0">×</el-button>
            </div>
            <div v-if="!addChosen.length" style="color:#c0c4cc;font-size:12px;text-align:center;padding:20px 0">尚未选择</div>
          </div>
        </div>
      </div>
      <template #footer>
        <el-button @click="mAdd=false">取消</el-button>
        <el-button type="primary" :disabled="!addChosen.length" @click="confirmAdd">确认授权</el-button>
      </template>
    </el-dialog>
    <el-dialog v-model="mBatch" title="批量移除授权" width="440px">
      <p style="margin:0 0 10px">以下应用将被移除授权：</p>
      <el-tag v-for="r in rows.filter(x=>x.checked)" :key="r.appId" style="margin:2px">{{ r.appName }}</el-tag>
      <template #footer><el-button @click="mBatch=false">取消</el-button><el-button type="danger" @click="confirmBatch">确认移除</el-button></template>
    </el-dialog>
  </div>`,
});

/* =====================================================================
 * P08 接口申请记录（开发者从应用管理「接口申请」提交，桂教通超管审批）
 * 功能点：接口申请记录列表及查询 / 超管审批（P09）/ 记录查看（P10）
 * ===================================================================== */
app.component('P08', {
  props: ['ctx'],
  data() {
    return { q:{ name:'', status:'' }, showKey:{} };
  },
  computed: {
    isSuper(){ return this.$root.role==='super'; },
    isDev(){ return this.$root.role==='dev'; },
    sorted(){
      const arr = API_REQS.filter(r=> (!this.q.name||r.apis.some(a=>a.name.includes(this.q.name))) && (!this.q.status||r.status===this.q.status));
      return arr.slice().sort((a,b)=>(a.status===b.status?0:a.status==='未审批'?-1:1));
    },
  },
  methods: {
    apiNames(row){ return (row.apis||[]).map(a=>a.name).join(','); },
    apiIdsOf(row){ return (row.apis||[]).map(a => { const x = APIS.find(y=>y.name===a.name); return x ? x.id : null; }).filter(Boolean); },
    appNameOf(row){ const a = APP_LIST.find(x=>x.appId===row.appId); return a ? a.appName : (row.appId||'—'); },
    resubmit(row){ this.$root.go('P28ApplyApi', { appId: row.appId, apiIds: this.apiIdsOf(row) }); },
  },
  template: `
  <div>
    <div class="toolbar">
      <span class="q-label">接口名称</span><el-input v-model="q.name" placeholder="请输入接口名称" clearable style="width:150px"></el-input>

      </el-select>
      <el-button type="primary">查询</el-button>
      <el-button @click="q.name='';q.status=''">重置</el-button>
      <span style="color:#909399;font-size:12px">最新未审批数据排最前</span>
    </div>
    <div class="card">
      <el-table :data="sorted" stripe>
        <el-table-column label="应用名称" min-width="150">
          <template #default="s"><span>{{ appNameOf(s.row) }}</span></template>
        </el-table-column>
        <el-table-column v-if="isSuper" prop="vendor" label="开发者名称" min-width="140"></el-table-column>
        <el-table-column label="授权接口" min-width="220">
          <template #default="s"><span>{{ apiNames(s.row) }}</span></template>
        </el-table-column>
        <el-table-column prop="applyTime" label="申请时间" width="110"></el-table-column>
        <el-table-column label="授权截止时间" width="110"><template #default="s"><span>{{ s.row.deadline || '—' }}</span></template></el-table-column>
        <el-table-column label="审批状态" width="90"><template #default="s"><st-tag :v="s.row.status"/></template></el-table-column>
        <el-table-column label="操作" min-width="150" fixed="right">
          <template #default="s">
            <el-button v-if="s.row.status==='未审批' && isSuper" link type="primary" @click="$root.go('P09',{appId:s.row.id})">审批</el-button>
            <el-button link @click="$root.go('P10',{appId:s.row.id})">查看</el-button>
            <el-button v-if="(s.row.status==='已审批' && s.row.opinion==='不通过') && isDev" link type="warning" @click="resubmit(s.row)">重新提交</el-button>
          </template>
        </el-table-column>
      </el-table>
    </div>
  </div>`,
});

app.component('P08Auth', {

  data() {
    return { q:{ name:'', appId:'', status:'' }, showKey:{} };
  },
  computed: {
    isDev(){ return this.$root.role==='dev'; },
    // 所有记录（授权记录 + 已审批通过）合并为单一列表，按机构拆分，一个机构一条
    allRows(){
      const arr = API_APPS.filter(r=> (!this.q.name||r.apis.some(a=>a.name.includes(this.q.name))) && (!this.q.appId||r.appId.includes(this.q.appId)) && (!this.q.status||r.status===this.q.status));
      return arr.flatMap(r=>this.splitOrgs(r));
    },
    curRows(){
      // 排序：未审批优先；同为未审批或同状态时，申请/审批时间最新者优先
      return this.allRows.slice().sort((a,b)=>{
        if(a.status==='未审批' && b.status!=='未审批') return -1;
        if(a.status!=='未审批' && b.status==='未审批') return 1;
        const ta = (a.status==='已审批' ? (a.approveTime||'') : (a.applyTime||'')).replace(/[\s:-]/g,'');
        const tb = (b.status==='已审批' ? (b.approveTime||'') : (b.applyTime||'')).replace(/[\s:-]/g,'');
        return tb.localeCompare(ta);
      });
    },
  },
  methods: {
    apiNames(row){ return (row.apis||[]).map(a=>a.name).join(','); },
    appNameOf(row){ const a = APP_LIST.find(x=>x.appId===row.appId); return a ? a.appName : (row.appId||'—'); },
    // 申请时一个机构为一条数据：按分号拆分机构名称生成多条记录
    splitOrgs(r){
      const orgs = String(r.orgs||'').split(/[;；]/).map(s=>s.trim()).filter(Boolean);
      if(orgs.length<=1) return [{ ...r }];
      return orgs.map((o,i)=>({ ...r, orgs:o, _rid: String(r.id)+'-'+i }));
    },
  },
  template: `

app.component('P27', {
  data() {
    const today = this.todayStr();
    return { rows: CALL_RECORDS.map(x => ({ ...x })), q: { apiName: '', vendor: '', result: '', appId: '', callTime: [today, today] } };
  },
  computed: {
    filtered() {
      const range = this.q.callTime;
      const start = Array.isArray(range) && range[0] ? String(range[0]) : '';
      const end = Array.isArray(range) && range[1] ? String(range[1]) : start;
      return this.rows.filter(r => {
        const day = (r.time || '').slice(0, 10);
        if (!day) return false;
        if (start && day < start) return false;
        if (end && day > end) return false;
        if (this.q.apiName && !r.apiName.includes(this.q.apiName)) return false;
        if (this.q.vendor && !r.vendor.includes(this.q.vendor)) return false;
        if (this.q.result && r.result !== this.q.result) return false;
        if (this.q.appId && !(r.appId || '').includes(this.q.appId)) return false;
        return true;
      });
    },
  },
  methods: {
    todayStr() { const d = new Date(); const p = n => (n < 10 ? '0' + n : '' + n); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); },
    resetQ() { this.q.apiName = ''; this.q.vendor = ''; this.q.appId = ''; this.q.callTime = [this.todayStr(), this.todayStr()]; this.q.result = ''; },

app.component('P17', {
  data() {
    return {
      q: { name: '', status: '' },
      rows: SUBACCOUNTS.map(x=>({...x})),
      addVisible: false,
      addForm: { name: '', phone: '' },
    };
  },
  computed: {
    filtered() {
      return this.rows.filter(r =>
        (!this.q.name || r.name.includes(this.q.name)) &&
        (!this.q.status || r.status === this.q.status));
    },
  },
  methods: {
    openAdd(){ this.addForm = { name:'', phone:'' }; this.addVisible = true; },
    add(){
      const f = this.addForm;
      if(!f.name){ this.$message.warning('请填写员工姓名'); return; }
      if(!f.phone){ this.$message.warning('请填写员工手机号'); return; }
      if(!/^\d{11}$/.test(f.phone)){ this.$message.warning('员工手机号格式不正确'); return; }
      const id = this.rows.length ? Math.max(...this.rows.map(x=>x.id)) + 1 : 1;
      this.rows.push({ id, name: f.name, phone: f.phone, create: new Date().toISOString().slice(0,10), status: '启用' });
      this.addVisible = false; this.$message.success('已新增子账号（默认启用）');
    },
    toggle(r){
      const to = r.status === '启用' ? '停用' : '启用';
      const tip = to === '停用'
        ? '确认停用该子账号？停用后该账号不可登录开发者平台。'
        : '确认启用该子账号？';
      this.$confirm(tip, to === '停用' ? '停用' : '启用', { type: 'warning', confirmButtonText: '确定', cancelButtonText: '取消' })
        .then(() => { r.status = to; this.$message.success('已' + to); }).catch(() => {});
    },
  },
  template: `
  <div>
    <div class="toolbar">
      <span class="q-label">员工姓名</span><el-input v-model="q.name" placeholder="请输入员工姓名" clearable style="width:160px"></el-input>
      <span class="q-label">状态</span><el-select v-model="q.status" placeholder="请选择" clearable style="width:120px">

        <el-option label="停用" value="停用"></el-option>
      </el-select>
      <div style="flex:1"></div>
      <el-button type="primary" @click="openAdd">新增子账号</el-button>
    </div>
    <el-alert type="info" :closable="false" style="margin-bottom:14px" show-icon
      title="停用状态的子账号不可登录开发者平台。"></el-alert>
    <div class="card">
      <el-table :data="filtered" stripe>
        <el-table-column prop="name" label="员工姓名" min-width="120"></el-table-column>
        <el-table-column prop="phone" label="员工手机号" min-width="140"></el-table-column>
        <el-table-column prop="create" label="添加时间" width="120"></el-table-column>
        <el-table-column label="状态" width="100"><template #default="s"><st-tag :v="s.row.status"/></template></el-table-column>
        <el-table-column label="操作" width="110">
          <template #default="s">
            <el-button link :type="s.row.status === '启用' ? 'warning' : 'success'" @click="toggle(s.row)">{{ s.row.status === '启用' ? '停用' : '启用' }}</el-button>
          </template>
        </el-table-column>
      </el-table>
    </div>
    <el-dialog v-model="addVisible" title="新增子账号" width="480px" append-to-body>
      <el-form label-width="110px" style="max-width:420px">
        <el-form-item label="员工姓名" required><el-input v-model="addForm.name" placeholder="请输入员工姓名" maxlength="50"></el-input></el-form-item>
        <el-form-item label="员工手机号" required><el-input v-model="addForm.phone" placeholder="请输入11位手机号" maxlength="11"></el-input></el-form-item>
      </el-form>
      <template #footer><el-button @click="addVisible=false">取消</el-button><el-button type="primary" @click="add">保存</el-button></template>
    </el-dialog>
  </div>`,
});

app.component('P20', {
  props: ['ctx'],
  data() {
    const a = APIS.find(x=>x.id===(this.ctx&&this.ctx.apiId));
    return { api: a || APIS[0] };
  },
  computed: {
    reqExample() {
      const ps = (this.api.params||[]).filter(x=>x.required).map(x=>'&'+x.name+'='+(x.type==='string'?'示例值':'1')).join('');
      return this.api.methods[0]+' '+this.api.reqUrl+'?access_token=ACCESS_TOKEN'+ps;
    },
    resExample() {
      const d = {}; (this.api.params||[]).forEach(p=>{ d[p.name] = p.type==='string'?'示例值':(p.type==='int32'?1:true); });
      return JSON.stringify({ errcode:0, errmsg:'ok', data:d }, null, 2);
    },
  },
  template: `
  <div>
    <div class="doc-header">
      <h2>{{ api.name }}</h2>

    <p style="color:#909399;font-size:12px">注意：全量查询仅适用于数据量较少的场景；请尽量按需获取，减少全量查询带来的时延问题。</p>

  </div>`,
});

  data(){ return {
    app:{}, form:{ name:'', desc:'', category:'', dataSync:false, openType:['PCweb','H5'], logoList:[], videoList:[],
          scopeOrgs:['学校'], scopeGradeMode:'all', grades:[], attr:'生态应用',
          pcRoles:['教育局职工','学生','学校教职工'],
          pcUrl: { protocol:'https://', domain:'' },
          h5Roles:['教育局职工','学生','学校教职工'],
          h5Url: { protocol:'https://', domain:'' },
          miniRoles:['教育局职工','学生','学校教职工'],
          miniUrl: { protocol:'https://', domain:'' },
          miniWxAppid:'', whiteList:[] },
    rules:{
      name:[{required:true,message:'请输入应用名称',trigger:'blur'}],
      desc:[{required:true,message:'请输入应用简介',trigger:'blur'}],
      category:[{required:true,message:'请选择所属分类',trigger:'change'}],
    },
  };},
  computed:{
    mode(){ return this.$root.ctx?.mode || (this.$root.ctx?.id ? 'view' : 'add'); },
    isEdit(){ return this.mode==='edit'; },
    isView(){ return this.mode==='view'; },
    title(){ return this.isView ? '查看应用' : (this.isEdit ? '编辑应用' : '新增应用'); },
    // 当前可见性配置中填写的地址，作为白名单默认回填来源
    visibleUrls(){
      const urls = [this.form.pcUrl, this.form.h5Url, this.form.miniUrl];
      return urls.map(u => (u && u.domain) ? u.protocol + u.domain : '').filter(Boolean);
    },
    // 自动回填的白名单（标签展示用，只读来源）
    autoWhiteList(){
      return this.visibleUrls.map(u=>{
        const proto = u.startsWith('http://') ? 'http://' : 'https://';
        const domain = this.stripProtocol(u);
        return domain ? proto + domain : '';
      }).filter(Boolean);
    },
  },
  watch:{
    visibleUrls:{
      deep:true,
      handler(vals){
        if(this.isView) return;
        // 不再自动追加到 whiteList，仅用于标签展示
      }
    }
  },
  created(){
    const id=this.$root.ctx?.id;
    if(id){
      const a = this.$root.apps?.find(x=>x.appId===id);
      if(a){ this.app=a; if(this.isEdit){ const d=a.d||{}; this.form={ name:a.name, desc:d.desc||'', category:a.category, dataSync:!!d.dataSync, openType:d.openType||['PCweb','H5'], logoList:[], videoList:[],
        scopeOrgs:d.scopeOrgs||['学校'], scopeGradeMode:d.scopeGradeMode||'all', grades:d.grades||[], attr:d.attr||'',
        pcRoles:d.pcRoles||[], pcUrl:(typeof d.pcUrl==='string')?{protocol:'https://',domain:d.pcUrl||''}:{protocol:'https://',domain:(d.pcUrl&&d.pcUrl.domain)||''},
        h5Roles:d.h5Roles||[], h5Url:(typeof d.h5Url==='string')?{protocol:'https://',domain:d.h5Url||''}:{protocol:'https://',domain:(d.h5Url&&d.h5Url.domain)||''},
        miniRoles:d.miniRoles||[], miniUrl:(typeof d.miniUrl==='string')?{protocol:'https://',domain:d.miniUrl||''}:{protocol:'https://',domain:(d.miniUrl&&d.miniUrl.domain)||''},
        miniWxAppid:d.miniWxAppid||'', whiteList:(d.whiteList&&d.whiteList.length)?d.whiteList.map(w=>({...w})):[{protocol:'https://',domain:''}] }; } }
    } else {
      // 新增模式：白名单默认为空，用户通过"新增白名单"手动添加
      if(!this.form.whiteList.length) this.form.whiteList.push({ protocol:'https://', domain:'' });
    }
  },
  methods:{
    stripProtocol(u){ return u.replace(/^https?:\/\//,'').replace(/\/.*$/,'').trim(); },
    addWhiteItem(){ this.form.whiteList.push({ protocol:'https://', domain:'' }); },
    removeWhiteItem(index){ this.form.whiteList.splice(index, 1); if(!this.form.whiteList.length) this.form.whiteList.push({ protocol:'https://', domain:'' }); },
    removeAutoWhite(index){
      // 关闭默认回填标签时仅隐藏该标签，不影响手动编辑区
      // 可选：将对应域名追加到 whiteList 手动区供用户确认
      const tag = this.autoWhiteList[index];
      if(!tag) return;
      const domain = this.stripProtocol(tag);
      if(domain && !this.form.whiteList.some(w=>w.domain===domain)){
        this.form.whiteList.push({ protocol: tag.startsWith('http://') ? 'http://' : 'https://', domain });
      }
    },
    submit(){ this.$refs.formRef.validate(ok=>{ if(!ok)return; this.$message.success('应用信息已提交，等待桂教通管理员审核'); this.$root.go('P28'); }); } },
});

/* =====================================================================
 * P28Apply 数据授权申请（从应用管理操作列「授权申请」打开，内容为原接口申请）
 * 字段：应用名称、授权接口、最大调用量/日、同步范围类型、机构名称、
 *       是否包含下级、申请理由、免责声明
 * 提交后生成数据授权记录，由机构管理员审批；审批通过后开发者获取数据授权
 * 注：白名单字段已移至应用新增界面（P29），由可见性配置地址回填
 * ===================================================================== */
app.component('P28Apply', {
  props: ['ctx'],
  data() {
    const app = (this.$root.apps || []).find(x => x.appId === (this.ctx && this.ctx.appId));
    return {
      appName: app ? app.name : (this.ctx && this.ctx.appId) || '',
      apiDialog: false,
      declVisible: false,
      chosenApiIds: [],
      apiMaxCalls: {},     // 接口id -> 该接口的最大调用量/日
      apiPage: 1,
      apiPageSize: 5,
      form: {
        syncRangeTypes: ['学校'],
        schoolNames: '',
        orgNames: '',
        deadline: '',
        includeSub: '是',
        reason: '',
        agreeDisclaimer: false,

/* =====================================================================
 * P30 客户端授权关联（桂教通超管）
 * 列表：客户端ID / 客户端秘钥 / 授权范围 / 使用状态（使用中/未使用）
 *     / 授权类型 / 回调地址 / 登出后回调地址 / 访问令牌有效期(秒)
 *     / 刷新令牌有效期(秒) / 操作（编辑、启用、停用、数据授权、接口授权、信息查看）
 * P31 数据授权配置（新开表单页）：是否全部数据/同步范围类型/学校名称/机构名称/授权截止时间
 * P31B 接口授权配置（新开表单页）：是否全部接口/授权接口（与数据授权分开维护）
 * ===================================================================== */
app.component('P30', {
  data() {
    return {
      clients: CLIENT_AUTH.map(x => ({ ...x })),
      q: { clientId: '', clientType: '', enableStatus: '' },
      showSecret: new Set(),
      dialog: false,
      dialogTitle: '新增客户端授权',
      editingId: null,
      form: {
        clientId: '', redirectUri: '', logoutRedirectUri: '',
        accessTokenExp: 7200, refreshTokenExp: 2592000,
        whiteList: '', remark: '',
      },
      appr: { visible: false, row: null, opinion: '通过', note: '' },
      clientTypeOptions: ['平台授权', '机构申请'],
      rangeTypeOptions: ['学校', '教育局'],
    };
  },
  computed: {
    filtered() {
      return this.clients.filter(r =>
        (!this.q.clientId || r.clientId.includes(this.q.clientId)) &&
        (!this.q.clientType || r.clientType === this.q.clientType) &&
        (!this.q.enableStatus || r.enableStatus === this.q.enableStatus)
      );
    },
  },
  methods: {
    resetQ() { this.q = { clientId: '', clientType: '', enableStatus: '' }; },
    maskSecret(s) {
      if (!s) return '';
      if (s.length <= 6) return s;
      return s.slice(0, 4) + '****' + s.slice(-4);
    },
    toggleSecret(row) {
      const next = new Set(this.showSecret);
      if (next.has(row.clientId)) next.delete(row.clientId); else next.add(row.clientId);
      this.showSecret = next;
    },
    scopeText(r) {
      const parts = [];
      if (r.allData === '是') { parts.push('全部数据'); }
      else {
        const types = (r.syncRangeTypes || []);
        if (!types.length) parts.push(r.authScopeText || '—');
        else parts.push(types.map(t => t + '：' + (t === '学校' ? (r.schoolNames || '') : (r.orgNames || ''))).join('；'));
      }
      if (r.allApis === '是') parts.push('接口：全部');
      return parts.join('；');
    },
    apiNamesText(r) {
      if (r.allApis === '是') return '全部接口';
      const ids = r.apiIds || [];
      if (!ids.length) return '—';
      return ids.map(id => { const a = APIS.find(x => x.id === id); return a ? a.name : id; }).join('、');
    },
    genSecret() { return 'sct_' + Math.random().toString(36).slice(2, 18); },
    openAdd() {
      this.dialogTitle = '新增客户端授权';
      this.editingId = null;
      this.form = { clientName: '', clientId: '', clientType: '平台授权', redirectUri: '', logoutRedirectUri: '', accessTokenExp: 7200, refreshTokenExp: 2592000, whiteList: '', remark: '' };
      this.dialog = true;
    },
    openEdit(row) {
      this.dialogTitle = '编辑客户端授权';
      this.editingId = row.clientId;
      this.form = { ...row, whiteList: row.whiteList || '', remark: row.remark || '' };
      this.dialog = true;
    },
    submit() {
      if (!this.form.clientName || !this.form.clientName.trim()) { this.$message.warning('请填写客户端名称'); return; }
      if (this.form.clientName.trim().length > 50) { this.$message.warning('客户端名称不超过50个字符'); return; }
      if (!this.form.clientId.trim() || !/^[a-zA-Z0-9_]+$/.test(this.form.clientId.trim())) { this.$message.warning('请填写客户端ID（仅限数字、英文字母和下划线）'); return; }
      if (!this.form.redirectUri.trim()) { this.$message.warning('请填写回调地址'); return; }
      if (!this.form.logoutRedirectUri.trim()) { this.$message.warning('请填写登出后回调地址'); return; }
      if (!this.form.accessTokenExp || this.form.accessTokenExp <= 0) { this.$message.warning('请填写访问令牌有效期'); return; }
      if (this.form.refreshTokenExp === '' || this.form.refreshTokenExp === null) { this.$message.warning('请填写刷新令牌有效期'); return; }
      if (!this.form.whiteList.trim()) { this.$message.warning('请填写白名单（支持填写 * 表示放行不限制）'); return; }
      const data = {
        ...this.form,
        whiteList: this.form.whiteList.split('\n').map(s => s.trim()).filter(Boolean).join('\n'),
        clientId: this.form.clientId.trim(),
        clientType: this.form.clientType || '平台授权',
        approvalStatus: this.editingId ? (this.clients.find(x => x.clientId === this.editingId) || {}).approvalStatus || '已通过' : '已通过',
        clientSecret: this.editingId ? (this.clients.find(x => x.clientId === this.editingId) || {}).clientSecret : this.genSecret(),
        enableStatus: this.editingId ? (this.clients.find(x => x.clientId === this.editingId) || {}).enableStatus || '启用' : '启用',
      };
      if (this.editingId) {
        const idx = this.clients.findIndex(x => x.clientId === this.editingId);
        if (idx > -1) this.clients.splice(idx, 1, data);
        this.$message.success('客户端授权已保存');
      } else {
        this.clients.unshift(data);
        this.$message.success('客户端授权已新增');
      }
      this.dialog = false;
    },
    toggleStatus(row) {
      const next = row.enableStatus === '启用' ? '停用' : '启用';
      this.$confirm('确认将客户端「' + row.clientId + '」' + (next === '启用' ? '启用' : '停用') + '？', '提示', { type: 'warning', confirmButtonText: '确定', cancelButtonText: '取消' })
        .then(() => { row.enableStatus = next; this.$message.success('已' + (next === '启用' ? '启用' : '停用')); })
        .catch(() => {});
    },
    openApprove(row) {
      this.appr = { visible: true, row, opinion: '通过', note: '' };
    },
    submitApprove() {
      const r = this.appr.row;
      if (this.appr.opinion === '不通过' && !this.appr.note.trim()) { this.$message.warning('审核不通过时，审核说明必填'); return; }
      r.approvalStatus = this.appr.opinion === '通过' ? '已通过' : '已驳回';
      r.enableStatus = this.appr.opinion === '通过' ? '启用' : '停用';
      if (this.appr.opinion === '通过') {
        // 机构申请：审批通过后才生成客户端ID与客户端秘钥
        if (!r.clientId) r.clientId = 'gc_' + Math.random().toString(36).slice(2, 10) + '_' + Math.random().toString(36).slice(2, 6);
        if (!r.clientSecret) r.clientSecret = this.genSecret();
        this.$message.success('已审批通过，已生成客户端凭证（客户端ID与客户端秘钥）');
      } else {
        this.$message.success('已驳回');
      }
      this.appr.visible = false;
    },
  },
  template: `
  <div>
    <div class="toolbar">
      <span class="q-label">客户端ID</span><el-input v-model="q.clientId" placeholder="请输入" clearable style="width:160px"></el-input>
      <span class="q-label">客户端类型</span><el-select v-model="q.clientType" placeholder="请选择" clearable style="width:140px">
        <el-option v-for="o in clientTypeOptions" :key="o" :label="o" :value="o"></el-option>
      </el-select>
      <span class="q-label">启用状态</span><el-select v-model="q.enableStatus" placeholder="请选择" clearable style="width:130px">
        <el-option label="启用" value="启用"></el-option><el-option label="停用" value="停用"></el-option>
      </el-select>
      <el-button @click="resetQ">重置</el-button>
      <div style="flex:1"></div>
      <el-button type="primary" @click="openAdd">新增</el-button>
    </div>
    <div class="card">
      <el-table :data="filtered" stripe style="width:100%">
      <el-table-column prop="clientId" label="客户端ID" min-width="130"></el-table-column>
      <el-table-column prop="clientName" label="客户端名称" min-width="150" show-overflow-tooltip></el-table-column>
      <el-table-column label="客户端类型" width="110" align="center">
        <template #default="{row}"><st-tag :v="row.clientType"></st-tag></template>
      </el-table-column>
      <el-table-column label="客户端秘钥" min-width="220">
        <template #default="{row}">
          <span style="font-family:monospace">{{ showSecret.has(row.clientId) ? row.clientSecret : maskSecret(row.clientSecret) }}</span>
          <el-button link type="primary" size="small" style="margin-left:6px" @click="toggleSecret(row)">{{ showSecret.has(row.clientId) ? '隐藏' : '👁' }}</el-button>
        </template>
      </el-table-column>
      <el-table-column label="授权范围" min-width="200">
        <template #default="{row}"><span>{{ scopeText(row) }}</span></template>
      </el-table-column>
      <el-table-column label="白名单" min-width="160" show-overflow-tooltip>
        <template #default="{row}"><span>{{ row.whiteList || '—' }}</span></template>
      </el-table-column>
      <el-table-column label="授权截止时间" width="110" align="center"><template #default="{row}"><span>{{ row.deadline || '—' }}</span></template></el-table-column>
      <el-table-column label="启用状态" width="100" align="center">
        <template #default="{row}"><st-tag :v="row.enableStatus"></st-tag></template>
      </el-table-column>
      <el-table-column prop="accessTokenExp" label="访问令牌有效期(秒)" width="130" align="center"></el-table-column>
      <el-table-column prop="refreshTokenExp" label="刷新令牌有效期(秒)" width="140" align="center"></el-table-column>
      <el-table-column label="操作" width="320" align="center" fixed="right">
        <template #default="{row}">
          <template v-if="row.clientType==='平台授权'">
            <el-button link type="primary" @click="openEdit(row)">编辑</el-button>
            <el-button link :type="row.enableStatus==='启用'?'warning':'primary'" @click="toggleStatus(row)">{{ row.enableStatus==='启用'?'停用':'启用' }}</el-button>
            <el-button link type="primary" @click="$root.go('P31', { clientId: row.clientId })">数据授权</el-button>
            <el-button link type="primary" @click="$root.go('P31B', { clientId: row.clientId })">接口授权</el-button>
            <el-button link type="primary" @click="$root.go('P30View', { clientId: row.clientId })">信息查看</el-button>
          </template>
          <template v-else-if="row.clientType==='机构申请' && row.approvalStatus!=='已通过'">
            <el-button link :type="row.enableStatus==='启用'?'warning':'primary'" @click="toggleStatus(row)">{{ row.enableStatus==='启用'?'停用':'启用' }}</el-button>
            <el-button link type="primary" @click="$root.go('P30View', { clientId: row.clientId })">查看</el-button>
            <el-button link type="primary" @click="openApprove(row)">审批</el-button>
          </template>
          <template v-else>
            <el-button link :type="row.enableStatus==='启用'?'warning':'primary'" @click="toggleStatus(row)">{{ row.enableStatus==='启用'?'停用':'启用' }}</el-button>
            <el-button link type="primary" @click="$root.go('P30View', { clientId: row.clientId })">查看</el-button>
            <el-button link type="primary" @click="$root.go('P31B', { clientId: row.clientId })">接口授权</el-button>
          </template>
        </template>
      </el-table-column>
    </el-table>
    </div>

    <el-dialog :title="dialogTitle" v-model="dialog" width="720px">
      <el-form label-width="140px" style="width:100%">
        <el-form-item label="客户端名称" required>
          <el-input v-model="form.clientName" placeholder="请输入客户端名称" maxlength="50" show-word-limit></el-input>

        <el-form-item label="客户端ID" required>
          <el-input v-model="form.clientId" :disabled="!!editingId" placeholder="仅限数字、英文字母和下划线" maxlength="64"></el-input>
        </el-form-item>
        <el-form-item label="客户端类型" required>
          <el-select v-model="form.clientType" :disabled="!!editingId" placeholder="请选择" style="width:100%">
            <el-option v-for="o in clientTypeOptions" :key="o" :label="o" :value="o"></el-option>
          </el-select>
          <div style="color:#909399;font-size:12px;margin-top:4px">新增默认「平台授权」；机构管理员提交组织同步申请后生成的记录为「机构申请」。</div>
        </el-form-item>
        <template v-if="form.clientType!=='机构申请'">

          </el-form-item>
          <el-form-item label="登出后回调地址" required>
            <el-input v-model="form.logoutRedirectUri" placeholder="请输入登出后回调地址"></el-input>
          </el-form-item>
        </template>
        <el-form-item label="访问令牌有效期(秒)" required>
          <el-input-number v-model="form.accessTokenExp" :min="1" :max="86400" controls-position="right" style="width:100%"></el-input-number>

          <el-col :span="12"><el-form-item label="客户端类型"><div class="ro-text">{{ appr.row && appr.row.clientType }}</div></el-form-item></el-col>

/* =====================================================================
 * P30View 客户端信息查看（新开界面，由 P30 操作列「信息查看/查看」进入）
 * 客户端秘钥脱敏展示 + 小眼睛 + 蓝色字体 + 点击复制
 * 数据授权与接口授权分页展示；机构申请不展示数据授权
 * ===================================================================== */
app.component('P30View', {
  props: ['ctx'],
  data() {
    const row = CLIENT_AUTH.find(x => x.clientId === (this.ctx && this.ctx.clientId)) || CLIENT_AUTH[0];
    return {
      viewRow: row,
      viewShowSecret: false,
      dataAuthPage: 1,
      apiAuthPage: 1,
      pageSize: 5,
    };
  },
  computed: {
    hasAuthInfo() { return this.viewRow && (this.viewRow.allData === '是' || (Array.isArray(this.viewRow.syncRangeTypes) && this.viewRow.syncRangeTypes.length > 0) || (this.viewRow.allApis === '是' || (Array.isArray(this.viewRow.apiIds) && this.viewRow.apiIds.length > 0))); },
    dataAuthRows() {
      const r = this.viewRow; if (!r) return [];
      if (r.allData === '是') return [{ rangeType: '全部数据', schoolNames: '全部学校', orgNames: '全部机构' }];
      const types = (r.syncRangeTypes || []);
      const schools = String(r.schoolNames || '').split(/[;；]/).map(s => s.trim()).filter(Boolean);
      const orgs = String(r.orgNames || '').split(/[;；]/).map(s => s.trim()).filter(Boolean);
      const rows = [];
      if (types.includes('学校')) schools.forEach(s => rows.push({ rangeType: '学校', schoolNames: s, orgNames: '' }));
      if (types.includes('教育局')) orgs.forEach(o => rows.push({ rangeType: '教育局', schoolNames: '', orgNames: o }));
      if (!rows.length) rows.push({ rangeType: '—', schoolNames: r.schoolNames || '—', orgNames: r.orgNames || '—' });
      return rows;
    },
    apiAuthRows() {
      const r = this.viewRow; if (!r) return [];
      if (r.allApis === '是') return APIS.filter(a => a.visible).map(a => ({ id: a.id, name: a.name, apiAbility: a.apiType, type: a.type }));
      const ids = (r.apiIds || []);
      return APIS.filter(a => ids.includes(a.id)).map(a => ({ id: a.id, name: a.name, apiAbility: a.apiType, type: a.type }));
    },
    pagedDataAuth() {
      const rows = this.dataAuthRows;
      const start = (this.dataAuthPage - 1) * this.pageSize;
      return rows.slice(start, start + this.pageSize);
    },
    pagedApiAuth() {
      const rows = this.apiAuthRows;
      const start = (this.apiAuthPage - 1) * this.pageSize;
      return rows.slice(start, start + this.pageSize);
    },
    showDataAuth() { return this.hasAuthInfo && this.viewRow && this.viewRow.clientType !== '机构申请'; },
  },
  methods: {
    maskSecret(s) {
      if (!s) return '';
      if (s.length <= 6) return s;
      return s.slice(0, 4) + '****' + s.slice(-4);
    },
    scopeText(r) {
      const parts = [];
      if (r.allData === '是') { parts.push('全部数据'); }
      else {
        const types = (r.syncRangeTypes || []);
        if (!types.length) parts.push(r.authScopeText || '—');
        else parts.push(types.map(t => t + '：' + (t === '学校' ? (r.schoolNames || '') : (r.orgNames || ''))).join('；'));
      }
      if (r.allApis === '是') parts.push('接口：全部');
      return parts.join('；');
    },
    copyViewSecret() {
      const s = this.viewRow && this.viewRow.clientSecret;
      if (!s) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(s).then(() => this.$message.success('客户端秘钥已复制')).catch(() => this.$message.warning('复制失败，请手动复制'));
      } else {
        this.$message.warning('当前环境不支持自动复制');
      }
    },
  },
  template: `
  <div>
    <div class="card" style="max-width:1100px">
      <div style="font-weight:600;margin:8px 0 14px">客户端信息</div>
      <el-form label-width="150px">
        <el-row :gutter="16">
          <el-col :span="12"><el-form-item label="客户端ID"><div class="ro-text">{{ viewRow.clientId }}</div></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="客户端名称"><div class="ro-text">{{ viewRow.clientName || '—' }}</div></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="客户端秘钥">
            <div class="ro-text" style="font-family:monospace;display:flex;align-items:center;gap:6px">
              <span :title="viewShowSecret ? '' : '点击复制秘钥'" style="cursor:pointer;color:#409eff" @click="copyViewSecret">{{ viewShowSecret ? (viewRow.clientSecret || '—') : maskSecret(viewRow.clientSecret) }}</span>
              <el-button link type="primary" size="small" @click="viewShowSecret = !viewShowSecret">{{ viewShowSecret ? '隐藏' : '👁' }}</el-button>
            </div>
          </el-form-item></el-col>
          <el-col :span="12"><el-form-item label="授权类型"><div class="ro-text">{{ viewRow.authType || '—' }}</div></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="启用状态"><div class="ro-text">{{ viewRow.enableStatus }}</div></el-form-item></el-col>
          <el-col :span="24"><el-form-item label="回调地址"><div class="ro-text">{{ viewRow.redirectUri }}</div></el-form-item></el-col>
          <el-col :span="24"><el-form-item label="登出后回调地址"><div class="ro-text">{{ viewRow.logoutRedirectUri }}</div></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="访问令牌有效期(秒)"><div class="ro-text">{{ viewRow.accessTokenExp }}</div></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="刷新令牌有效期(秒)"><div class="ro-text">{{ viewRow.refreshTokenExp }}</div></el-form-item></el-col>
          <el-col :span="24"><el-form-item label="白名单"><div class="ro-text">{{ viewRow.whiteList || '—' }}</div></el-form-item></el-col>
          <el-col :span="24"><el-form-item label="备注"><div class="ro-text">{{ viewRow.remark || '—' }}</div></el-form-item></el-col>
          <el-col :span="24"><el-form-item label="授权范围"><div class="ro-text">{{ scopeText(viewRow) }}</div></el-form-item></el-col>
        </el-row>
      </el-form>
      <template v-if="hasAuthInfo">
        <div style="font-weight:600;margin:16px 0 8px" v-if="showDataAuth">数据授权</div>
        <el-table v-if="showDataAuth" :data="pagedDataAuth" border size="small" style="margin-bottom:8px">
          <el-table-column label="同步范围类型" min-width="100"><template #default="{row}"><span>{{ row.rangeType }}</span></template></el-table-column>
          <el-table-column label="学校名称" min-width="160"><template #default="{row}"><span>{{ row.schoolNames || '—' }}</span></template></el-table-column>
          <el-table-column label="机构名称" min-width="160"><template #default="{row}"><span>{{ row.orgNames || '—' }}</span></template></el-table-column>
          <el-table-column label="授权截止时间" width="120"><template #default="{row}"><span>{{ viewRow.deadline || '—' }}</span></template></el-table-column>
        </el-table>
        <el-pagination v-if="showDataAuth"
          layout="total, prev, pager, next"
          :total="dataAuthRows.length" :page-size="pageSize" :current-page="dataAuthPage"
          @current-change="p => dataAuthPage = p" style="margin-bottom:12px;text-align:right"></el-pagination>
        <div style="font-weight:600;margin:16px 0 8px">接口授权</div>
        <el-table :data="pagedApiAuth" border size="small">
          <el-table-column prop="name" label="接口名称" min-width="160"></el-table-column>
          <el-table-column prop="apiAbility" label="接口平台" min-width="140"></el-table-column>
          <el-table-column prop="type" label="数据敏感等级" width="110"></el-table-column>
          <el-table-column label="查看文档" width="100" align="center">
            <template #default="{row}"><el-button link type="primary" @click="$root.go('P06', { apiId: row.id })">查看文档</el-button></template>
          </el-table-column>
        </el-table>
        <el-pagination
          layout="total, prev, pager, next"
          :total="apiAuthRows.length" :page-size="pageSize" :current-page="apiAuthPage"
          @current-change="p => apiAuthPage = p" style="margin-top:8px;text-align:right"></el-pagination>
      </template>
      <div style="text-align:center;margin-top:16px"><el-button @click="$root.go('P30')">返回</el-button></div>
    </div>
  </div>`,
});

/* =====================================================================
 * P31 数据授权配置（桂教通超管，新开表单页，由 P30 操作列「数据授权」进入）
 * 是否全部数据（是→全区数据，不展示同步范围类型/学校名称/机构名称）
 * 同步范围类型（学校→学校名称；教育局→机构名称）
 * 授权截止时间（不可选今天之前，最长三年）
 * 数据授权与接口授权分开维护，本页只负责数据授权
 * ===================================================================== */
app.component('P31', {
  props: ['ctx'],
  data() {
    const c = CLIENT_AUTH.find(x => x.clientId === (this.ctx && this.ctx.clientId));
    const row = c || CLIENT_AUTH[0];
    return {
      row,
      form: {

      },

  computed: {
    showDataScope() { return this.form.allData === '否'; },

  },

        if (!this.form.syncRangeTypes.length) { this.$message.warning('请选择同步范围类型'); return; }

      row.syncRangeTypes = this.form.syncRangeTypes.slice();

          </el-form-item>

            <el-input v-model="form.schoolNames" type="textarea" :rows="3" maxlength="500" show-word-limit placeholder="请输入学校名称，多个学校用英文分号（;）隔开，如：南宁市教育局;南宁市第三中学"></el-input>
          </el-form-item>

            <el-input v-model="form.orgNames" type="textarea" :rows="3" maxlength="500" show-word-limit placeholder="请输入机构名称，多个机构用英文分号（;）隔开，如：南宁市教育局;桂林市教育局"></el-input>

        <el-table-column prop="sysName" label="业务系统名称" min-width="130"></el-table-column>
        <el-table-column prop="contact" label="业务系统对接人" width="120"></el-table-column>
        <el-table-column prop="phone" label="对接人联系电话" width="130"></el-table-column>
        <el-table-column label="白名单" min-width="220">
          <template #default="{ row }">
            <el-tag v-for="(w,i) in row.whiteList" :key="i" size="small" style="margin:2px 4px 2px 0">{{ w.protocol }}{{ w.domain }}</el-tag>
          </template>

        <el-table-column label="状态" width="90">

        <el-table-column label="操作" width="170">

            <el-button v-if="row.status==='草稿'" link type="danger" @click="delRow(row)">删除</el-button>
            <el-button v-if="row.status==='已通过' && row.clientId" link type="primary" @click="openCred(row)">查看</el-button>

          <el-input v-model="form.contact" placeholder="请输入业务系统对接人姓名" maxlength="20"></el-input>

        <el-form-item label="对接人联系电话" required>
          <el-input v-model="form.phone" placeholder="请输入对接人联系电话" maxlength="20"></el-input>
        </el-form-item>
        <el-form-item label="白名单" required>
          <div style="width:100%">
            <div v-for="(item,index) in form.whiteList" :key="index" style="display:flex;align-items:center;gap:8px;margin-bottom:8px">

              </el-select>
              <el-input v-model="item.domain" placeholder="请输入域名/地址" style="flex:1;width:auto"></el-input>
              <el-button type="danger" link @click="removeWhiteItem(index)">删除</el-button>

      </el-form>

        <el-button type="primary" @click="save(true)">提交申请</el-button>
      </template>
    </el-dialog>
    <el-dialog v-model="cred.visible" title="数据同步客户端凭证" width="560px" @close="cred.showSecret=false">
      <el-form label-width="130px" v-if="cred.row">
        <el-form-item label="业务系统名称"><div class="ro-text">{{ cred.row.sysName }}</div></el-form-item>
        <el-form-item label="客户端ID"><div class="ro-text" style="font-family:monospace">{{ cred.row.clientId }}</div></el-form-item>
        <el-form-item label="客户端秘钥">
          <div class="ro-text" style="font-family:monospace;display:flex;align-items:center;gap:6px">
            <span :title="cred.showSecret ? '' : '点击复制秘钥'" style="cursor:pointer" @click="copySecret">{{ cred.showSecret ? cred.row.clientSecret : maskSecret(cred.row.clientSecret) }}</span>

          </div>

  data() {
    return {
      rows: DATA_SYNC_APPS.filter(r => r.orgId === 'ORG002'),
      q: { sysName: '', status: '' },
      dlg: { visible: false, title: '新增组织同步申请', editing: null },
      form: { sysName: '', contact: '', phone: '', whiteList: [{ protocol: 'https://', domain: '' }] },
      cred: { visible: false, row: null, showSecret: false },
    };
  },
  computed: {
    filtered() {
      return this.rows.filter(r => (!this.q.sysName || r.sysName.includes(this.q.sysName)) && (!this.q.status || r.status === this.q.status));
    },
  },
  methods: {
    nowStr() {
      const d = new Date(), p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    },
    openAdd() {
      this.dlg = { visible: true, title: '新增组织同步申请', editing: null };
      this.form = { sysName: '', contact: '', phone: '', whiteList: [{ protocol: 'https://', domain: '' }] };
    },
    openEdit(row) {
      this.dlg = { visible: true, title: '编辑组织同步申请', editing: row };
      this.form = { sysName: row.sysName, contact: row.contact, phone: row.phone, whiteList: row.whiteList.map(w => ({ ...w })) };
    },
    addWhiteItem() { this.form.whiteList.push({ protocol: 'https://', domain: '' }); },
    removeWhiteItem(index) {
      this.form.whiteList.splice(index, 1);
      if (!this.form.whiteList.length) this.form.whiteList.push({ protocol: 'https://', domain: '' });
    },
    save(submit) {
      if (!this.form.sysName.trim()) { this.$message.warning('请填写业务系统名称'); return; }
      if (!this.form.contact.trim()) { this.$message.warning('请填写业务系统对接人'); return; }
      if (!this.form.phone.trim()) { this.$message.warning('请填写对接人联系电话'); return; }
      if (!this.form.whiteList.length || this.form.whiteList.some(w => !w.domain.trim())) { this.$message.warning('请填写完整的白名单（前缀+域名）'); return; }
      const wl = this.form.whiteList.map(w => ({ ...w }));
      if (this.dlg.editing) {
        const r = this.dlg.editing;
        r.sysName = this.form.sysName; r.contact = this.form.contact; r.phone = this.form.phone; r.whiteList = wl;
        if (submit) {
          r.status = '审批中'; r.applyTime = this.nowStr(); r.opinion = ''; r.opinionNote = ''; r.approver = ''; r.approveTime = '';
          this.$message.success('已提交审批');
        } else {
          this.$message.success('已保存草稿');
        }
      } else {
        const nr = { id: Date.now(), orgId: 'ORG002', orgName: '南宁市教育局', applicant: '张伟', applyTime: this.nowStr(), sysName: this.form.sysName, contact: this.form.contact, phone: this.form.phone, whiteList: wl, status: submit ? '审批中' : '草稿', opinion: '', opinionNote: '' };
        this.rows.unshift(nr);
        DATA_SYNC_APPS.unshift(nr);
        this.$message.success(submit ? '已提交审批' : '已保存草稿');
      }
      this.dlg.visible = false;
    },
    delRow(row) {
      this.$confirm('确认删除该组织同步申请？删除后不可恢复。', '提示', { type: 'warning', confirmButtonText: '确定', cancelButtonText: '取消' })
        .then(() => {
          const i = this.rows.indexOf(row);
          if (i > -1) this.rows.splice(i, 1);
          const g = DATA_SYNC_APPS.indexOf(row);
          if (g > -1) DATA_SYNC_APPS.splice(g, 1);
          this.$message.success('已删除');
        }).catch(() => {});
    },
    openCred(row) {
      this.cred = { visible: true, row, showSecret: false };
    },
    maskSecret(s) {
      if (!s) return '';
      if (s.length <= 8) return s;
      return s.slice(0, 4) + '****' + s.slice(-4);
    },
    toggleSecret() { this.cred.showSecret = !this.cred.showSecret; },
    copySecret() {
      const s = this.cred.row && this.cred.row.clientSecret;
      if (!s) return;
      const ta = document.createElement('textarea');
      ta.value = s;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); this.$message.success('客户端秘钥已复制'); }
      catch (e) { this.$message.warning('复制失败，请手动复制'); }
      document.body.removeChild(ta);
    },
  },
});

app.component('P36Form', {
