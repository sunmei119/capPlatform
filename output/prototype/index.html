    .brand-title { font-weight: 700; font-size: 16px; }
    .role-tag { margin-left: auto; }

    .doc-header p { margin: 0; font-size: 13px; opacity: .85; }
    .doc-label { font-weight: 600; font-size: 15px; margin: 20px 0 10px; color: #303133; }
    .doc-tbl { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 13px; }
    .doc-tbl th { background: #49a3f1; color: #fff; padding: 9px 12px; text-align: left; font-weight: 500; border: 1px solid #3d9ae8; }
    .doc-tbl td { padding: 9px 12px; border: 1px solid #e4e7ed; vertical-align: top; line-height: 1.6; }
    .doc-tbl tr:nth-child(even) td { background: #fafbfc; }
    .doc-code { background: #f5f7fa; padding: 14px 16px; border-radius: 4px; font-size: 12px; white-space: pre-wrap; word-break: break-all; line-height: 1.7; border: 1px solid #e4e7ed; }

<div id="app">

      <div class="brand-title">能力管理平台</div>
      <div class="scope-bar">
        <span style="color:#909399; font-size:13px">数据范围：{{ scopeLabel }}</span>
        <el-tag size="small" type="info">{{ roleName }}</el-tag>
      </div>
      <div style="flex:1"></div>
      <el-radio-group v-model="role" size="small" @change="onRoleChange">
        <el-radio-button v-for="r in ROLES" :key="r.key" :value="r.key">{{ r.name }}</el-radio-button>
      </el-radio-group>
    </el-header>

    <el-container>
      <!-- 左侧菜单树（二级菜单） -->
      <el-aside v-if="!standalone" width="260px">
        <el-menu :default-active="activeMenu" style="border:none" @select="onMenuSelect">
          <template v-for="item in menuTree" :key="item.label">
            <el-sub-menu v-if="item.children && item.children.length" :index="item.label">
              <template #title>{{ item.label }}</template>
              <el-menu-item v-for="child in item.children" :key="child.label" :index="child.page">{{ child.label }}</el-menu-item>
            </el-sub-menu>
            <el-menu-item v-else :index="item.page">{{ item.label }}</el-menu-item>
          </template>
        </el-menu>
      </el-aside>

      <!-- 主内容 -->
      <el-main style="padding:0; background:#f5f7fa; overflow:auto">
        <div class="page-wrap">
          <el-breadcrumb v-if="!standalone" separator="/" style="margin-bottom:14px">
            <el-breadcrumb-item>能力管理</el-breadcrumb-item>
            <el-breadcrumb-item>{{ activeTitle }}</el-breadcrumb-item>
          </el-breadcrumb>
          <component :is="currentComp" :ctx="ctx"></component>
        </div>
      </el-main>
    </el-container>
  </el-container>
</div>

/* =====================================================================
 * P04 接口列表（API接口管理）
 * 功能点：API接口列表及查询 / 查看接口文档 / 新增接口 / 编辑接口 / 应用授权 / 接口停用/启用
 * ===================================================================== */
app.component('P04', {
  data() {
    return { rows: APIS.map(a=>({...a, mStop:false})), q:{ name:'', type:'', apiType:'' } };
  },
  computed: {
    isSuper(){ return this.$root.role==='super'; },
    isOrg(){ return this.$root.role==='org'; },
    filtered() {
      let list = this.rows;
      // 机构管理员：展示桂教通平台接口 + 本机构新增接口
      if (this.isOrg) list = list.filter(r => r.source==='platform' || r.source==='org');
      return list.filter(r => (!this.q.name||r.name.includes(this.q.name)) && (!this.q.type||r.type===this.q.type) && (!this.q.apiType||r.apiType===this.q.apiType));
    },
    // 本机构接口（机构管理员）或全平台接口（桂教通超管）：可编辑/授权/停用启用
    canManage(r){ return this.isSuper || (this.isOrg && r.source==='org'); },
    isDev(){ return this.$root.role==='dev'; },

             : { name:'', service:'', type:'非敏感接口', apiType:'', identity:'', methods:['POST'], sign:'签名鉴权', needAuth:true, reqUrl:'', gwUrl:'', visible:true, maxCalls:10000, remark:'' },
      params: src ? src.params.map(p=>({...p, paramType:p.paramType||'', enumId:p.enumId||''})) : [{name:'',type:'string',paramType:'',enumId:'',required:true,desc:''}],
    };
  },

    addParam(){ this.params.push({name:'',type:'string',paramType:'',enumId:'',required:false,desc:''}); },

      if(!this.f.name||!this.f.service||!this.f.reqUrl||!this.f.gwUrl){this.$message.warning('请填写接口必填项');return;}

      if(!this.params.length||this.params.some(p=>!p.name)){this.$message.warning('参数列表至少需要一条完整记录');return;}
      if(this.params.some(p=>!p.paramType)){this.$message.warning('请为每个参数选择参数类型');return;}

          <el-col :span="12"><el-form-item label="接口类型" required>
            <el-select v-model="f.apiType" style="width:100%"><el-option label="家校通讯录" value="家校通讯录"></el-option><el-option label="应用" value="应用"></el-option><el-option label="内部通讯录" value="内部通讯录"></el-option></el-select>

          </el-form-item></el-col>

      </el-table>

        <el-button @click="$root.go('P04')">取消</el-button>

/* =====================================================================

app.component('P06', {
  props: ['ctx'],
  data() {
    const a = APIS.find(x=>x.id===(this.ctx&&this.ctx.apiId));
    return { api: a || APIS[0] };
  },
  computed: {
    reqExample() {
      const ps = this.api.params.filter(x=>x.required).map(x=>'&'+x.name+'='+(x.type==='string'?'示例值':'1')).join('');
      return this.api.methods[0]+' '+this.api.reqUrl+'?access_token=ACCESS_TOKEN'+ps;
    },
    resExample() {
      const d = {}; this.api.params.forEach(p=>{ d[p.name] = p.type==='string'?'示例值':(p.type==='int32'?1:true); });
      return JSON.stringify({ errcode:0, errmsg:'ok', data:d }, null, 2);
    },
  },
  template: `
  <div>
    <div class="doc-header">
      <h2>{{ api.name }}</h2>
      <p>使用场景：{{ api.name }}，服务名 {{ api.service }}</p>
    </div>

    <div class="doc-label">权限说明：</div>
    <table class="doc-tbl">
      <tr><th style="width:35%">权限项</th><th style="width:25%">说明</th><th>备注</th></tr>
      <tr><td>应用是否需要申请白名单</td><td>{{ api.needAuth ? '需要' : '不需要' }}</td><td></td></tr>
      <tr><td>用户凭证</td><td>未支持</td><td></td></tr>
      <tr><td>机构凭证</td><td>支持</td><td>获取不到用户凭证的后台管理场景使用</td></tr>
    </table>

      <tr v-for="p in api.params" :key="p.name"><td>{{ p.name }}</td><td>{{ p.type }}</td><td>{{ p.required?'是':'否' }}</td><td>{{ p.desc }}</td></tr>
    </table>

    <p style="color:#909399;font-size:12px">注意：全量查询仅适用于数据量较少的场景；请尽量按需获取，减少全量查询带来的时延问题。</p>

    <div class="doc-label">返回参数：</div>
    <table class="doc-tbl">
      <tr><th>参数</th><th>类型</th><th>说明</th></tr>
      <tr><td>errcode</td><td>int32</td><td>返回码</td></tr>
      <tr><td>errmsg</td><td>string</td><td>对返回码的文本描述内容</td></tr>
    </table>

/* =====================================================================
 * P07 应用授权
 * 功能点：应用授权 / 添加授权 / 批量移除授权 / 移除授权
 * ===================================================================== */
app.component('P07', {
  props: ['ctx'],
  data() {
    const a = APIS.find(x=>x.id===(this.ctx&&this.ctx.apiId));
    const api = a || APIS[0];
    const preAuth = ['app_1001','app_1002','app_1005'];
    return { api,
      rows: APP_LIST.filter(x=>preAuth.includes(x.appId)).map(x=>({...x,checked:false})),
      q:{appName:'',appId:''}, mAdd:false, addChosen:[], mBatch:false,
      addPage: 1, addPageSize: 10, addQuery: { appName: '', appId: '', appAttr: '' },
    };
  },
  computed: {
    authorizedIds(){ return this.rows.map(x=>x.appId); },
    availableApps(){ return APP_LIST.filter(x=>!this.authorizedIds.includes(x.appId)); },
    chosenApps(){ return this.addChosen.map(id => APP_LIST.find(a=>a.appId===id)).filter(Boolean); },
    batchCount(){ return this.rows.filter(x=>x.checked).length; },
    filteredAddApps() {
      const q = this.addQuery;
      return this.availableApps.filter(a =>
        (!q.appName || a.appName.includes(q.appName)) &&
        (!q.appId || a.appId.includes(q.appId)) &&
        (!q.appAttr || a.appAttr === q.appAttr)
      );
    },
    pagedAddApps() {
      const start = (this.addPage - 1) * this.addPageSize;
      return this.filteredAddApps.slice(start, start + this.addPageSize);
    },
  },
  methods: {
    removeApp(row){ this.rows = this.rows.filter(x=>x.appId!==row.appId); this.$message.success('已移除授权'); },
    confirmBatch(){ const sel=this.rows.filter(x=>x.checked); this.rows=this.rows.filter(x=>!x.checked); this.mBatch=false; this.$message.success('已移除 '+sel.length+' 个应用授权'); },
    toggleAdd(row){ const id=row.appId; const i=this.addChosen.indexOf(id); if(i>=0)this.addChosen.splice(i,1); else this.addChosen.push(id); },
    isChosen(row){ return this.addChosen.includes(row.appId); },
    isAllChecked(){ return this.pagedAddApps.length>0 && this.pagedAddApps.every(a=>this.addChosen.includes(a.appId)); },
    toggleAllAdd(checked) {
      if (checked) {
        this.pagedAddApps.forEach(a => { if(!this.addChosen.includes(a.appId)) this.addChosen.push(a.appId); });
      } else {
        const pageIds = this.pagedAddApps.map(a => a.appId);
        this.addChosen = this.addChosen.filter(id => !pageIds.includes(id));
      }
    },
    confirmAdd(){ this.addChosen.forEach(id=>{ const a=APP_LIST.find(x=>x.appId===id); if(a)this.rows.push({...a,checked:false}); }); this.addChosen=[]; this.mAdd=false; this.$message.success('已添加授权'); },
    openAddDialog() {
      this.addChosen = [];
      this.addQuery = { appName: '', appId: '', appAttr: '' };
      this.addPage = 1;
      this.mAdd = true;
    },
  },
  template: `
  <div>
    <div class="card">
      <div style="margin-bottom:14px">接口名称：<b>{{ api.name }}</b></div>
      <div class="toolbar" style="margin-bottom:10px">

        <span class="q-label">应用ID</span><el-input v-model="q.appId" placeholder="请输入应用ID" clearable style="width:150px"></el-input>
        <el-button type="primary">查询</el-button>
        <div style="flex:1"></div>
        <el-button type="primary" @click="openAddDialog">添加授权</el-button>
        <el-button :disabled="!batchCount" @click="mBatch=true">批量移除授权</el-button>
      </div>
      <el-table :data="rows" stripe>
        <el-table-column width="50"><template #default="s"><el-checkbox v-model="s.row.checked"></el-checkbox></template></el-table-column>
        <el-table-column prop="appId" label="应用ID" width="120"></el-table-column>
        <el-table-column prop="appName" label="应用名称"></el-table-column>
        <el-table-column prop="appAttr" label="应用属性" width="100"></el-table-column>
        <el-table-column label="操作" width="100"><template #default="s"><el-button link type="danger" @click="removeApp(s.row)">移除授权</el-button></template></el-table-column>
      </el-table>
    </div>
    <el-dialog v-model="mAdd" title="添加授权" width="860px" :close-on-click-modal="false">
      <div style="display:flex;gap:16px;min-height:400px">
        <!-- 左侧：搜索 + 表格（结构与 P15 请选择机构和学校弹窗一致，可正常多选） -->
        <div style="flex:1;display:flex;flex-direction:column">
          <div style="margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <span class="q-label">应用名称</span><el-input v-model="addQuery.appName" placeholder="请输入应用名称" clearable style="width:140px" size="default"></el-input>
            <span class="q-label">应用ID</span><el-input v-model="addQuery.appId" placeholder="请输入应用ID" clearable style="width:120px" size="default"></el-input>
            <span class="q-label">应用属性</span><el-select v-model="addQuery.appAttr" placeholder="请选择" clearable style="width:150px" size="default">
              <el-option label="生态应用" value="生态应用"></el-option>
              <el-option label="原生应用/低代码应用" value="原生应用/低代码应用"></el-option>
              <el-option label="原生应用/自建应用" value="原生应用/自建应用"></el-option>
            </el-select>
            <el-button type="primary" size="default">查询</el-button>
          </div>
          <el-table :data="pagedAddApps" border size="small" style="width:100%">
            <el-table-column width="44" align="center">
              <template #header>
                <el-checkbox :model-value="isAllChecked()" @change="toggleAllAdd"></el-checkbox>
              </template>
              <template #default="s">
                <el-checkbox :model-value="isChosen(s.row)" @change="toggleAdd(s.row)"></el-checkbox>
              </template>
            </el-table-column>
            <el-table-column prop="appName" label="应用名称" min-width="150"></el-table-column>
            <el-table-column prop="appId" label="应用ID" width="110"></el-table-column>
            <el-table-column prop="appAttr" label="应用属性" min-width="140"></el-table-column>
          </el-table>
          <div style="display:flex;justify-content:flex-end;margin-top:10px">
            <el-pagination
              v-model:current-page="addPage"
              :page-size="addPageSize"
              :total="filteredAddApps.length"
              layout="total, prev, pager, next, sizes"
              :page-sizes="[10, 20, 50]"
              @size-change="v => { addPageSize = v; addPage = 1; }"
              small
            ></el-pagination>
          </div>
        </div>

 * ===================================================================== */
app.component('P27', {
  data() {
    return { rows: CALL_RECORDS.map(x => ({ ...x })), q: { apiName: '', vendor: '', result: '' } };
  },
  computed: {
    filtered() {
      return this.rows.filter(r =>
        (!this.q.apiName || r.apiName.includes(this.q.apiName)) &&
        (!this.q.vendor || r.vendor.includes(this.q.vendor)) &&
        (!this.q.result || r.result === this.q.result));
    },
    totalCalls() { return this.filtered.length; },
    successCount() { return this.filtered.filter(r => r.result === '成功').length; },
    failCount() { return this.filtered.filter(r => r.result === '失败').length; },
    successRate() { return this.totalCalls ? Math.round(this.successCount / this.totalCalls * 100) + '%' : '—'; },
  },
  template: `

/* =====================================================================
 * P11 厂商注册的接口
 * 功能点：接口列表及查询 / 接口审批 / 接口删除 / 接口上线 / 接口下线
 * ===================================================================== */
app.component('P11', {
  data() {
    return {
      rows: (this.$root.role==='dev' ? DEV_APIS : VENDOR_APIS).map(x=>({...x})),
      q: { name: '', audit: '', source: '' },
      onlineVisible: false,
      onlineRow: null,
      onlineForm: { gwUrl: '', service: '', visible: '否' },
    };
  },
  computed: {
    isDev(){ return this.$root.role==='dev'; },
    isOrg(){ return this.$root.role==='org'; },
    isSuper(){ return this.$root.role==='super'; },
    title(){ return this.isDev ? '接口注册' : '厂商注册的接口'; },
    filtered(){ return this.rows.filter(r=> (!this.q.name||r.name.includes(this.q.name)) && (!this.q.audit||r.audit===this.q.audit) && (!this.q.source||r.source===this.q.source)); },
  },
  methods: {
    del(row){
      this.$msgbox.confirm('确认删除该接口？删除后不可恢复。', '删除确认', { type:'warning', confirmButtonText:'确认删除', cancelButtonText:'取消' })
        .then(()=>{ this.rows = this.rows.filter(x=>x.id!==row.id); this.$message.success('已删除'); })
        .catch(()=>{});
    },
    online(row){ // 开发者点上线：状态→已上线，审批状态→待审批
      this.$msgbox.confirm('确认提交上线？提交后状态变为“已上线”，等待机构/超管审批。', '上线确认', { type:'warning', confirmButtonText:'确认上线', cancelButtonText:'取消' })
        .then(()=>{ row.status = '已上线'; row.audit = '待审批'; this.$message.success('已提交上线，等待审批'); })
        .catch(()=>{});
    },
    offline(row){ // 开发者已下线：状态→未上线
      this.$msgbox.confirm('确认下线该接口？下线后接口将不再对外提供服务。', '下线确认', { type:'warning', confirmButtonText:'确认下线', cancelButtonText:'取消' })
        .then(()=>{ row.status = '未上线'; row.audit = '—'; this.$message.success('已下线'); })
        .catch(()=>{});
    },
    openOnline(row){ // 机构/超管审批通过后，直接弹窗上线界面（无需二次确认）
      this.onlineRow = row; this.onlineForm = { gwUrl: row.gwUrl||'', service: row.service||'', visible: row.visible||'否' };
      this.onlineVisible = true;
    },
    offlineOrg(row){ // 机构/超管已下线
      this.$msgbox.confirm('下线操作请谨慎！确认下线后，该接口将不可被访问，其他机构/厂商也无法再申请使用。', '下线确认', { type:'warning', confirmButtonText:'确认下线', cancelButtonText:'取消' })
        .then(()=>{ row.status = '未上线'; this.$message.success('已下线，接口已不可访问'); })
        .catch(()=>{});
    },
    submitOnline(){
      if(!this.onlineForm.gwUrl){ this.$message.warning('请填写网关转发地址'); return; }
      if(!this.onlineForm.service){ this.$message.warning('请填写接口服务名称'); return; }
      const r = this.onlineRow; r.gwUrl = this.onlineForm.gwUrl; r.service = this.onlineForm.service; r.visible = this.onlineForm.visible;
      this.$message.success('接口已上线，其他机构/厂商可申请使用'); this.onlineVisible = false;
    },
  },
  template: `
  <div>
    <div class="toolbar">
      <span class="q-label">接口名称</span><el-input v-model="q.name" placeholder="请输入接口名称" clearable style="width:160px"></el-input>
      <span class="q-label">审批状态</span><el-select v-model="q.audit" placeholder="请选择" clearable style="width:110px">
        <el-option label="待审批" value="待审批"></el-option><el-option label="已审批" value="已审批"></el-option><el-option label="已驳回" value="已驳回"></el-option>
      </el-select>
      <span class="q-label">注册来源</span><el-select v-model="q.source" placeholder="请选择" clearable style="width:110px">
        <el-option label="机构" value="机构"></el-option><el-option label="桂教通" value="桂教通"></el-option><el-option label="开发者" value="开发者"></el-option>
      </el-select>
      <el-button type="primary">查询</el-button>
      <el-button @click="q.name='';q.audit='';q.source=''">重置</el-button>
      <el-button v-if="isDev" type="primary" @click="$root.go('P11a')">新增</el-button>
    </div>
    <div class="card">
      <el-table :data="filtered" stripe>
        <el-table-column prop="name" label="接口名称" min-width="150"></el-table-column>
        <el-table-column prop="service" label="接口服务名" min-width="140"></el-table-column>
        <el-table-column prop="vendor" label="注册厂商" min-width="130"></el-table-column>
        <el-table-column prop="source" label="注册来源" width="90"></el-table-column>
        <el-table-column prop="type" label="接口类型" width="100"></el-table-column>
        <el-table-column label="审批状态" width="90"><template #default="s"><st-tag :v="s.row.audit"/></template></el-table-column>
        <el-table-column label="接口状态" width="90"><template #default="s"><st-tag v-if="s.row.status!=='—'" :v="s.row.status"/><span v-else style="color:#c0c4cc">—</span></template></el-table-column>
        <el-table-column label="操作" min-width="260" fixed="right">
          <template #default="s">
            <el-button link @click="$root.go('P11c',{vendorApiId:s.row.id})">查看</el-button>
            <!-- 开发者：未上线可编辑/删除；已上线不可操作 -->
            <template v-if="isDev">
              <el-button v-if="s.row.status==='未上线'" link @click="$root.go('P11a',{devApiId:s.row.id})">编辑</el-button>
              <el-button v-if="s.row.status==='未上线'" link type="danger" @click="del(s.row)">删除</el-button>
              <el-button v-if="s.row.status==='未上线'" link type="success" @click="online(s.row)">上线</el-button>
              <el-button v-if="s.row.status==='已上线' && s.row.audit==='待审批'" link type="warning" @click="offline(s.row)">下线</el-button>
            </template>
            <!-- 机构/超管：待审批可审批；已审批未上线可上线接口；已上线可下线+申请 -->
            <template v-if="!isDev">
              <el-button v-if="s.row.audit==='待审批'" link type="primary" @click="$root.go('P12',{vendorApiId:s.row.id})">审批</el-button>
              <el-button v-if="s.row.audit==='已审批' && s.row.status!=='已上线'" link type="success" @click="openOnline(s.row)">上线接口</el-button>
              <el-button v-if="s.row.status==='已上线'" link type="warning" @click="offlineOrg(s.row)">下线</el-button>
              <el-button v-if="s.row.status==='已上线'" link type="primary" @click="$root.go('P21',{vendorApiId:s.row.id})">申请</el-button>
            </template>
          </template>
        </el-table-column>
      </el-table>
    </div>
    <el-dialog title="接口上线" v-model="onlineVisible" width="480px" append-to-body>
      <el-form label-width="110px">
        <el-form-item label="网关转发地址"><el-input v-model="onlineForm.gwUrl" placeholder="如 /gw/xxx"></el-input></el-form-item>
        <el-form-item label="接口服务名称"><el-input v-model="onlineForm.service" placeholder="如 xxx_service"></el-input></el-form-item>
        <el-form-item label="是否对外可见">
          <el-radio-group v-model="onlineForm.visible"><el-radio value="是">是</el-radio><el-radio value="否">否</el-radio></el-radio-group>
        </el-form-item>
      </el-form>
      <div style="text-align:right;margin-top:10px">
        <el-button @click="onlineVisible=false">取消</el-button>
        <el-button type="primary" @click="submitOnline">确认上线</el-button>
      </div>
    </el-dialog>
  </div>`,
});

/* =====================================================================

      { id: 'ORG004', name: '柳州市教育局', parent: '广西壮族自治区教育厅', type: '教育局' },
      { id: 'ORG005', name: '南宁市第一中学', parent: '南宁市教育局', type: '学校' },

      { id: 'ORG009', name: '北海市海城区小学', parent: '北海市教育局', type: '学校' },
      { id: 'ORG010', name: '柳州市景行小学', parent: '柳州市教育局', type: '学校' },
    ];
    const selectedOrgs = src ? src.orgs.split('、').map(n => allOrgs.find(o=>o.name===n)).filter(Boolean) : [];
    return {
      form: {
        name: src ? src.name : '',
        tenantType: '行政租户',
        orgScope: selectedOrgs.map(o=>o.name).join('、'),
        desc: '',
      },
      selectedOrgs: selectedOrgs,
      allOrgs: allOrgs,
      orgDialogVisible: false,
      orgQuery: { name: '', type: '' },
      orgSelection: [],
      orgPage: 1,
      orgPageSize: 10,
      importDialogVisible: false,
      importFile: null,
    };
  },
  computed: {
    orgScopeLen() { return this.form.orgScope.length; },
    descLen() { return this.form.desc.length; },
    filteredOrgs() {
      return this.allOrgs.filter(o =>
        (!this.orgQuery.name || o.name.includes(this.orgQuery.name)) &&
        (!this.orgQuery.type || o.type === this.orgQuery.type)
      );
    },
    pagedOrgs() {
      const start = (this.orgPage - 1) * this.orgPageSize;
      return this.filteredOrgs.slice(start, start + this.orgPageSize);
    },
  },
  methods: {
    save() {
      if (!this.form.name) { this.$message.warning('请填写租户名称'); return; }
      this.$message.success('已保存');
      this.$root.go('P14');
    },
    openOrgDialog() {
      this.orgSelection = this.selectedOrgs.map(o => o.id);
      this.orgQuery = { name: '', type: '' };
      this.orgPage = 1;
      this.orgDialogVisible = true;
    },
    isOrgSelected(org) {
      return this.orgSelection.includes(org.id);
    },
    toggleOrg(org) {
      const idx = this.orgSelection.indexOf(org.id);
      if (idx >= 0) this.orgSelection.splice(idx, 1);
      else this.orgSelection.push(org.id);
    },
    toggleAllOrgs(checked) {
      if (checked) {
        this.pagedOrgs.forEach(o => {
          if (!this.orgSelection.includes(o.id)) this.orgSelection.push(o.id);
        });
      } else {
        const pageIds = this.pagedOrgs.map(o => o.id);
        this.orgSelection = this.orgSelection.filter(id => !pageIds.includes(id));
      }
    },
    isAllChecked() {
      return this.pagedOrgs.length > 0 && this.pagedOrgs.every(o => this.orgSelection.includes(o.id));
    },
    saveOrgSelection() {
      this.selectedOrgs = this.allOrgs.filter(o => this.orgSelection.includes(o.id));
      this.form.orgScope = this.selectedOrgs.map(o => o.name).join('、');
      this.orgDialogVisible = false;
    },
    removeOrg(org) {
      this.selectedOrgs = this.selectedOrgs.filter(o => o.id !== org.id);
      this.form.orgScope = this.selectedOrgs.map(o => o.name).join('、');
    },
    openImportDialog() {
      this.importFile = null;
      this.importDialogVisible = true;
    },
    confirmImport() {
      this.$message.success('已导入机构学校数据');
      this.importDialogVisible = false;
    },
  },

          </el-radio-group>

        <el-form-item label="租户范围">
          <div style="width:100%">
            <el-input type="textarea" v-model="form.orgScope" :rows="4" placeholder="请选择租户范围" readonly maxlength="500"
              style="margin-bottom:6px"></el-input>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div style="display:flex;gap:8px">
                <el-button type="primary" size="small" @click="openOrgDialog">添加机构和学校</el-button>
                <el-button type="primary" size="small" @click="openImportDialog">批量导入</el-button>
              </div>
              <span style="color:#909399;font-size:12px">{{ orgScopeLen }}/500</span>
            </div>
          </div>
        </el-form-item>
        <el-form-item label="租户说明">
          <div style="width:100%">
            <el-input type="textarea" v-model="form.desc" :rows="4" placeholder="填写入租户说明" maxlength="500"></el-input>
            <div style="display:flex;justify-content:flex-end;margin-top:4px">
              <span style="color:#909399;font-size:12px">{{ descLen }}/500</span>
            </div>
          </div>
        </el-form-item>
        <el-form-item>
          <el-button @click="$root.go('P14')">取消</el-button>
          <el-button type="primary" @click="save">保存</el-button>
        </el-form-item>
      </el-form>
    </div>

    <!-- 选择机构和学校弹窗 -->
    <el-dialog v-model="orgDialogVisible" title="请选择机构和学校" width="860px" :close-on-click-modal="false">
      <div style="display:flex;gap:16px;min-height:400px">
        <!-- 左侧：搜索 + 表格 -->
        <div style="flex:1;display:flex;flex-direction:column">
          <div style="margin-bottom:12px;display:flex;gap:10px;align-items:center">
            <el-input v-model="orgQuery.name" placeholder="名称" clearable style="width:180px" size="default"></el-input>
            <el-select v-model="orgQuery.type" placeholder="类型" clearable style="width:120px" size="default">
              <el-option label="教育厅" value="教育厅"></el-option>
              <el-option label="教育局" value="教育局"></el-option>
              <el-option label="学校" value="学校"></el-option>
            </el-select>
            <el-button type="primary" size="default">查询</el-button>
          </div>
          <el-table :data="pagedOrgs" border size="small" style="width:100%">
            <el-table-column width="44" align="center">
              <template #header>
                <el-checkbox :model-value="isAllChecked()" @change="toggleAllOrgs"></el-checkbox>
              </template>
              <template #default="s">
                <el-checkbox :model-value="isOrgSelected(s.row)" @change="toggleOrg(s.row)"></el-checkbox>
              </template>
            </el-table-column>
            <el-table-column prop="name" label="机构名称" min-width="160"></el-table-column>
            <el-table-column prop="parent" label="上级机构" min-width="140"></el-table-column>
            <el-table-column prop="id" label="机构ID" width="90"></el-table-column>
            <el-table-column label="已选学校" width="70" align="center">
              <template #default="s">
                <span v-if="isOrgSelected(s.row)" style="color:#409eff">&#10003;</span>
                <span v-else style="color:#c0c4cc">—</span>

            </el-table-column>
          </el-table>
          <div style="display:flex;justify-content:flex-end;margin-top:10px">
            <el-pagination
              v-model:current-page="orgPage"
              :page-size="orgPageSize"

              layout="total, prev, pager, next, sizes"

              @size-change="v => { orgPageSize = v; orgPage = 1; }"
              small

        </div>

        <div style="width:200px;border-left:1px solid #e4e7ed;padding-left:14px;display:flex;flex-direction:column">

          <div style="flex:1;overflow-y:auto">
            <div v-for="id in orgSelection" :key="id" style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f2f3f5">
              <span style="font-size:13px">{{ (allOrgs.find(o=>o.id===id)||{}).name }}</span>
              <el-button link type="danger" size="small" @click="toggleOrg(allOrgs.find(o=>o.id===id))" style="font-size:14px;padding:0">×</el-button>

            <div v-if="!orgSelection.length" style="color:#c0c4cc;font-size:12px;text-align:center;padding:20px 0">暂无选择</div>
          </div>

    <!-- 批量导入弹窗 -->
    <el-dialog v-model="importDialogVisible" title="通过机构的学校" width="600px" :close-on-click-modal="false">

/* =====================================================================
 * P16 企业信息
 * 功能点：企业信息注册 / 企业信息查看 / 企业信息编辑
 * ===================================================================== */
app.component('P16', {
  data() {
    const v = VENDORS[0];
    return {
      edit: false,
      form: {
        // 基础信息
        name: v.name, type: v.type, isPublicSea: v.isPublicSea, socialCode: v.socialCode,
        legalPerson: v.legalPerson, admin: v.admin, adminPhone: v.phone,
        registerAddr: v.registerAddr, detailAddr: v.detailAddr, vatPayer: v.vatPayer,
        intro: v.intro, companyPhone: v.companyPhone, businessDeadline: v.businessDeadline, portal: v.portal,
        // 财务信息（选填）
        f_bankType: v.f_bankType || '', f_bankName: v.f_bankName || '', f_bankAccount: v.f_bankAccount || '', f_accountPurpose: v.f_accountPurpose || '',
        // 开票信息（选填）
        i_addr: v.i_addr || '', i_taxNo: v.i_taxNo || '', i_phone: v.i_phone || '', i_bank: v.i_bank || '', i_bankAcc: v.i_bankAcc || '', i_bankLine: v.i_bankLine || '',
        // 资质附件（选填）
        logo: v.logo || [], license: v.license || [],
      },
    };
  },
  methods: {
    save() {
      const f = this.form;
      const missing = [];
      if (!f.name) missing.push('厂商名称');
      if (!f.legalPerson) missing.push('法人代表');
      if (!f.admin) missing.push('管理员');
      if (!f.socialCode) missing.push('统一社会信用代码');
      if (!f.adminPhone) missing.push('管理员手机号');
      if (!f.registerAddr) missing.push('工商注册地址');
      if (!f.detailAddr) missing.push('详细地址');
      if (!f.intro) missing.push('厂商简介');
      if (!f.companyPhone) missing.push('公司电话');
      if (!f.businessDeadline) missing.push('营业期限');
      if (missing.length) { this.$message.warning('请填写必填项：' + missing.join('、')); return; }
      if (!/^\d{11}$/.test(f.adminPhone)) { this.$message.warning('管理员手机号格式不正确'); return; }
      if (f.socialCode.length !== 18) { this.$message.warning('统一社会信用代码需 18 位'); return; }
      const v = VENDORS[0];
      Object.assign(v, {
        name: f.name, type: f.type, isPublicSea: f.isPublicSea, socialCode: f.socialCode,
        legalPerson: f.legalPerson, admin: f.admin, phone: f.adminPhone, registerAddr: f.registerAddr,
        detailAddr: f.detailAddr, vatPayer: f.vatPayer, intro: f.intro, companyPhone: f.companyPhone,
        businessDeadline: f.businessDeadline, portal: f.portal,
        f_bankType: f.f_bankType, f_bankName: f.f_bankName, f_bankAccount: f.f_bankAccount, f_accountPurpose: f.f_accountPurpose,
        i_addr: f.i_addr, i_taxNo: f.i_taxNo, i_phone: f.i_phone, i_bank: f.i_bank, i_bankAcc: f.i_bankAcc, i_bankLine: f.i_bankLine,
        logo: f.logo, license: f.license,
      });
      this.edit = false; this.$message.success('已保存企业信息');
    },
  },
  template: `
  <div>
    <div class="card" style="max-width:none">
      <template v-if="!edit">
        <div style="font-weight:600;margin-bottom:12px">基础信息</div>

          <el-form-item label="企业LOGO">
            <el-image v-for="(img,i) in form.logo" :key="i" :src="img.url" style="width:80px;height:80px;margin-right:10px;border:1px solid #ebeef5;border-radius:6px" fit="contain"></el-image>
            <span v-if="!form.logo.length" class="ro-text">—</span>
          </el-form-item>
          <el-form-item label="营业执照">
            <div v-for="(img,i) in form.license" :key="i" style="display:inline-block;margin-right:14px;margin-bottom:8px;text-align:center">
              <el-image :src="img.url" style="width:180px;height:120px;border:1px solid #ebeef5;border-radius:6px" fit="contain"></el-image>

/* =====================================================================
 * P11a 开发者接口注册（新增/编辑）
 * 字段：接口名称、接口类型、请求方式、接口签名类型、是否需要授权、请求地址、接口备注
 * 保存后接口状态=未上线
 * ===================================================================== */
app.component('P11a', {
  props: ['ctx'],
  data() {
    const r = DEV_APIS.find(x=>x.id===(this.ctx&&this.ctx.devApiId));
    return {
      isEdit: !!r,
      form: r ? {...r} : { name:'', type:'非敏感接口', method:'GET', sign:'无', needAuth:'否', reqUrl:'', note:'' },
    };
  },
  methods: {
    submit(){
      if(!this.form.name){ this.$message.warning('请填写接口名称'); return; }
      if(!this.form.reqUrl){ this.$message.warning('请填写请求地址'); return; }
      this.$message.success(this.isEdit ? '已保存' : '已新增，接口状态：未上线');
      this.$root.go('P11');
    },
  },
  template: `
  <div>
    <div class="card" style="max-width:680px">
      <div style="font-weight:600;margin-bottom:12px">{{ isEdit ? '编辑接口' : '新增接口' }}</div>
      <el-form label-width="110px" style="max-width:600px">
        <el-form-item label="接口名称" required><el-input v-model="form.name" placeholder="如 成绩查询接口"></el-input></el-form-item>
        <el-form-item label="接口类型">
          <el-radio-group v-model="form.type"><el-radio value="敏感接口">敏感接口</el-radio><el-radio value="非敏感接口">非敏感接口</el-radio></el-radio-group>
        </el-form-item>
        <el-form-item label="请求方式">
          <el-select v-model="form.method" style="width:100%"><el-option label="GET" value="GET"></el-option><el-option label="POST" value="POST"></el-option><el-option label="PUT" value="PUT"></el-option><el-option label="DELETE" value="DELETE"></el-option></el-select>
        </el-form-item>
        <el-form-item label="接口签名类型">
          <el-select v-model="form.sign" style="width:100%"><el-option label="无" value="无"></el-option><el-option label="MD5" value="MD5"></el-option><el-option label="SHA256" value="SHA256"></el-option></el-select>
        </el-form-item>
        <el-form-item label="是否需要授权">
          <el-radio-group v-model="form.needAuth"><el-radio value="是">是</el-radio><el-radio value="否">否</el-radio></el-radio-group>
        </el-form-item>
        <el-form-item label="请求地址" required><el-input v-model="form.reqUrl" placeholder="如 /api/xxx"></el-input></el-form-item>
        <el-form-item label="接口备注"><el-input type="textarea" :rows="3" v-model="form.note"></el-input></el-form-item>
        <el-form-item>
          <el-button @click="$root.go('P11')">取消</el-button>
          <el-button type="primary" @click="submit">保存</el-button>
        </el-form-item>
      </el-form>
    </div>
  </div>`,
});

 * ===================================================================== */
app.component('P17', {
  data() {
    return {
      q: { name: '', status: '' },
      rows: SUBACCOUNTS.map(x=>({...x,mDel:false})),
      addVisible: false,
      addForm: { name: '', phone: '', expire: '' },
    };
  },
  computed: {
    filtered() {
      return this.rows.filter(r =>
        (!this.q.name || r.name.includes(this.q.name)) &&
        (!this.q.status || r.status === this.q.status));
    },
  },
  methods: {
    openAdd(){ this.addForm = { name:'', phone:'', expire:'' }; this.addVisible = true; },
    add(){
      const f = this.addForm;
      if(!f.name){ this.$message.warning('请填写员工姓名'); return; }
      if(!f.phone){ this.$message.warning('请填写员工手机号'); return; }
      if(!/^\d{11}$/.test(f.phone)){ this.$message.warning('员工手机号格式不正确'); return; }
      if(!f.expire){ this.$message.warning('请选择到期时间'); return; }
      const id = this.rows.length ? Math.max(...this.rows.map(x=>x.id)) + 1 : 1;
      this.rows.push({ id, name: f.name, phone: f.phone, create: new Date().toISOString().slice(0,10), expire: f.expire, status: '正常', mDel:false });
      this.addVisible = false; this.$message.success('已新增子账号');
    },
    del(r){ this.rows = this.rows.filter(x=>x.id!==r.id); this.$message.success('已删除子账号'); },
  },
  template: `

/* =====================================================================
 * P19 开发者接口列表（API接口管理）
 * ===================================================================== */
app.component('P19', {
  data() {
    return {
      q:{ name:'', type:'', apiType:'' },
      applyVisible: false,
      applyForm: { apiId:'', appIds:[], reason:'', whiteList:[{ scheme:'https', domain:'' }] },
      applyApiOptions: APIS.filter(a=>a.visible),
      applyAppOptions: DEV_PASSED_APPS,
    };
  },
  computed: {
    visibleApis(){ return APIS.filter(a=>a.visible); },
    filtered(){ return this.visibleApis.filter(r=> (!this.q.name||r.name.includes(this.q.name)) && (!this.q.type||r.type===this.q.type) && (!this.q.apiType||r.apiType===this.q.apiType)); },
  },
  methods: {
    openApply(row){
      this.applyForm = { apiId: row ? row.id : '', appIds: [], reason: '', whiteList:[{ scheme:'https', domain:'' }] };
      this.applyVisible = true;
    },
    addWhite(){ this.applyForm.whiteList.push({ scheme:'https', domain:'' }); },
    removeWhite(i){ this.applyForm.whiteList.splice(i,1); },
    submitApply(){
      if(!this.applyForm.apiId){ this.$message.warning('请选择接口'); return; }
      if(!this.applyForm.appIds.length){ this.$message.warning('请至少选择一个应用'); return; }
      if(!this.applyForm.reason){ this.$message.warning('请填写申请理由'); return; }
      const wl = this.applyForm.whiteList.filter(x=>x.domain.trim());
      if(!wl.length){ this.$message.warning('请至少填写一个白名单域名'); return; }
      if(this.applyForm.whiteList.some(x=>x.domain && !/^([a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}(:\d{1,5})?$/.test(x.domain.trim()))){ this.$message.warning('请填写正确的域名格式'); return; }

/* =====================================================================
 * P20 开发者接口文档
 * ===================================================================== */
app.component('P20', {
  props: ['ctx'],
  data() {
    const a = APIS.find(x=>x.id===(this.ctx&&this.ctx.apiId));
    return { api: a || APIS[0] };
  },
  computed: {
    reqExample() {
      const ps = this.api.params.filter(x=>x.required).map(x=>'&'+x.name+'='+(x.type==='string'?'示例值':'1')).join('');
      return this.api.methods[0]+' '+this.api.reqUrl+'?access_token=ACCESS_TOKEN'+ps;
    },
    resExample() {
      const d = {}; this.api.params.forEach(p=>{ d[p.name] = p.type==='string'?'示例值':(p.type==='int32'?1:true); });
      return JSON.stringify({ errcode:0, errmsg:'ok', data:d }, null, 2);
    },
  },
  template: `
  <div>
    <div class="doc-header">
      <h2>{{ api.name }}</h2>
      <p>使用场景：{{ api.name }}，服务名 {{ api.service }}</p>
    </div>

    <div class="doc-label">权限说明：</div>

      <tr><th style="width:35%">权限项</th><th style="width:25%">说明</th><th>备注</th></tr>
      <tr><td>应用是否需要申请白名单</td><td>{{ api.needAuth ? '需要' : '不需要' }}</td><td></td></tr>
      <tr><td>用户凭证</td><td>未支持</td><td></td></tr>
      <tr><td>机构凭证</td><td>支持</td><td>获取不到用户凭证的后台管理场景使用</td></tr>
    </table>

    <p class="doc-field"><b>请求地址：</b><a :href="api.reqUrl" target="_blank" style="color:#1890ff">{{ api.reqUrl }}</a></p>

    <div class="doc-label">Query参数：</div>
    <table class="doc-tbl">
      <tr><th>参数</th><th>类型</th><th style="width:60px">必填</th><th>说明</th></tr>

    filtered(){ return SYNC_REQS.filter(r=> (!this.q.syncType||r.syncType===this.q.syncType) && (!this.q.status||r.status===this.q.status)); },
  },
  methods: {
    now(){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); },
    completeSync(row){
      this.$msgbox.confirm('确认已完成数据同步？确认后将标记本次同步完成。', '同步完成确认', { type:'warning', confirmButtonText:'确认完成', cancelButtonText:'取消' }).then(()=>{
        row.completeTime = this.now();
        row.status = row.syncType==='拉取数据' ? '已完成' : '待确认';

      <el-button type="primary">查询</el-button>
      <el-button @click="q.syncType='';q.time='';q.status=''">重置</el-button>

/* =====================================================================
 * P23 数据同步申请
 * ===================================================================== */
app.component('P23', {
  data() {
    return {
      form: { name:'', syncType:'拉取数据', hasApi:'', syncScopes:[{ apiId:'', fields:[] }], docFiles:[], orgs:'', authFiles:[], reason:'', agreed:false },
      declVisible: false,
    };
  },
  computed: {
    apiOptions(){ return APIS; },
  },
  methods: {
    onSyncTypeChange(){
      this.form.hasApi = '';
      this.form.docFiles = [];
      this.form.syncScopes = [{ apiId:'', fields:[] }];
    },
    addScope(){ this.form.syncScopes.push({ apiId:'', fields:[] }); },
    removeScope(idx){ this.form.syncScopes.splice(idx,1); },
    onScopeApiChange(idx){ this.form.syncScopes[idx].fields = []; },
    scopeFields(idx){
      const a = APIS.find(x=>x.id===this.form.syncScopes[idx].apiId);
      if(!a || !a.params) return [];
      return a.params.map(p=>({ value:p.name, label: p.name + (p.desc?('（'+p.desc+'）'):'') }));
    },
    onDocChange(file, fileList){
      const valid = fileList.filter(f=>{
        const okSize = f.raw && f.raw.size/1024/1024 <= 10;
        if(!okSize){ this.$message.warning('附件「'+f.name+'」超过10M，已忽略'); return false; }
        return true;
      });
      this.form.docFiles = valid.map(f=>({ name:f.name, url:f.url }));
    },
    onDocRemove(file, fileList){
      this.form.docFiles = fileList.map(f=>({ name:f.name, url:f.url }));
    },
    onAuthChange(file, fileList){
      const valid = fileList.filter(f=>{
        const isImg = f.raw && /image\//.test(f.raw.type);
        const okSize = f.raw && f.raw.size/1024/1024 <= 10;
        if(!isImg){ this.$message.warning('附件「'+f.name+'」不是图片格式，已忽略'); return false; }
        if(!okSize){ this.$message.warning('附件「'+f.name+'」超过10M，已忽略'); return false; }
        return true;
      });
      this.form.authFiles = valid.map(f=>({ name:f.name, url:f.url }));
    },
    onAuthRemove(file, fileList){
      this.form.authFiles = fileList.map(f=>({ name:f.name, url:f.url }));
    },
    submit(){
      if(!this.form.name.trim()){ this.$message.warning('请填写同步名称'); return; }
      if(!this.form.syncType){ this.$message.warning('请选择同步类型'); return; }
      if(this.form.syncType==='拉取数据'){
        for(const s of this.form.syncScopes){
          if(!s.apiId){ this.$message.warning('请选择API接口'); return; }
          if(!s.fields.length){ this.$message.warning('请选择需要同步的字段'); return; }
        }
        if(!this.form.orgs.trim()){ this.$message.warning('请填写同步机构'); return; }
        if(!this.form.authFiles.length){ this.$message.warning('请上传机构授权凭证'); return; }
      }
      if(this.form.syncType==='推送数据'){
        if(!this.form.hasApi){ this.$message.warning('请选择是否有接口'); return; }
        if(this.form.hasApi==='是' && !this.form.docFiles.length){ this.$message.warning('请上传对接文档'); return; }
        if(this.form.hasApi==='否'){
          for(const s of this.form.syncScopes){
            if(!s.apiId){ this.$message.warning('请选择API接口'); return; }
            if(!s.fields.length){ this.$message.warning('请选择需要同步的字段'); return; }
          }
        }
      }
      if(!this.form.reason){ this.$message.warning('请填写申请理由'); return; }
      if(!this.form.agreed){ this.$message.warning('请阅读并同意《数据同步使用责任声明》'); return; }
      const newId = SYNC_REQS.reduce((m,r)=>Math.max(m,r.id),0) + 1;
      let dataRange = '';
      if(this.form.syncType==='拉取数据'){
        dataRange = this.form.syncScopes.map(s=>APIS.find(x=>x.id===s.apiId).name + '：' + s.fields.join('、')).join('；');
        if(this.form.orgs){ dataRange += '｜机构：' + this.form.orgs; }
      } else if(this.form.syncType==='推送数据'){
        if(this.form.hasApi==='是'){
          dataRange = '已有对接接口（对接文档已上传）';
        } else {
          dataRange = this.form.syncScopes.map(s=>APIS.find(x=>x.id===s.apiId).name + '：' + s.fields.join('、')).join('；');
        }
      }
      SYNC_REQS.unshift({
        id: newId,
        name: this.form.name,
        syncType: this.form.syncType,
        vendor: '开发者',
        dataRange: dataRange,
        orgs: this.form.orgs,
        targetTable: '',
        reason: this.form.reason,
        status: '待审批',
        time: new Date().toISOString().slice(0,10),
        authFiles: this.form.authFiles,
        docFiles: this.form.docFiles,
      });
      this.$message.success('申请已提交，等待审批');
      this.$root.go('P22');
    },
  },
  template: `
  <div>
    <div class="card" style="max-width:none">
      <el-form label-width="110px" style="max-width:760px">
        <el-form-item label="同步名称" required>
          <el-input v-model="form.name" maxlength="50" show-word-limit placeholder="请输入同步名称"></el-input>
        </el-form-item>
        <el-form-item label="同步类型" required>
          <el-radio-group v-model="form.syncType" @change="onSyncTypeChange"><el-radio value="拉取数据">拉取数据</el-radio><el-radio value="推送数据">推送数据</el-radio></el-radio-group>
        </el-form-item>
        <template v-if="form.syncType==='拉取数据'">
          <div style="font-weight:600;margin:4px 0 12px">同步范围</div>
          <div v-for="(scope, idx) in form.syncScopes" :key="idx" style="background:#fafafa;border:1px solid #ebeef5;border-radius:8px;padding:8px 14px 4px;margin-bottom:10px">
            <el-form-item :label="'API接口'" required>
              <div style="display:flex;gap:8px;width:100%">
                <el-select v-model="scope.apiId" style="flex:1" placeholder="请选择API接口" @change="onScopeApiChange(idx)">
                  <el-option v-for="a in apiOptions" :key="a.id" :label="a.name" :value="a.id"></el-option>
                </el-select>
                <el-button v-if="form.syncScopes.length>1" type="danger" plain size="default" @click="removeScope(idx)">删除</el-button>
              </div>
            </el-form-item>
            <el-form-item label="同步字段" required>
              <el-checkbox-group v-model="scope.fields" style="margin-top:4px">
                <el-checkbox v-for="f in scopeFields(idx)" :key="f.value" :value="f.value" style="margin-right:10px;margin-bottom:8px">{{ f.label }}</el-checkbox>
              </el-checkbox-group>
              <div v-if="scope.apiId && !scopeFields(idx).length" style="color:#909399;font-size:12px;margin-top:4px">该接口暂无可选字段</div>
            </el-form-item>
          </div>
          <el-form-item>
            <el-button type="primary" plain @click="addScope">+ 添加接口</el-button>
          </el-form-item>
        </template>
        <template v-if="form.syncType==='推送数据'">
          <el-form-item label="是否有接口" required>
            <el-radio-group v-model="form.hasApi"><el-radio value="是">是</el-radio><el-radio value="否">否</el-radio></el-radio-group>
          </el-form-item>
          <template v-if="form.hasApi==='是'">
            <el-form-item label="对接文档" required>
              <el-upload action="#" :auto-upload="false" :file-list="form.docFiles" :on-change="onDocChange" :on-remove="onDocRemove">
                <el-button type="primary" plain>上传对接文档</el-button>
              </el-upload>
              <div style="color:#909399;font-size:12px;margin-top:4px">上传对应的对接文档，支持多文件上传，单个文件不超过 10M</div>
            </el-form-item>
          </template>
          <template v-if="form.hasApi==='否'">
            <div style="font-weight:600;margin:4px 0 12px">同步范围</div>
            <div v-for="(scope, idx) in form.syncScopes" :key="idx" style="background:#fafafa;border:1px solid #ebeef5;border-radius:8px;padding:8px 14px 4px;margin-bottom:10px">
              <el-form-item :label="'API接口'" required>
                <div style="display:flex;gap:8px;width:100%">
                  <el-select v-model="scope.apiId" style="flex:1" placeholder="请选择API接口" @change="onScopeApiChange(idx)">
                    <el-option v-for="a in apiOptions" :key="a.id" :label="a.name" :value="a.id"></el-option>
                  </el-select>
                  <el-button v-if="form.syncScopes.length>1" type="danger" plain size="default" @click="removeScope(idx)">删除</el-button>
                </div>
              </el-form-item>
              <el-form-item label="同步字段" required>
                <el-checkbox-group v-model="scope.fields" style="margin-top:4px">
                  <el-checkbox v-for="f in scopeFields(idx)" :key="f.value" :value="f.value" style="margin-right:10px;margin-bottom:8px">{{ f.label }}</el-checkbox>
                </el-checkbox-group>
                <div v-if="scope.apiId && !scopeFields(idx).length" style="color:#909399;font-size:12px;margin-top:4px">该接口暂无可选字段</div>
              </el-form-item>
            </div>
            <el-form-item>
              <el-button type="primary" plain @click="addScope">+ 添加接口</el-button>
            </el-form-item>
          </template>
        </template>
        <template v-if="form.syncType==='拉取数据'">
          <el-form-item label="同步机构" required>
            <el-input v-model="form.orgs" type="textarea" :rows="2" maxlength="500" show-word-limit placeholder="请输入完整机构名称，多个机构用顿号、或换行分隔"></el-input>
          </el-form-item>
          <el-form-item label="机构授权凭证" required>
            <el-upload action="#" :auto-upload="false" accept="image/*" list-type="picture-card" :file-list="form.authFiles" :on-change="onAuthChange" :on-remove="onAuthRemove">
              <div style="font-size:28px;line-height:1;color:#8c939d">+</div>
            </el-upload>
            <div style="color:#909399;font-size:12px;margin-top:4px">支持多张图片上传，单个附件不超过 10M，内容为同步机构的授权函扫描件等</div>
          </el-form-item>
        </template>
        <el-form-item label="申请理由" required>
          <el-input type="textarea" :rows="3" maxlength="500" show-word-limit v-model="form.reason" placeholder="请填写申请理由"></el-input>
        </el-form-item>
        <el-form-item label="责任声明" required>
          <div style="display:flex;align-items:flex-start;gap:6px;margin-top:2px">
            <el-checkbox v-model="form.agreed"></el-checkbox>
            <div>我已阅读并同意 <span style="color:#409eff;cursor:pointer" @click="declVisible=true">《数据同步使用责任声明》</span></div>
          </div>
        </el-form-item>
        <el-form-item>
          <el-button @click="$root.go('P22')">取消</el-button>
          <el-button type="primary" @click="submit">提交申请</el-button>
        </el-form-item>
      </el-form>
    </div>
    <el-dialog v-model="declVisible" title="数据同步使用责任声明" width="720px">
      <div style="max-height:440px;overflow:auto;padding-right:8px;line-height:1.9;font-size:14px;color:#303133">

      </template>
      <div style="margin-top:14px;text-align:center">
        <el-button @click="$root.go('P11')">返回</el-button>
      </div>
    </div>
  </div>`,
});

/* =====================================================================
 * P11a 开发者接口注册（新增/编辑）
 * 字段：接口名称、接口类型、请求方式、接口签名类型、是否需要授权、请求地址、接口备注
 * 保存后接口状态=未上线
 * ===================================================================== */
app.component('P11a', {
  props: ['ctx'],
  data() {
    const r = DEV_APIS.find(x=>x.id===(this.ctx&&this.ctx.devApiId));
    return {
      isEdit: !!r,
      form: r ? {...r} : { name:'', type:'非敏感接口', method:'GET', sign:'无', needAuth:'否', reqUrl:'', note:'' },
    };
  },
  methods: {
    submit(){
      if(!this.form.name){ this.$message.warning('请填写接口名称'); return; }
      if(!this.form.reqUrl){ this.$message.warning('请填写请求地址'); return; }
      this.$message.success(this.isEdit ? '已保存' : '已新增，接口状态：未上线');
      this.$root.go('P11');
    },
  },
  template: `
  <div>
    <div class="card" style="max-width:680px">
      <div style="font-weight:600;margin-bottom:12px">{{ isEdit ? '编辑接口' : '新增接口' }}</div>
      <el-form label-width="110px" style="max-width:600px">
        <el-form-item label="接口名称" required><el-input v-model="form.name" placeholder="如 成绩查询接口"></el-input></el-form-item>
        <el-form-item label="接口类型">
          <el-radio-group v-model="form.type"><el-radio value="敏感接口">敏感接口</el-radio><el-radio value="非敏感接口">非敏感接口</el-radio></el-radio-group>
        </el-form-item>
        <el-form-item label="请求方式">
          <el-select v-model="form.method" style="width:100%"><el-option label="GET" value="GET"></el-option><el-option label="POST" value="POST"></el-option><el-option label="PUT" value="PUT"></el-option><el-option label="DELETE" value="DELETE"></el-option></el-select>
        </el-form-item>
        <el-form-item label="接口签名类型">
          <el-select v-model="form.sign" style="width:100%"><el-option label="无" value="无"></el-option><el-option label="MD5" value="MD5"></el-option><el-option label="SHA256" value="SHA256"></el-option></el-select>
        </el-form-item>
        <el-form-item label="是否需要授权">
          <el-radio-group v-model="form.needAuth"><el-radio value="是">是</el-radio><el-radio value="否">否</el-radio></el-radio-group>
        </el-form-item>
        <el-form-item label="请求地址" required><el-input v-model="form.reqUrl" placeholder="如 /api/xxx"></el-input></el-form-item>
        <el-form-item label="接口备注"><el-input type="textarea" :rows="3" v-model="form.note"></el-input></el-form-item>
        <el-form-item>
          <el-button @click="$root.go('P11')">取消</el-button>
          <el-button type="primary" @click="submit">保存</el-button>
        </el-form-item>
      </el-form>
    </div>
  </div>`,
});

/* =====================================================================
 * P11c 厂商注册接口 / 开发者接口 查看
 * 展示接口基础信息（formItem 文本只读）+ 审批信息（文本只读）
 * ===================================================================== */
app.component('P11c', {
  props: ['ctx'],
  data() {
    const id = this.ctx && this.ctx.vendorApiId;
    const r = (VENDOR_APIS.find(x=>x.id===id)) || (DEV_APIS.find(x=>x.id===id)) || VENDOR_APIS[0];
    return { row: r };
  },
  template: `
  <div>
    <div class="card" style="max-width:none">
      <div style="font-weight:600;margin-bottom:12px">接口基础信息</div>
      <el-form label-width="120px" style="margin-bottom:18px">
        <el-row :gutter="16">
          <el-col :span="12"><el-form-item label="接口名称"><div class="ro-text">{{ row.name }}</div></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="接口服务名"><div class="ro-text">{{ row.service }}</div></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="注册厂商"><div class="ro-text">{{ row.vendor }}</div></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="注册来源"><div class="ro-text">{{ row.source }}</div></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="接口类型"><div class="ro-text">{{ row.type }}</div></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="请求方式"><div class="ro-text">{{ row.method }}</div></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="接口签名类型"><div class="ro-text">{{ row.sign }}</div></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="是否需要授权"><div class="ro-text">{{ row.needAuth }}</div></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="请求地址"><div class="ro-text">{{ row.reqUrl }}</div></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="接口状态"><div class="ro-text">{{ row.status }}</div></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="审批状态"><div class="ro-text">{{ row.audit }}</div></el-form-item></el-col>
          <el-col :span="24"><el-form-item label="接口备注"><div class="ro-text" style="white-space:pre-wrap">{{ row.note || '—' }}</div></el-form-item></el-col>
        </el-row>
      </el-form>
      <template v-if="row.audit==='已审批' || row.audit==='已驳回'">
        <div style="font-weight:600;margin-bottom:12px">审批信息</div>
        <el-form label-width="120px">
          <el-row :gutter="16">
            <el-col :span="12"><el-form-item label="审批状态"><div class="ro-text">{{ row.audit }}</div></el-form-item></el-col>
            <el-col :span="12"><el-form-item label="审批人"><div class="ro-text">{{ row.approver || '—' }}</div></el-form-item></el-col>
            <el-col :span="12"><el-form-item label="审批时间"><div class="ro-text">{{ row.approveTime || '—' }}</div></el-form-item></el-col>
            <el-col :span="12"><el-form-item label="审批意见"><div class="ro-text">{{ row.opinion || '—' }}</div></el-form-item></el-col>
            <el-col :span="12" v-if="row.gwUrl"><el-form-item label="网关转发地址"><div class="ro-text">{{ row.gwUrl }}</div></el-form-item></el-col>
            <el-col :span="12" v-if="row.visible"><el-form-item label="是否对外可见"><div class="ro-text">{{ row.visible }}</div></el-form-item></el-col>
            <el-col :span="24"><el-form-item label="审批说明"><div class="ro-text" style="white-space:pre-wrap">{{ row.opinionNote || '—' }}</div></el-form-item></el-col>
          </el-row>
        </el-form>
        <el-form label-width="120px">
          <el-row :gutter="16">
            <el-col :span="12"><el-form-item label="审批状态"><div class="ro-text">{{ row.audit }}</div></el-form-item></el-col>
            <el-col :span="12"><el-form-item label="审批人"><div class="ro-text">{{ row.approver || '—' }}</div></el-form-item></el-col>
            <el-col :span="12"><el-form-item label="审批时间"><div class="ro-text">{{ row.approveTime || '—' }}</div></el-form-item></el-col>
            <el-col :span="12"><el-form-item label="审批意见"><div class="ro-text">{{ row.opinion || '—' }}</div></el-form-item></el-col>
            <el-col :span="12" v-if="row.gwUrl"><el-form-item label="网关转发地址"><div class="ro-text">{{ row.gwUrl }}</div></el-form-item></el-col>
            <el-col :span="12" v-if="row.visible"><el-form-item label="是否对外可见"><div class="ro-text">{{ row.visible }}</div></el-form-item></el-col>
            <el-col :span="24"><el-form-item label="审批说明"><div class="ro-text" style="white-space:pre-wrap">{{ row.opinionNote || '—' }}</div></el-form-item></el-col>
          </el-row>
        </el-form>
      </template>
      <div style="margin-top:14px;text-align:center">
        <el-button @click="$root.go('P11')">返回</el-button>
      </div>
    </div>
  </div>`,
});

/* =====================================================================
 * P26 数据同步查看
 * ===================================================================== */
app.component('P26', {
  props: ['ctx'],
  data() {
    const r = SYNC_REQS.find(x=>x.id===(this.ctx&&this.ctx.syncId));
    return { row: r || SYNC_REQS[4], showLog:false };
  },
  computed: {
    isSuper(){ return this.$root.role==='super'; },
  },
  methods: {
    retry(){ this.row.status='同步中'; this.$message.success('已重新启动同步，等待同步完成'); },
  },
  template: `
  <div>
    <div class="card" style="max-width:760px">
      <div style="font-weight:600;margin-bottom:12px">申请信息</div>
      <el-form label-width="110px">
        <el-row :gutter="16">
          <el-col :span="12"><el-form-item label="同步名称"><div class="ro-text">{{ row.name }}</div></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="同步类型"><div class="ro-text">{{ row.syncType }}</div></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="申请厂商"><div class="ro-text">{{ row.vendor }}</div></el-form-item></el-col>
          <el-col :span="24"><el-form-item label="同步范围"><div class="ro-text" style="white-space:pre-wrap">{{ row.dataRange }}</div></el-form-item></el-col>
          <el-col v-if="row.orgs" :span="24"><el-form-item label="同步机构"><div class="ro-text" style="white-space:pre-wrap">{{ row.orgs }}</div></el-form-item></el-col>
          <el-col v-if="row.authFiles && row.authFiles.length" :span="24"><el-form-item label="机构授权凭证"><div v-for="f in row.authFiles" :key="f.name" class="ro-text">📄 {{ f.name }}</div></el-form-item></el-col>
          <el-col :span="24"><el-form-item label="申请理由"><div class="ro-text" style="white-space:pre-wrap">{{ row.reason }}</div></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="同步状态"><st-tag :v="row.status"/></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="目标数据表"><div class="ro-text">{{ row.targetTable || '—' }}</div></el-form-item></el-col>
        </el-row>
      </el-form>
      <template v-if="row.approver">
        <div style="font-weight:600;margin:4px 0 12px">审批信息</div>
        <el-form label-width="110px">
          <el-row :gutter="16">
            <el-col :span="12"><el-form-item label="审批人"><div class="ro-text">{{ row.approver }}</div></el-form-item></el-col>
            <el-col :span="12"><el-form-item label="审批时间"><div class="ro-text">{{ row.approveTime }}</div></el-form-item></el-col>
          </el-row>
        </el-form>
      </template>
      <template v-if="row.completeTime || row.confirmTime">
        <div style="font-weight:600;margin:4px 0 12px">同步信息</div>
        <el-form label-width="110px">
          <el-row :gutter="16">
            <el-col v-if="row.completeTime" :span="12"><el-form-item label="同步完成时间"><div class="ro-text">{{ row.completeTime }}</div></el-form-item></el-col>
            <el-col v-if="row.confirmTime" :span="12"><el-form-item label="确认同步时间"><div class="ro-text">{{ row.confirmTime }}</div></el-form-item></el-col>
          </el-row>
        </el-form>
      </template>
      <template v-if="row.appKey">
        <div style="font-weight:600;margin:4px 0 12px">接口凭证</div>
        <el-form label-width="110px">
          <el-row :gutter="16">
            <el-col :span="12"><el-form-item label="AppKey"><div class="ro-text">{{ row.appKey }}</div></el-form-item></el-col>
            <el-col :span="12"><el-form-item label="SecretKey"><div class="ro-text">{{ isSuper ? 'SK-9f2k1m8x' : 'SK-********' }}<span v-if="!isSuper" style="color:#909399;font-size:12px">（超管可见完整值）</span></div></el-form-item></el-col>
          </el-row>
        </el-form>
      </template>
      <div v-if="row.docFiles && row.docFiles.length" style="margin-top:14px">
        <div style="font-weight:600;margin-bottom:8px">对接文档</div>
        <div v-for="f in row.docFiles" :key="f.name" style="display:flex;align-items:center;gap:4px;color:#409eff;cursor:pointer;margin-bottom:4px"><span>📄 {{ f.name }}</span></div>
      </div>
      <template v-if="row.taskId">
        <div style="font-weight:600;margin:4px 0 12px">同步任务</div>
        <el-form label-width="110px">
          <el-row :gutter="16">
            <el-col :span="12"><el-form-item label="任务ID"><div class="ro-text">{{ row.taskId }}</div></el-form-item></el-col>
            <el-col :span="12"><el-form-item label="任务状态"><st-tag :v="row.status"/></el-form-item></el-col>
            <el-col :span="24"><el-form-item label="失败原因" v-if="row.failNote"><div class="ro-text">{{ row.failNote }}</div></el-form-item></el-col>
            <el-col :span="24"><el-form-item label="同步日志">
              <div style="width:100%">
                <el-button size="small" @click="showLog=!showLog">{{ showLog ? '收起同步日志' : '展开同步日志' }}</el-button>
                <pre v-if="showLog" style="background:#f5f7fa;padding:12px;border-radius:4px;font-size:12px;margin-top:8px;white-space:pre-wrap">{{ row.logs ? row.logs.join('\\n') : '暂无日志' }}</pre>
              </div>
            </el-form-item></el-col>
          </el-row>
        </el-form>
        <div v-if="row.status==='失败' && isSuper" style="margin-bottom:10px"><el-button type="primary" size="small" @click="retry">重试</el-button></div>
      </template>
      <div style="margin-top:14px;text-align:center">
        <el-button @click="$root.go('P22')">返回列表</el-button>
      </div>
    </div>
  </div>`,
});

app.mount('#app');
</script>
</body>
</html>
