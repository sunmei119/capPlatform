        <el-tag size="small" type="info">{{ roleName }}</el-tag>

      <div style="flex:1"></div>

        <el-radio-button v-for="r in ROLES" :key="r.key" :value="r.key">{{ r.name }}</el-radio-button>
      </el-radio-group>
    </el-header>

    <el-container>
      <!-- 左侧菜单树（二级菜单） -->
      <el-aside v-if="!standalone" width="260px">

            <el-menu-item v-else :index="item.page">{{ item.label }}</el-menu-item>
          </template>
        </el-menu>
      </el-aside>

</div>

        { id:3, name:'业务服务', code:'BIZ', sort:3, status:'启用', level:1, children:[] },
      ],
      dlgVisible: false,
      dlgTitle: '新增分类',
      form: { name:'', code:'', sort:0, parentId:null, parentName:'' },
      editId: null,
    };
  },
  methods: {
    filterTree(nodes) {
      if(!this.q.name && !this.q.status) return nodes;
      const match = n => (!this.q.name || n.name.includes(this.q.name)) && (!this.q.status || n.status===this.q.status);
      const filter = list => list.reduce((acc, n) => {
        const kids = n.children ? filter(n.children) : [];
        if(match(n) || kids.length) acc.push({...n, children: match(n)&&!this.q.name ? n.children : kids});
        return acc;
      }, []);
      return filter(nodes);
    },
    resetQuery() { this.q = { name:'', status:'' }; },
    getLevel(node) {
      let lv = 1, cur = node;
      const findParent = (tree, pid) => { for(const n of tree){ if(n.id===pid) return n; if(n.children){ const r=findParent(n.children,pid); if(r) return r; } } return null; };
      while(cur && cur.parentId){ cur = findParent(this.tree, cur.parentId); lv++; }
      return lv;
    },
    openAdd(parent) {
      if(parent && this.getLevel(parent)>=5){ this.$message.warning('最多支持五层分类'); return; }
      this.dlgTitle = parent ? '新增子分类' : '新增顶级分类';
      this.form = { name:'', code:'', sort:0, parentId: parent?parent.id:null, parentName: parent?parent.name:'' };
      this.editId = null;
      this.dlgVisible = true;
    },
    openEdit(row) {
      this.dlgTitle = '编辑分类';
      this.form = { name:row.name, code:row.code, sort:row.sort, parentId:row.parentId||null, parentName:'' };
      this.editId = row.id;
      this.dlgVisible = true;
    },
    saveForm() {
      if(!this.form.name){ this.$message.warning('请填写分类名称'); return; }
      if(!this.form.code){ this.$message.warning('请填写分类编码'); return; }
      this.$message.success(this.editId ? '编辑成功' : '新增成功');
      this.dlgVisible = false;
    },
    toggleStatus(row) {
      const action = row.status==='启用' ? '停用' : '启用';
      ElMessageBox.confirm(`确认${action}分类"${row.name}"？`, '提示', {type:'warning'}).then(()=>{
        row.status = action==='停用' ? '停用' : '启用';
        this.$message.success(`已${action}`);
      }).catch(()=>{});
    },
    delRow(row) {
      if(row.children && row.children.length){ this.$message.warning('存在子分类或被接口引用，无法删除'); return; }
      ElMessageBox.confirm(`确认删除分类"${row.name}"？删除后不可恢复`, '提示', {type:'warning'}).then(()=>{
        this.$message.success('已删除');
      }).catch(()=>{});
    },
  },
  template: `
  <div>
    <div class="toolbar">
      <span class="q-label">分类名称</span>
      <el-input v-model="q.name" placeholder="请输入分类名称" clearable style="width:200px"></el-input>
      <span class="q-label">分类状态</span>
      <el-select v-model="q.status" placeholder="请选择" clearable style="width:140px">
        <el-option label="启用" value="启用"></el-option>
        <el-option label="停用" value="停用"></el-option>
      </el-select>
      <el-button type="primary" @click="$forceUpdate()">查询</el-button>
      <el-button @click="resetQuery">重置</el-button>
      <el-button type="primary" @click="openAdd(null)">新增顶级分类</el-button>
    </div>
    <div class="card">
      <el-table :data="filterTree(tree)" row-key="id" :tree-props="{children:'children'}" stripe default-expand-all>
        <el-table-column prop="name" label="分类名称" min-width="200"></el-table-column>
        <el-table-column prop="code" label="分类编码" width="180"></el-table-column>
        <el-table-column prop="sort" label="排序" width="80"></el-table-column>
        <el-table-column label="分类状态" width="100">
          <template #default="{row}"><el-tag :type="row.status==='启用'?'success':'info'" size="small">{{ row.status }}</el-tag></template>
        </el-table-column>
        <el-table-column label="操作" min-width="280">
          <template #default="{row}">
            <el-button link type="primary" @click="openAdd(row)">新增子分类</el-button>
            <el-button link @click="openEdit(row)">编辑</el-button>
            <el-button link :type="row.status==='启用'?'warning':'primary'" @click="toggleStatus(row)">{{ row.status==='启用'?'停用':'启用' }}</el-button>
            <el-button link type="danger" @click="delRow(row)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>
    </div>
    <el-dialog v-model="dlgVisible" :title="dlgTitle" width="480px" destroy-on-close>
      <el-form label-width="100px">
        <el-form-item label="父级分类" v-if="form.parentId!==null"><el-input :model-value="form.parentName" disabled></el-input></el-form-item>
        <el-form-item label="分类名称" required><el-input v-model="form.name" maxlength="50" placeholder="请输入分类名称"></el-input></el-form-item>
        <el-form-item label="分类编码" required><el-input v-model="form.code" maxlength="50" placeholder="全局唯一编码"></el-input></el-form-item>
        <el-form-item label="排序"><el-input-number v-model="form.sort" :min="0" controls-position="right"></el-input-number></el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="dlgVisible=false">取消</el-button>
        <el-button type="primary" @click="saveForm">确定</el-button>
      </template>
    </el-dialog>
  </div>`
});

    isApplier(){ return !(this.$root.role==='super' || this.$root.role==='org'); },

/* =====================================================================
 * P06 接口文档查看
 * ===================================================================== */
app.component('P06', {
  props: ['ctx'],
  data() {
    const a = APIS.find(x=>x.id===(this.ctx&&this.ctx.apiId));
    return { api: a || APIS[0] };
  },
  computed: {
    reqExample() {
      const ps = (this.api.params||[]).filter(x=>x.required).map(x=>'&'+x.name+'='+(x.type==='string'?'示例值':'1')).join('');
      return this.api.methods[0]+' '+this.api.reqUrl+'?access_token=ACCESS_TOKEN'+ps;
    },
    resExample() {
      const d = {}; (this.api.params||[]).forEach(p=>{ d[p.name] = p.type==='string'?'示例值':(p.type==='int32'?1:true); });
      return JSON.stringify({ errcode:0, errmsg:'ok', data:d }, null, 2);
    },
  },
  template: `
  <div>
    <div class="doc-header">
      <h2>{{ api.name }}</h2>
      <p>使用场景：{{ api.name }}，服务名 {{ api.service }}</p>
    </div>

    <table class="doc-tbl">
      <tr><th style="width:35%">权限项</th><th style="width:25%">说明</th><th>备注</th></tr>

      <tr><td>用户凭证</td><td>未支持</td><td></td></tr>
      <tr><td>机构凭证</td><td>支持</td><td>获取不到用户凭证的后台管理场景使用</td></tr>
    </table>

    <p class="doc-field"><b>请求地址：</b><a :href="api.reqUrl" target="_blank" style="color:#1890ff">{{ api.reqUrl }}</a></p>

    <p style="color:#909399;font-size:12px">注意：全量查询仅适用于数据量较少的场景；请尽量按需获取，减少全量查询带来的时延问题。</p>
    <p style="font-size:12px">推荐请求地址：<a :href="api.reqUrl+'?access_token=ACCESS_TOKEN'" target="_blank" style="color:#1890ff">{{ api.reqUrl }}?access_token=ACCESS_TOKEN</a></p>

      <tr><td>data</td><td>object</td><td>返回数据对象</td></tr>
    </table>

    <div style="margin-top:14px;text-align:center"><el-button @click="$root.go('P04')">返回接口列表</el-button></div>
  </div>`,
});

/* =====================================================================
 * P07 应用授权
 * 功能点：应用授权 / 添加授权 / 批量移除授权 / 移除授权
 * ===================================================================== */
app.component('P07', {
  props: ['ctx'],
  data() {
    const a = APIS.find(x=>x.id===(this.ctx&&this.ctx.apiId));
    const api = a || APIS[0];
    const preAuth = ['app_1001','app_1002','app_1005'];
    return { api,
      rows: APP_LIST.filter(x=>preAuth.includes(x.appId)).map(x=>({...x,checked:false})),
      q:{appName:'',appId:''}, mAdd:false, addChosen:[], mBatch:false,
      addPage: 1, addPageSize: 10, addQuery: { appName: '', appId: '', appAttr: '' },
    };
  },
  computed: {
    authorizedIds(){ return this.rows.map(x=>x.appId); },
    availableApps(){ return APP_LIST.filter(x=>!this.authorizedIds.includes(x.appId)); },
    chosenApps(){ return this.addChosen.map(id => APP_LIST.find(a=>a.appId===id)).filter(Boolean); },
    batchCount(){ return this.rows.filter(x=>x.checked).length; },
    filteredAddApps() {
      const q = this.addQuery;
      return this.availableApps.filter(a =>
        (!q.appName || a.appName.includes(q.appName)) &&
        (!q.appId || a.appId.includes(q.appId)) &&
        (!q.appAttr || a.appAttr === q.appAttr)
      );
    },
    pagedAddApps() {
      const start = (this.addPage - 1) * this.addPageSize;
      return this.filteredAddApps.slice(start, start + this.addPageSize);
    },
  },
  methods: {
    removeApp(row){ this.rows = this.rows.filter(x=>x.appId!==row.appId); this.$message.success('已移除授权'); },
    confirmBatch(){ const sel=this.rows.filter(x=>x.checked); this.rows=this.rows.filter(x=>!x.checked); this.mBatch=false; this.$message.success('已移除 '+sel.length+' 个应用授权'); },
    toggleAdd(row){ const id=row.appId; const i=this.addChosen.indexOf(id); if(i>=0)this.addChosen.splice(i,1); else this.addChosen.push(id); },
    isChosen(row){ return this.addChosen.includes(row.appId); },
    isAllChecked(){ return this.pagedAddApps.length>0 && this.pagedAddApps.every(a=>this.addChosen.includes(a.appId)); },
    toggleAllAdd(checked) {
      if (checked) {
        this.pagedAddApps.forEach(a => { if(!this.addChosen.includes(a.appId)) this.addChosen.push(a.appId); });
      } else {
        const pageIds = this.pagedAddApps.map(a => a.appId);
        this.addChosen = this.addChosen.filter(id => !pageIds.includes(id));
      }
    },
    confirmAdd(){ this.addChosen.forEach(id=>{ const a=APP_LIST.find(x=>x.appId===id); if(a)this.rows.push({...a,checked:false}); }); this.addChosen=[]; this.mAdd=false; this.$message.success('已添加授权'); },
    openAddDialog() {
      this.addChosen = [];
      this.addQuery = { appName: '', appId: '', appAttr: '' };
      this.addPage = 1;
      this.mAdd = true;
    },
  },
  template: `
  <div>
    <div class="card">
      <div style="margin-bottom:14px">接口名称：<b>{{ api.name }}</b></div>
      <div class="toolbar" style="margin-bottom:10px">
        <span class="q-label">应用名称</span><el-input v-model="q.appName" placeholder="请输入应用名称" clearable style="width:160px"></el-input>
        <span class="q-label">应用ID</span><el-input v-model="q.appId" placeholder="请输入应用ID" clearable style="width:150px"></el-input>
        <el-button type="primary">查询</el-button>
        <div style="flex:1"></div>
        <el-button type="primary" @click="openAddDialog">添加授权</el-button>
        <el-button :disabled="!batchCount" @click="mBatch=true">批量移除授权</el-button>
      </div>
      <el-table :data="rows" stripe>
        <el-table-column width="50"><template #default="s"><el-checkbox v-model="s.row.checked"></el-checkbox></template></el-table-column>
        <el-table-column prop="appId" label="应用ID" width="120"></el-table-column>
        <el-table-column prop="appName" label="应用名称"></el-table-column>
        <el-table-column prop="appAttr" label="应用属性" width="100"></el-table-column>
        <el-table-column label="操作" width="100"><template #default="s"><el-button link type="danger" @click="removeApp(s.row)">移除授权</el-button></template></el-table-column>
      </el-table>
    </div>
    <el-dialog v-model="mAdd" title="添加授权" width="860px" :close-on-click-modal="false">
      <div style="display:flex;gap:16px;min-height:400px">
        <!-- 左侧：搜索 + 表格（结构与 P15 请选择机构和学校弹窗一致，可正常多选） -->
        <div style="flex:1;display:flex;flex-direction:column">
          <div style="margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <span class="q-label">应用名称</span><el-input v-model="addQuery.appName" placeholder="请输入应用名称" clearable style="width:140px" size="default"></el-input>
            <span class="q-label">应用ID</span><el-input v-model="addQuery.appId" placeholder="请输入应用ID" clearable style="width:120px" size="default"></el-input>
            <span class="q-label">应用属性</span><el-select v-model="addQuery.appAttr" placeholder="请选择" clearable style="width:150px" size="default">
              <el-option label="生态应用" value="生态应用"></el-option>
              <el-option label="原生应用/低代码应用" value="原生应用/低代码应用"></el-option>
              <el-option label="原生应用/自建应用" value="原生应用/自建应用"></el-option>
            </el-select>
            <el-button type="primary" size="default">查询</el-button>
          </div>
          <el-table :data="pagedAddApps" border size="small" style="width:100%">
            <el-table-column width="44" align="center">
              <template #header>
                <el-checkbox :model-value="isAllChecked()" @change="toggleAllAdd"></el-checkbox>
              </template>
              <template #default="s">
                <el-checkbox :model-value="isChosen(s.row)" @change="toggleAdd(s.row)"></el-checkbox>
              </template>
            </el-table-column>
            <el-table-column prop="appName" label="应用名称" min-width="150"></el-table-column>
            <el-table-column prop="appId" label="应用ID" width="110"></el-table-column>
            <el-table-column prop="appAttr" label="应用属性" min-width="140"></el-table-column>
          </el-table>
          <div style="display:flex;justify-content:flex-end;margin-top:10px">
            <el-pagination
              v-model:current-page="addPage"
              :page-size="addPageSize"
              :total="filteredAddApps.length"
              layout="total, prev, pager, next, sizes"
              :page-sizes="[10, 20, 50]"
              @size-change="v => { addPageSize = v; addPage = 1; }"
              small
            ></el-pagination>
          </div>
        </div>
        <!-- 右侧：已选应用 -->
        <div style="width:200px;border-left:1px solid #e4e7ed;padding-left:14px;display:flex;flex-direction:column">
          <div style="font-size:13px;color:#909399;margin-bottom:8px;font-weight:500">已选择应用（{{ addChosen.length }}）</div>
          <div style="flex:1;overflow-y:auto">
            <div v-for="app in chosenApps" :key="app.appId" style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f2f3f5">
              <span style="font-size:13px">{{ app.appName }}</span>
              <el-button link type="danger" size="small" @click="toggleAdd(app)" style="font-size:14px;padding:0">×</el-button>
            </div>
            <div v-if="!addChosen.length" style="color:#c0c4cc;font-size:12px;text-align:center;padding:20px 0">尚未选择</div>
          </div>
        </div>
      </div>
      <template #footer>
        <el-button @click="mAdd=false">取消</el-button>
        <el-button type="primary" :disabled="!addChosen.length" @click="confirmAdd">确认授权</el-button>
      </template>
    </el-dialog>
    <el-dialog v-model="mBatch" title="批量移除授权" width="440px">
      <p style="margin:0 0 10px">以下应用将被移除授权：</p>
      <el-tag v-for="r in rows.filter(x=>x.checked)" :key="r.appId" style="margin:2px">{{ r.appName }}</el-tag>
      <template #footer><el-button @click="mBatch=false">取消</el-button><el-button type="danger" @click="confirmBatch">确认移除</el-button></template>
    </el-dialog>
  </div>`,
});

/* =====================================================================
 * P08 接口申请记录
 * 功能点：申请记录列表及查询 / 申请审批 / 申请记录查看
 * ===================================================================== */
app.component('P08', {
  props: ['ctx'],
  data() {
    return { q:{ name:'', appId:'', status:'' }, showKey:{} };
  },
  computed: {
    isDev(){ return this.$root.role==='dev'; },
    sorted(){
      const arr = API_APPS.filter(r=> (!this.q.name||r.apis.some(a=>a.name.includes(this.q.name))) && (!this.q.appId||r.appId.includes(this.q.appId)) && (!this.q.status||r.status===this.q.status));
      return arr.slice().sort((a,b)=>(a.status===b.status?0:a.status==='未审批'?-1:1));
    },
  },
  methods: {
    apiNames(row){ return (row.apis||[]).map(a=>a.name).join('、'); },
    firstApi(row){ return (row.apis||[])[0] || {}; },
    apiIdsOf(row){ return (row.apis||[]).map(a => { const x = APIS.find(y=>y.name===a.name); return x ? x.id : null; }).filter(Boolean); },
    capOf(apiName){ const a = APIS.find(x=>x.name===apiName); return a ? a.apiType : '—'; },
    maskKey(k){ if(!k) return '—'; return k.slice(0,3) + '****' + k.slice(-2); },
    resubmit(row){ this.$root.go('P21m', { apiIds: this.apiIdsOf(row), reapplyId: row.id }); },
  },
  template: `
  <div>
    <div class="toolbar">

      <span style="color:#909399;font-size:12px">最新未审批数据排最前</span>
    </div>
    <div class="card">
      <el-table :data="sorted" stripe>

        <el-table-column label="操作" min-width="160" fixed="right">

            <el-button link @click="$root.go('P10',{appId:s.row.id})">查看</el-button>
            <el-button v-if="(s.row.status==='已审批' && s.row.opinion==='不通过') && isDev" link type="warning" @click="resubmit(s.row)">重新提交</el-button>

});

/* =====================================================================
 * P09 申请审批
 * ===================================================================== */
app.component('P09', {
  props: ['ctx'],
  data() {
    const r = API_APPS.find(x=>x.id===(this.ctx&&this.ctx.appId));
    const row = r || API_APPS[0];
    return { row, opinion:'通过', note:'', credFiles: [] };
  },
  methods: {
    suiteKeyOf(appId){ const a = (APP_LIST||[]).find(x=>x.appId===appId); return a ? a.suiteKey : ''; },
    beforeCredUpload(file){
      const isLt10M = file.size / 1024 / 1024 < 10;
      if(!isLt10M){ this.$message.error('单个图片不可超过 10MB'); }
      return isLt10M;
    },
    dummyCredUpload(){ /* 演示用：不发起真实请求，由 file-list 维护预览 */ },
    handleCredRemove(file, fileList){ this.credFiles = fileList; },
    handleCredPreview(file){ if(file.url) window.open(file.url); },
    submit(){
      if(this.opinion==='不通过'&&!this.note){this.$message.warning('不通过时审核说明必填');return;}
      this.row.status='已审批'; this.row.opinion=this.opinion; this.row.opinionNote=this.note; this.row.approver='王机构'; this.row.approveTime='2026-08-05 15:00';
      if(this.opinion==='通过'){
        this.row.authKey = this.suiteKeyOf(this.row.appId);
        // 机构管理员审批通过 → 开发者获取当前机构的数据授权，可获取数据
        this.row.dataAuthorized = true;
        this.row.credFiles = this.credFiles.map(f => f.name);
      }
      if(this.opinion==='不通过'){
        this.$message.warning('已驳回，开发者可在申请记录中编辑后重新提交');
      } else {
        this.$message.success('审批已提交，开发者已获取本机构数据授权，授权key已生成');
      }
      this.$root.go('P08');
    },
  },
  template: `
  <div>
    <div class="card" style="max-width:none">
      <div style="font-weight:600;margin-bottom:12px">申请接口（共 {{ row.apis.length }} 个）</div>
      <el-table :data="row.apis" border size="small" style="margin-bottom:18px">
        <el-table-column prop="name" label="接口名称" min-width="160"></el-table-column>
        <el-table-column prop="service" label="接口服务名" min-width="140"></el-table-column>
        <el-table-column prop="apiType" label="接口能力" width="100"></el-table-column>
        <el-table-column prop="identity" label="调用身份" width="90"></el-table-column>
        <el-table-column prop="type" label="数据敏感等级" width="100"></el-table-column>
      </el-table>
      <div style="font-weight:600;margin:8px 0 12px">申请信息</div>
      <el-form label-width="120px" style="margin-bottom:18px">
        <el-row :gutter="16">
          <el-col :span="12"><el-form-item label="应用ID"><div class="ro-text">{{ row.appId }}</div></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="厂商名称"><div class="ro-text">{{ row.vendor }}</div></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="同步范围类型"><div class="ro-text">{{ (row.rangeTypes||[]).join('、') || '—' }}</div></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="机构名称"><div class="ro-text">{{ row.orgs || '—' }}</div></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="是否包含下级"><div class="ro-text">{{ row.includeSub || '—' }}</div></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="最大调用量/日"><div class="ro-text">{{ row.maxCalls }}</div></el-form-item></el-col>
          <el-col :span="24"><el-form-item label="申请理由"><div class="ro-text">{{ row.reason }}</div></el-form-item></el-col>
          <el-col :span="24"><el-form-item label="白名单"><div class="ro-text">{{ (row.whiteList||[]).join('、') || '—' }}</div></el-form-item></el-col>
        </el-row>
      </el-form>
      <el-form label-width="90px">
        <el-form-item label="审核意见" required>
          <el-radio-group v-model="opinion"><el-radio value="通过">通过</el-radio><el-radio value="不通过">不通过</el-radio></el-radio-group>
        </el-form-item>
        <el-form-item label="审核说明"><el-input type="textarea" :rows="3" maxlength="500" show-word-limit v-model="note"></el-input></el-form-item>
        <el-form-item label="机构授权凭证">
          <el-upload
            action="#"
            list-type="picture-card"
            :multiple="true"
            :file-list="credFiles"
            :before-upload="beforeCredUpload"
            :on-preview="handleCredPreview"
            :on-remove="handleCredRemove"
            :http-request="dummyCredUpload">
            <i class="el-icon-plus"></i>
          </el-upload>
          <div style="color:#909399;font-size:12px;line-height:1.5">非必填，支持上传多个图片，单个图片不可超过 10MB；机构管理员审批通过后，开发者即获取本机构的数据授权，可获取数据</div>

        <el-form-item class="form-actions">
          <el-button @click="$root.go('P08')">取消</el-button>
          <el-button type="primary" @click="submit">提交审批</el-button>
        </el-form-item>
      </el-form>
    </div>
  </div>`,
});



/* =====================================================================
 * P21m 开发者批量接口申请（多选接口后新增申请）
 * 字段：所选接口（带出只读）/ 应用名称 / 最大调用量·日 / 同步范围类型（机构/学校/教育局，可多选）
 *       / 机构名称（多个;隔开，按名称向各机构管理员推送待办）/ 是否包含下级 / 申请理由 / 白名单 / 免责声明
 * ===================================================================== */
app.component('P21m', {
  props: ['ctx'],
  data() {
    const ids = (this.ctx && this.ctx.apiIds) || [];
    const list = this.$root.role==='dev' ? DEV_PASSED_APPS : APP_LIST;
    return {
      apis: APIS.filter(a => ids.includes(a.id)),
      appOptions: list,
      form: {
        appId: list[0].appId,
        maxCalls: 10000,
        rangeTypes: ['机构'],       // 同步范围类型：机构 / 学校 / 教育局（可多选）
        orgs: '',                   // 多行，多个机构用英文分号（;）隔开，按名称精确匹配
        includeSub: '否',           // 是否包含下级：数据范围是否包含机构的下级单位（同步范围含"机构"时必填）
        declText: '',               // 免责声明正文
        agreed: false,
        reason: '',
        whiteList: [{ scheme: 'https', domain: '' }],  // 白名单（前缀+域名，可多个，必填）
      },
      declVisible: false,
    };
  },
  computed: {
    showIncludeSub(){ return this.form.rangeTypes.includes('机构'); },
  },
  methods: {
    onRangeChange(){

      return this.rows.filter(r =>
        (!this.q.apiName || r.apiName.includes(this.q.apiName)) &&
        (!this.q.vendor || r.vendor.includes(this.q.vendor)) &&
        (!this.q.result || r.result === this.q.result));

/* =====================================================================

      { id: 'ORG003', name: '桂林市教育局', parent: '广西壮族自治区教育厅', type: '教育局' },
      { id: 'ORG004', name: '柳州市教育局', parent: '广西壮族自治区教育厅', type: '教育局' },
      { id: 'ORG005', name: '南宁市第一中学', parent: '南宁市教育局', type: '学校' },

      { id: 'ORG008', name: '桂林市育才学校', parent: '桂林市教育局', type: '学校' },
      { id: 'ORG009', name: '北海市海城区小学', parent: '北海市教育局', type: '学校' },
      { id: 'ORG010', name: '柳州市景行小学', parent: '柳州市教育局', type: '学校' },
    ];
    const selectedOrgs = src ? src.orgs.split('、').map(n => allOrgs.find(o=>o.name===n)).filter(Boolean) : [];
    return {
      form: {
        name: src ? src.name : '',
        tenantType: '行政租户',
        orgScope: selectedOrgs.map(o=>o.name).join('、'),
        desc: '',
      },
      selectedOrgs: selectedOrgs,
      allOrgs: allOrgs,
      orgDialogVisible: false,
      orgQuery: { name: '', type: '' },
      orgSelection: [],
      orgPage: 1,
      orgPageSize: 10,
      importDialogVisible: false,
      importFile: null,
    };
  },
  computed: {
    orgScopeLen() { return this.form.orgScope.length; },
    descLen() { return this.form.desc.length; },
    filteredOrgs() {
      return this.allOrgs.filter(o =>
        (!this.orgQuery.name || o.name.includes(this.orgQuery.name)) &&
        (!this.orgQuery.type || o.type === this.orgQuery.type)
      );
    },
    pagedOrgs() {
      const start = (this.orgPage - 1) * this.orgPageSize;
      return this.filteredOrgs.slice(start, start + this.orgPageSize);
    },
  },
  methods: {
    save() {
      if (!this.form.name) { this.$message.warning('请填写租户名称'); return; }
      this.$message.success('已保存');
      this.$root.go('P14');
    },
    openOrgDialog() {
      this.orgSelection = this.selectedOrgs.map(o => o.id);
      this.orgQuery = { name: '', type: '' };
      this.orgPage = 1;
      this.orgDialogVisible = true;
    },
    isOrgSelected(org) {
      return this.orgSelection.includes(org.id);
    },
    toggleOrg(org) {
      const idx = this.orgSelection.indexOf(org.id);
      if (idx >= 0) this.orgSelection.splice(idx, 1);
      else this.orgSelection.push(org.id);
    },
    toggleAllOrgs(checked) {
      if (checked) {
        this.pagedOrgs.forEach(o => {
          if (!this.orgSelection.includes(o.id)) this.orgSelection.push(o.id);
        });
      } else {
        const pageIds = this.pagedOrgs.map(o => o.id);
        this.orgSelection = this.orgSelection.filter(id => !pageIds.includes(id));
      }
    },
    isAllChecked() {
      return this.pagedOrgs.length > 0 && this.pagedOrgs.every(o => this.orgSelection.includes(o.id));
    },
    saveOrgSelection() {
      this.selectedOrgs = this.allOrgs.filter(o => this.orgSelection.includes(o.id));
      this.form.orgScope = this.selectedOrgs.map(o => o.name).join('、');
      this.orgDialogVisible = false;
    },
    removeOrg(org) {
      this.selectedOrgs = this.selectedOrgs.filter(o => o.id !== org.id);
      this.form.orgScope = this.selectedOrgs.map(o => o.name).join('、');
    },
    openImportDialog() {
      this.importFile = null;
      this.importDialogVisible = true;
    },
    confirmImport() {
      this.$message.success('已导入机构学校数据');
      this.importDialogVisible = false;
    },
  },
  template: `
  <div>

        </el-form-item>

          <el-radio-group v-model="form.tenantType">
            <el-radio value="行政租户">行政租户</el-radio>
            <el-radio value="业务租户">业务租户</el-radio>
          </el-radio-group>
        </el-form-item>
        <el-form-item label="租户范围">
          <div style="width:100%">
            <el-input type="textarea" v-model="form.orgScope" :rows="4" placeholder="请选择租户范围" readonly maxlength="500"
              style="margin-bottom:6px"></el-input>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div style="display:flex;gap:8px">
                <el-button type="primary" size="small" @click="openOrgDialog">添加机构和学校</el-button>
                <el-button type="primary" size="small" @click="openImportDialog">批量导入</el-button>
              </div>
              <span style="color:#909399;font-size:12px">{{ orgScopeLen }}/500</span>
            </div>
          </div>
        </el-form-item>
        <el-form-item label="租户说明">
          <div style="width:100%">
            <el-input type="textarea" v-model="form.desc" :rows="4" placeholder="填写入租户说明" maxlength="500"></el-input>
            <div style="display:flex;justify-content:flex-end;margin-top:4px">
              <span style="color:#909399;font-size:12px">{{ descLen }}/500</span>
            </div>
          </div>
        </el-form-item>
        <el-form-item class="form-actions">
          <el-button @click="$root.go('P14')">取消</el-button>
          <el-button type="primary" @click="save">保存</el-button>
        </el-form-item>
      </el-form>
    </div>

    <!-- 选择机构和学校弹窗 -->
    <el-dialog v-model="orgDialogVisible" title="请选择机构和学校" width="860px" :close-on-click-modal="false">
      <div style="display:flex;gap:16px;min-height:400px">
        <!-- 左侧：搜索 + 表格 -->
        <div style="flex:1;display:flex;flex-direction:column">
          <div style="margin-bottom:12px;display:flex;gap:10px;align-items:center">
            <el-input v-model="orgQuery.name" placeholder="名称" clearable style="width:180px" size="default"></el-input>
            <el-select v-model="orgQuery.type" placeholder="类型" clearable style="width:120px" size="default">
              <el-option label="教育厅" value="教育厅"></el-option>
              <el-option label="教育局" value="教育局"></el-option>
              <el-option label="学校" value="学校"></el-option>
            </el-select>
            <el-button type="primary" size="default">查询</el-button>
          </div>
          <el-table :data="pagedOrgs" border size="small" style="width:100%">
            <el-table-column width="44" align="center">
              <template #header>
                <el-checkbox :model-value="isAllChecked()" @change="toggleAllOrgs"></el-checkbox>
              </template>
              <template #default="s">
                <el-checkbox :model-value="isOrgSelected(s.row)" @change="toggleOrg(s.row)"></el-checkbox>
              </template>
            </el-table-column>
            <el-table-column prop="name" label="机构名称" min-width="160"></el-table-column>
            <el-table-column prop="parent" label="上级机构" min-width="140"></el-table-column>
            <el-table-column prop="id" label="机构ID" width="90"></el-table-column>
            <el-table-column label="已选学校" width="70" align="center">
              <template #default="s">
                <span v-if="isOrgSelected(s.row)" style="color:#409eff">&#10003;</span>
                <span v-else style="color:#c0c4cc">—</span>
              </template>
            </el-table-column>
          </el-table>
          <div style="display:flex;justify-content:flex-end;margin-top:10px">
            <el-pagination
              v-model:current-page="orgPage"
              :page-size="orgPageSize"
              :total="filteredOrgs.length"
              layout="total, prev, pager, next, sizes"
              :page-sizes="[10, 20, 50]"
              @size-change="v => { orgPageSize = v; orgPage = 1; }"
              small
            ></el-pagination>
          </div>
        </div>
        <!-- 右侧：已选择机构 -->
        <div style="width:200px;border-left:1px solid #e4e7ed;padding-left:14px;display:flex;flex-direction:column">

          <div style="flex:1;overflow-y:auto">
            <div v-for="id in orgSelection" :key="id" style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f2f3f5">
              <span style="font-size:13px">{{ (allOrgs.find(o=>o.id===id)||{}).name }}</span>
              <el-button link type="danger" size="small" @click="toggleOrg(allOrgs.find(o=>o.id===id))" style="font-size:14px;padding:0">×</el-button>
            </div>
            <div v-if="!orgSelection.length" style="color:#c0c4cc;font-size:12px;text-align:center;padding:20px 0">暂无选择</div>

    <!-- 批量导入弹窗 -->
    <el-dialog v-model="importDialogVisible" title="通过机构的学校" width="600px" :close-on-click-modal="false">

/* =====================================================================
 * P16 企业信息
 * 功能点：企业信息注册 / 企业信息查看 / 企业信息编辑
 * ===================================================================== */
app.component('P16', {
  data() {
    const v = VENDORS[0];
    return {
      edit: false,
      form: {
        // 基础信息
        name: v.name, type: v.type, isPublicSea: v.isPublicSea, socialCode: v.socialCode,
        legalPerson: v.legalPerson, admin: v.admin, adminPhone: v.phone,
        registerAddr: v.registerAddr, detailAddr: v.detailAddr, vatPayer: v.vatPayer,
        intro: v.intro, companyPhone: v.companyPhone, businessDeadline: v.businessDeadline, portal: v.portal,
        // 财务信息（选填）
        f_bankType: v.f_bankType || '', f_bankName: v.f_bankName || '', f_bankAccount: v.f_bankAccount || '', f_accountPurpose: v.f_accountPurpose || '',
        // 开票信息（选填）
        i_addr: v.i_addr || '', i_taxNo: v.i_taxNo || '', i_phone: v.i_phone || '', i_bank: v.i_bank || '', i_bankAcc: v.i_bankAcc || '', i_bankLine: v.i_bankLine || '',
        // 资质附件（选填）
        logo: v.logo || [], license: v.license || [],
      },
    };
  },
  methods: {
    save() {
      const f = this.form;
      const missing = [];
      if (!f.name) missing.push('厂商名称');
      if (!f.legalPerson) missing.push('法人代表');
      if (!f.admin) missing.push('管理员');
      if (!f.socialCode) missing.push('统一社会信用代码');
      if (!f.adminPhone) missing.push('管理员手机号');
      if (!f.registerAddr) missing.push('工商注册地址');
      if (!f.detailAddr) missing.push('详细地址');

app.component('P17', {
  data() {
    return {
      q: { name: '', status: '' },
      rows: SUBACCOUNTS.map(x=>({...x,mDel:false})),
      addVisible: false,
      addForm: { name: '', phone: '', expire: '' },
    };
  },
  computed: {
    filtered() {
      return this.rows.filter(r =>
        (!this.q.name || r.name.includes(this.q.name)) &&
        (!this.q.status || r.status === this.q.status));
    },
  },
  methods: {
    openAdd(){ this.addForm = { name:'', phone:'', expire:'' }; this.addVisible = true; },
    add(){
      const f = this.addForm;
      if(!f.name){ this.$message.warning('请填写员工姓名'); return; }
      if(!f.phone){ this.$message.warning('请填写员工手机号'); return; }
      if(!/^\d{11}$/.test(f.phone)){ this.$message.warning('员工手机号格式不正确'); return; }
      if(!f.expire){ this.$message.warning('请选择到期时间'); return; }
      const id = this.rows.length ? Math.max(...this.rows.map(x=>x.id)) + 1 : 1;
      this.rows.push({ id, name: f.name, phone: f.phone, create: new Date().toISOString().slice(0,10), expire: f.expire, status: '正常', mDel:false });
      this.addVisible = false; this.$message.success('已新增子账号');
    },
    del(r){ this.rows = this.rows.filter(x=>x.id!==r.id); this.$message.success('已删除子账号'); },
  },
  template: `
  <div>
    <div class="toolbar">
      <span class="q-label">员工姓名</span><el-input v-model="q.name" placeholder="请输入员工姓名" clearable style="width:160px"></el-input>
      <span class="q-label">状态</span><el-select v-model="q.status" placeholder="请选择" clearable style="width:120px">
        <el-option label="正常" value="正常"></el-option>
        <el-option label="已过期" value="已过期"></el-option>

      <div style="flex:1"></div>
      <el-button type="primary" @click="openAdd">新增子账号</el-button>
    </div>
    <div class="card">
      <el-table :data="filtered" stripe>
        <el-table-column prop="name" label="员工姓名" min-width="120"></el-table-column>
        <el-table-column prop="phone" label="员工手机号" min-width="140"></el-table-column>
        <el-table-column prop="create" label="添加时间" width="120"></el-table-column>
        <el-table-column prop="expire" label="到期时间" width="120"></el-table-column>
        <el-table-column label="状态" width="100"><template #default="s"><st-tag :v="s.row.status"/></template></el-table-column>
        <el-table-column label="操作" width="90"><template #default="s"><el-button link type="danger" @click="s.row.mDel=true">删除</el-button></template></el-table-column>
      </el-table>
    </div>
    <el-dialog v-model="addVisible" title="新增子账号" width="480px" append-to-body>
      <el-form label-width="110px" style="max-width:420px">
        <el-form-item label="员工姓名" required><el-input v-model="addForm.name" placeholder="请输入员工姓名" maxlength="50"></el-input></el-form-item>
        <el-form-item label="员工手机号" required><el-input v-model="addForm.phone" placeholder="请输入11位手机号" maxlength="11"></el-input></el-form-item>
        <el-form-item label="到期时间" required><el-date-picker v-model="addForm.expire" type="date" style="width:100%" placeholder="请选择到期时间"></el-date-picker></el-form-item>
      </el-form>
      <template #footer><el-button @click="addVisible=false">取消</el-button><el-button type="primary" @click="add">保存</el-button></template>
    </el-dialog>
    <el-dialog v-for="r in rows.filter(x=>x.mDel)" :key="r.id" :model-value="r.mDel" title="删除子账号" width="400px">
      <p>确定删除子账号「{{ r.name }}」吗？删除后无法恢复。</p>
      <template #footer><el-button @click="r.mDel=false">取消</el-button><el-button type="danger" @click="del(r)">删除</el-button></template>
    </el-dialog>
  </div>`,
});

app.component('P20', {
  props: ['ctx'],
  data() {
    const a = APIS.find(x=>x.id===(this.ctx&&this.ctx.apiId));
    return { api: a || APIS[0] };
  },
  computed: {
    reqExample() {
      const ps = (this.api.params||[]).filter(x=>x.required).map(x=>'&'+x.name+'='+(x.type==='string'?'示例值':'1')).join('');
      return this.api.methods[0]+' '+this.api.reqUrl+'?access_token=ACCESS_TOKEN'+ps;
    },
    resExample() {
      const d = {}; (this.api.params||[]).forEach(p=>{ d[p.name] = p.type==='string'?'示例值':(p.type==='int32'?1:true); });
      return JSON.stringify({ errcode:0, errmsg:'ok', data:d }, null, 2);
    },
  },
  template: `
  <div>
    <div class="doc-header">
      <h2>{{ api.name }}</h2>
      <p>使用场景：{{ api.name }}，服务名 {{ api.service }}</p>
    </div>

    <div class="doc-label">权限说明：</div>
    <table class="doc-tbl">
      <tr><th style="width:35%">权限项</th><th style="width:25%">说明</th><th>备注</th></tr>
      <tr><td>应用是否需要申请白名单</td><td>{{ api.needAuth ? '需要' : '不需要' }}</td><td></td></tr>
      <tr><td>用户凭证</td><td>未支持</td><td></td></tr>
      <tr><td>机构凭证</td><td>支持</td><td>获取不到用户凭证的后台管理场景使用</td></tr>

      <el-form ref="formRef" :model="form" :rules="rules" label-width="110px">
        <el-form-item label="应用 Logo" required>
          <el-upload action="#" list-type="picture-card" :auto-upload="false" :limit="1" accept=".jpg,.jpeg,.png,.gif"
            :file-list="form.logoList" :on-change="(f,l)=>{form.logoList=l;}" :on-remove="(f,l)=>{form.logoList=l;}">
            <i class="el-icon-plus"></i>
            <template #tip><div style="color:#909399;font-size:12px;line-height:1.5;margin-top:4px">建议尺寸 200×200 像素，不超过 2MB</div></template>
          </el-upload>
        </el-form-item>
        <el-form-item label="应用名称" prop="name">
          <el-input v-model="form.name" maxlength="20" show-word-limit placeholder="请输入应用名称" style="max-width:480px"></el-input>
        </el-form-item>
        <el-form-item label="应用简介" prop="desc">
          <el-input v-model="form.desc" maxlength="100" show-word-limit type="textarea" :rows="3" placeholder="请输入应用简介" style="max-width:600px"></el-input>
        </el-form-item>
        <el-form-item label="所属分类" prop="category">
          <el-select v-model="form.category" placeholder="请选择" style="width:260px">
            <el-option label="教学管理" value="教学管理"></el-option>
            <el-option label="校园办公" value="校园办公"></el-option>
            <el-option label="教务管理" value="教务管理"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="是否数据同步" required>
          <el-radio-group v-model="form.dataSync"><el-radio :value="false">否</el-radio><el-radio :value="true">是</el-radio></el-radio-group>
        </el-form-item>
        <el-form-item label="打开方式" required>
          <el-checkbox-group v-model="form.openType">
            <el-checkbox label="PCweb"></el-checkbox>
            <el-checkbox label="H5"></el-checkbox>
            <el-checkbox label="独立小程序"></el-checkbox>
          </el-checkbox-group>
        </el-form-item>
        <el-form-item label="应用详情介绍" required>
          <div style="border:1px solid #dcdfe6;border-radius:4px;width:100%;max-width:100%;box-sizing:border-box">
            <div style="padding:6px 12px;border-bottom:1px solid #ebeef5;background:#fafafa;display:flex;gap:12px;flex-wrap:wrap">
              <button type="button" style="border:none;background:none;cursor:pointer;font-size:14px;padding:0 4px" title="加粗"><b>B</b></button>
              <button type="button" style="border:none;background:none;cursor:pointer;font-size:14px;padding:0 4px" title="斜体"><i>I</i></button>
              <button type="button" style="border:none;background:none;cursor:pointer;font-size:14px;padding:0 4px" title="下划线"><u>U</u></button>
              <span style="color:#dcdfe6">|</span>
              <button type="button" style="border:none;background:none;cursor:pointer;font-size:14px;padding:0 4px;color:#409eff">图片</button>
              <button type="button" style="border:none;background:none;cursor:pointer;font-size:14px;padding:0 4px;color:#409eff">视频</button>
              <button type="button" style="border:none;background:none;cursor:pointer;font-size:14px;padding:0 4px;color:#409eff">超链接</button>
            </div>
            <div contenteditable="true" style="min-height:120px;padding:10px 12px;outline:none;font-size:14px;color:#606266" placeholder="请上传应用图文介绍、操作文档、演示视频...">请上传应用图文介绍、操作文档、演示视频...</div>
            <div style="padding:6px 12px;border-top:1px solid #ebeef5;color:#909399;font-size:12px">支持图文混排、超链接和多媒体嵌入</div>
          </div>
        </el-form-item>
        <el-form-item label="应用视频介绍">
          <el-upload action="#" drag multiple :auto-upload="false" :limit="5" accept=".mp4,.mov,.avi"
            :file-list="form.videoList" :on-change="(f,l)=>{form.videoList=l;}" :on-remove="(f,l)=>{form.videoList=l;}">
            <el-icon class="el-icon--upload"><i class="el-icon-upload2"></i></el-icon>
            <div style="margin-top:4px"><em>点击或拖拽文件到此处上传</em></div>
            <template #tip><div style="color:#909399;font-size:12px">最多 5 个视频，单个不超过 10MB</div></template>
          </el-upload>
        </el-form-item>
      </el-form>
    </div>

    <div class="card" style="width:100%;max-width:100%;box-sizing:border-box;margin-top:20px">
      <div style="font-size:14px;font-weight:600;border-bottom:1px solid #ebeef5;padding-bottom:10px;margin-bottom:18px;color:#303133">适用范围</div>
      <el-form label-width="110px">
        <el-form-item label="适用机构" required>
          <el-checkbox-group v-model="form.scopeOrgs">
            <el-checkbox label="学校"></el-checkbox>
            <el-checkbox label="上级单位"></el-checkbox>
          </el-checkbox-group>
        </el-form-item>
        <el-form-item label="适用学段" required>
          <el-radio-group v-model="form.scopeGradeMode">
            <el-radio value="all">所有学段</el-radio>
            <el-radio value="part">部分学段</el-radio>
          </el-radio-group>
        </el-form-item>
        <el-form-item label="" v-if="form.scopeGradeMode==='part'">
          <el-checkbox-group v-model="form.grades">
            <el-checkbox label="小学"></el-checkbox><el-checkbox label="初中"></el-checkbox><el-checkbox label="高中"></el-checkbox>
          </el-checkbox-group>
        </el-form-item>
      </el-form>
    </div>

    <div class="card" style="width:100%;max-width:100%;box-sizing:border-box;margin-top:20px">
      <div style="font-size:14px;font-weight:600;border-bottom:1px solid #ebeef5;padding-bottom:10px;margin-bottom:18px;color:#303133">应用属性</div>
      <el-form label-width="110px">
        <el-form-item label="应用属性" required>
          <el-select v-model="form.attr" placeholder="请选择" style="width:300px">
            <el-option label="原生应用 / 自建应用" value="原生应用 / 自建应用"></el-option>
            <el-option label="原生应用 / 低代码应用" value="原生应用 / 低代码应用"></el-option>
            <el-option label="生态应用" value="生态应用"></el-option>
          </el-select>
        </el-form-item>
      </el-form>
    </div>

    <div class="card" style="width:100%;max-width:100%;box-sizing:border-box;margin-top:20px">
      <div style="font-size:14px;font-weight:600;border-bottom:1px solid #ebeef5;padding-bottom:10px;margin-bottom:18px;color:#303133">可见性配置</div>
      <el-form label-width="110px">
        <el-form-item label="PC 端角色" required>
          <el-checkbox-group v-model="form.pcRoles">
            <el-checkbox label="教育局职工"></el-checkbox><el-checkbox label="学生"></el-checkbox><el-checkbox label="学校教职工"></el-checkbox><el-checkbox label="家长"></el-checkbox><el-checkbox label="毕业生"></el-checkbox>
          </el-checkbox-group>
        </el-form-item>
        <el-form-item label="PC 端地址" required v-if="form.openType.includes('PCweb')">
          <el-input v-model="form.pcUrl" placeholder="https://" style="max-width:400px"></el-input>
        </el-form-item>
        <el-form-item label="H5 角色" required v-if="form.openType.includes('H5')">
          <el-checkbox-group v-model="form.h5Roles">
            <el-checkbox label="教育局职工"></el-checkbox><el-checkbox label="学生"></el-checkbox><el-checkbox label="学校教职工"></el-checkbox><el-checkbox label="家长"></el-checkbox><el-checkbox label="毕业生"></el-checkbox>
          </el-checkbox-group>
        </el-form-item>
        <el-form-item label="H5 地址" required v-if="form.openType.includes('H5')">
          <el-input v-model="form.h5Url" placeholder="https://" style="max-width:400px"></el-input>
        </el-form-item>
      </el-form>
    </div>

    <div style="margin-top:24px;text-align:center">
      <el-button @click="$root.go('P28')">取消</el-button>
      <el-button type="primary" @click="submit">提交申请</el-button>
    </div>
    </template>
  </div>`,
  data(){ return {
    app:{}, form:{ name:'', desc:'', category:'', dataSync:false, openType:['PCweb','H5'], logoList:[], videoList:[],
          scopeOrgs:['学校'], scopeGradeMode:'all', grades:[], attr:'', pcRoles:['教育局职工','学生','学校教职工'], pcUrl:'', h5Roles:['教育局职工','学生','学校教职工'], h5Url:'' },
    rules:{ name:[{required:true,message:'请输入应用名称',trigger:'blur'}], desc:[{required:true,message:'请输入应用简介',trigger:'blur'}], category:[{required:true,message:'请选择所属分类',trigger:'change'}] },
  };},
  computed:{
    mode(){ return this.$root.ctx?.mode || (this.$root.ctx?.id ? 'view' : 'add'); },
    isEdit(){ return this.mode==='edit'; },
    isView(){ return this.mode==='view'; },
    title(){ return this.isView ? '查看应用' : (this.isEdit ? '编辑应用' : '新增应用'); },
  },
  created(){
    const id=this.$root.ctx?.id;
    if(id){
      const a = this.$root.apps?.find(x=>x.appId===id);
      if(a){ this.app=a; if(this.isEdit){ const d=a.d||{}; this.form={ name:a.name, desc:d.desc||'', category:a.category, dataSync:!!d.dataSync, openType:d.openType||['PCweb','H5'], logoList:[], videoList:[], scopeOrgs:d.scopeOrgs||['学校'], scopeGradeMode:d.scopeGradeMode||'all', grades:d.grades||[], attr:d.attr||'', pcRoles:d.pcRoles||[], pcUrl:d.pcUrl||'', h5Roles:d.h5Roles||[], h5Url:d.h5Url||'' }; } }
    }
  },
  methods:{ submit(){ this.$refs.formRef.validate(ok=>{ if(!ok)return; this.$message.success('应用信息已提交，等待桂教通管理员审核'); this.$root.go('P28'); }); } },
});

/* =====================================================================
 * P30 客户端授权关联（桂教通超管）
 * 列表：客户端ID / 客户端秘钥 / 授权范围 / 使用状态（使用中/未使用）
 *     / 授权类型 / 回调地址 / 登出后回调地址 / 访问令牌有效期(秒)
 *     / 刷新令牌有效期(秒) / 操作（编辑、启用、停用）
 * P31 新增/编辑（弹窗，字段同列表除使用状态，全部必填；授权范围规则同 API 申请）
 * ===================================================================== */
app.component('P30', {
  data() {
    return {
      clients: CLIENT_AUTH.map(x => ({ ...x })),
      q: { clientId: '', useStatus: '', authType: '' },
      showSecret: new Set(),
      dialog: false,
      dialogTitle: '新增客户端授权',
      editingId: null,
      form: {
        clientId: '', clientSecret: '', syncRangeType: '机构', orgs: '', includeSub: '否',
        authType: 'authorization_code', redirectUri: '', logoutRedirectUri: '',
        accessTokenExp: 7200, refreshTokenExp: 2592000,
      },
      authTypeOptions: [
        { value: 'authorization_code', label: 'authorization_code（授权码）' },
        { value: 'client_credentials', label: 'client_credentials（客户端凭证）' },
        { value: 'implicit', label: 'implicit（隐式）' },
        { value: 'password', label: 'password（密码）' },
      ],
    };
  },
  computed: {
    filtered() {
      return this.clients.filter(r =>
        (!this.q.clientId || r.clientId.includes(this.q.clientId)) &&
        (!this.q.useStatus || r.useStatus === this.q.useStatus) &&
        (!this.q.authType || r.authType === this.q.authType)
      );
    },
    showIncludeSub() { return this.form.syncRangeType === '机构'; },
  },
  methods: {
    resetQ() { this.q = { clientId: '', useStatus: '', authType: '' }; },
    maskSecret(s) {
      if (!s) return '';
      if (s.length <= 6) return s;
      return s.slice(0, 4) + '****' + s.slice(-4);
    },
    toggleSecret(row) {
      const next = new Set(this.showSecret);
      if (next.has(row.clientId)) next.delete(row.clientId); else next.add(row.clientId);
      this.showSecret = next;
    },
    scopeText(r) {
      const prefix = r.syncRangeType === '机构' ? '机构' : '学校';
      const sub = r.syncRangeType === '机构' ? (r.includeSub === '是' ? '（含下级）' : '（不含下级）') : '';
      return prefix + '：' + r.orgs + sub;
    },
    onRangeChange() {
      if (this.form.syncRangeType !== '机构') { this.form.includeSub = ''; }
      else if (!this.form.includeSub) { this.form.includeSub = '否'; }
    },
    genId() { return 'client_' + Math.random().toString(36).slice(2, 8); },
    genSecret() { return 'sct_' + Math.random().toString(36).slice(2, 18); },
    openAdd() {
      this.dialogTitle = '新增客户端授权';
      this.editingId = null;
      this.form = { clientId: this.genId(), clientSecret: this.genSecret(), syncRangeType: '机构', orgs: '', includeSub: '否', authType: 'authorization_code', redirectUri: '', logoutRedirectUri: '', accessTokenExp: 7200, refreshTokenExp: 2592000 };
      this.dialog = true;
    },
    openEdit(row) {
      this.dialogTitle = '编辑客户端授权';
      this.editingId = row.clientId;
      this.form = { ...row };
      this.dialog = true;
    },
    submit() {
      if (!this.form.clientId.trim()) { this.$message.warning('请填写客户端ID'); return; }
      if (!this.form.clientSecret.trim()) { this.$message.warning('请填写客户端秘钥'); return; }
      if (!this.form.syncRangeType) { this.$message.warning('请选择同步范围类型'); return; }
      if (!this.form.orgs.trim()) { this.$message.warning('请填写机构名称'); return; }
      if (this.showIncludeSub && !this.form.includeSub) { this.$message.warning('请选择是否包含下级'); return; }
      if (!this.form.authType) { this.$message.warning('请选择授权类型'); return; }
      if (!this.form.redirectUri.trim()) { this.$message.warning('请填写回调地址'); return; }
      if (!this.form.logoutRedirectUri.trim()) { this.$message.warning('请填写登出后回调地址'); return; }
      if (!this.form.accessTokenExp || this.form.accessTokenExp <= 0) { this.$message.warning('请填写访问令牌有效期'); return; }
      if (this.form.refreshTokenExp === '' || this.form.refreshTokenExp === null) { this.$message.warning('请填写刷新令牌有效期'); return; }
      const data = { ...this.form, useStatus: this.editingId ? (this.clients.find(x => x.clientId === this.editingId) || {}).useStatus || '未使用' : '未使用' };
      if (this.editingId) {
        const idx = this.clients.findIndex(x => x.clientId === this.editingId);
        if (idx > -1) this.clients.splice(idx, 1, data);
        this.$message.success('客户端授权已保存');
      } else {
        this.clients.unshift(data);
        this.$message.success('客户端授权已新增');
      }
      this.dialog = false;
    },
    toggleStatus(row) {
      const next = row.useStatus === '使用中' ? '未使用' : '使用中';
      this.$confirm('确认将客户端「' + row.clientId + '」' + (next === '使用中' ? '启用' : '停用') + '？', '提示', { type: 'warning', confirmButtonText: '确定', cancelButtonText: '取消' })
        .then(() => { row.useStatus = next; this.$message.success('已' + (next === '使用中' ? '启用' : '停用')); })
        .catch(() => {});
    },
  },
  template: `
  <div>
    <div class="toolbar">
      <span class="q-label">客户端ID</span><el-input v-model="q.clientId" placeholder="请输入" clearable style="width:160px"></el-input>
      <span class="q-label">使用状态</span><el-select v-model="q.useStatus" placeholder="请选择" clearable style="width:130px">
        <el-option label="使用中" value="使用中"></el-option><el-option label="未使用" value="未使用"></el-option>
      </el-select>
      <span class="q-label">授权类型</span><el-select v-model="q.authType" placeholder="请选择" clearable style="width:200px">
        <el-option v-for="o in authTypeOptions" :key="o.value" :label="o.label" :value="o.value"></el-option>
      </el-select>
      <el-button @click="resetQ">重置</el-button>
      <div style="flex:1"></div>
      <el-button type="primary" @click="openAdd">新增</el-button>
    </div>
    <div class="card">
      <el-table :data="filtered" stripe style="width:100%">
      <el-table-column prop="clientId" label="客户端ID" min-width="130"></el-table-column>
      <el-table-column label="客户端秘钥" min-width="220">
        <template #default="{row}">
          <span style="font-family:monospace">{{ showSecret.has(row.clientId) ? row.clientSecret : maskSecret(row.clientSecret) }}</span>
          <el-button link type="primary" size="small" style="margin-left:6px" @click="toggleSecret(row)">{{ showSecret.has(row.clientId) ? '隐藏' : '👁' }}</el-button>
        </template>
      </el-table-column>
      <el-table-column label="授权范围" min-width="220">
        <template #default="{row}"><span>{{ scopeText(row) }}</span></template>
      </el-table-column>
      <el-table-column label="使用状态" width="100" align="center">
        <template #default="{row}"><st-tag :v="row.useStatus"></st-tag></template>
      </el-table-column>
      <el-table-column prop="authType" label="授权类型" min-width="170"></el-table-column>
      <el-table-column prop="redirectUri" label="回调地址" min-width="200" show-overflow-tooltip></el-table-column>
      <el-table-column prop="logoutRedirectUri" label="登出后回调地址" min-width="200" show-overflow-tooltip></el-table-column>
      <el-table-column prop="accessTokenExp" label="访问令牌有效期(秒)" width="130" align="center"></el-table-column>
      <el-table-column prop="refreshTokenExp" label="刷新令牌有效期(秒)" width="140" align="center"></el-table-column>
      <el-table-column label="操作" width="200" align="center" fixed="right">
        <template #default="{row}">
          <el-button link type="primary" @click="openEdit(row)">编辑</el-button>
          <el-button link :type="row.useStatus==='使用中'?'warning':'primary'" @click="toggleStatus(row)">{{ row.useStatus==='使用中'?'停用':'启用' }}</el-button>
        </template>
      </el-table-column>
    </el-table>
    </div>

    <el-dialog :title="dialogTitle" v-model="dialog" width="720px">
      <el-form label-width="140px" style="width:100%">
        <el-form-item label="客户端ID" required>
          <el-input v-model="form.clientId" placeholder="系统自动生成，可修改"></el-input>
        </el-form-item>
        <el-form-item label="客户端秘钥" required>
          <el-input v-model="form.clientSecret" placeholder="系统自动生成，可修改"></el-input>
        </el-form-item>
        <el-form-item label="同步范围类型" required>
          <el-radio-group v-model="form.syncRangeType" @change="onRangeChange">
            <el-radio value="机构">机构</el-radio><el-radio value="学校">学校</el-radio>
          </el-radio-group>
        </el-form-item>
        <el-form-item label="机构名称" required>
          <el-input v-model="form.orgs" type="textarea" :rows="3" maxlength="500" show-word-limit placeholder="请输入完整机构名称，多个机构用英文分号（;）隔开"></el-input>
        </el-form-item>
        <el-form-item v-if="showIncludeSub" label="是否包含下级" required>
          <el-radio-group v-model="form.includeSub"><el-radio value="是">是</el-radio><el-radio value="否">否</el-radio></el-radio-group>
        </el-form-item>
        <el-form-item label="授权类型" required>
          <el-select v-model="form.authType" style="width:100%"><el-option v-for="o in authTypeOptions" :key="o.value" :label="o.label" :value="o.value"></el-option></el-select>
        </el-form-item>
        <el-form-item label="回调地址" required>
          <el-input v-model="form.redirectUri" placeholder="请输入回调地址"></el-input>
        </el-form-item>
        <el-form-item label="登出后回调地址" required>
          <el-input v-model="form.logoutRedirectUri" placeholder="请输入登出后回调地址"></el-input>
        </el-form-item>
        <el-form-item label="访问令牌有效期(秒)" required>
          <el-input-number v-model="form.accessTokenExp" :min="1" :max="86400" controls-position="right" style="width:100%"></el-input-number>
        </el-form-item>
        <el-form-item label="刷新令牌有效期(秒)" required>
          <el-input-number v-model="form.refreshTokenExp" :min="0" :max="2592000" controls-position="right" style="width:100%"></el-input-number>
          <div style="color:#909399;font-size:12px;margin-top:4px">0 表示不颁发刷新令牌</div>
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="dialog=false">取消</el-button>
        <el-button type="primary" @click="submit">保存</el-button>
      </template>
    </el-dialog>
  </div>`,
});

app.mount('#app');
</script>
</body>
</html>
